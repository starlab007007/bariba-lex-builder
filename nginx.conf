server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Android install landing page: always resolve to the React SPA, including
    # when marketing query parameters are attached.
    location = /install {
        try_files /index.html =404;
    }
    location = /install/ {
        try_files /index.html =404;
    }

    # React route /classe conflicts with the physical /classe directory
    # used for pedagogical images. Exact matches must go to the SPA, while
    # /classe/*.png and other assets remain served as static files.
    location = /classe {
        try_files /index.html =404;
    }

    location = /classe/ {
        try_files /index.html =404;
    }

    # DUNYA offline packs (voice models), stored outside dist so deploys keep
    # them. ^~ stops the regex cache rule below; missing files are real 404s,
    # never the SPA index. Range requests let phones resume big downloads.
    location = /dunya-packs/android/releases.json {
        alias /usr/share/nginx/dunya-packs/android/releases.json;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        add_header Access-Control-Allow-Origin "*";
    }

    location ^~ /dunya-packs/android/ {
        root /usr/share/nginx;
        try_files $uri =404;
        default_type application/vnd.android.package-archive;
        add_header Content-Disposition "attachment" always;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location ^~ /dunya-packs/ {
        alias /usr/share/nginx/dunya-packs/;
        autoindex off;
        gzip off;
        add_header Cache-Control "public, max-age=3600";
        add_header Access-Control-Allow-Origin "*";
    }

    # SPA routing - all routes redirect to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Never cache index.html so new deploys are picked up immediately
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires 0;
    }

    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires 0;
    }

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|webp|mp3|mp4|webm|json)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
    gzip_min_length 1000;
}
