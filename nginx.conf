server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # React route /classe conflicts with the physical /classe directory
    # used for pedagogical images. Exact matches must go to the SPA, while
    # /classe/*.png and other assets remain served as static files.
    location = /classe {
        try_files /index.html =404;
    }

    location = /classe/ {
        try_files /index.html =404;
    }

    # DUNYA offline packs (voice models), stored outside dist so deploys keep
    # them. ^~ stops the regex cache rule below; missing files are real 404s,
    # never the SPA index. Range requests let phones resume big downloads.
    location ^~ /dunya-packs/ {
        alias /usr/share/nginx/dunya-packs/;
        autoindex off;
        gzip off;
        add_header Cache-Control "public, max-age=3600";
        add_header Access-Control-Allow-Origin "*";
    }

    # SPA routing - all routes redirect to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Never cache index.html so new deploys are picked up immediately
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires 0;
    }

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|webp|mp3|mp4|webm|json)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
    gzip_min_length 1000;
}
