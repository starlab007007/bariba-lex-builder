services:
  react-app-bariba:
    image: nginx:alpine
    container_name: react-app-bariba-js
    restart: always
    volumes:
      - ./dist:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./dunya-packs:/usr/share/nginx/dunya-packs:ro
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.react-app-bariba.rule=Host(`fitila.bj`)"
      - "traefik.http.routers.react-app-bariba.entrypoints=websecure"
      - "traefik.http.routers.react-app-bariba.tls.certresolver=myresolver"
      - "traefik.http.services.react-app-bariba.loadbalancer.server.port=80"
      - "traefik.port=80"
    ports:
      - 8085:80
    networks:
      - web

  dunya-brain:
    image: ghcr.io/starlab007007/bariba-lex-builder-brain-gateway:latest
    container_name: fitila-dunya-brain
    restart: unless-stopped
    mem_limit: 5g
    cpus: "2.0"
    environment:
      FITILA_MODEL_API_TOKEN: ${FITILA_MODEL_API_TOKEN:?}
    volumes:
      - ./dunya-packs/brain:/models:ro
      - brain-gateway-cache:/srv/cache
    labels:
      - "traefik.enable=false"
    networks:
      - web

  bariba-voice-gateway:
    image: ghcr.io/starlab007007/bariba-lex-builder-voice-gateway:latest
    container_name: bariba-voice-gateway
    restart: always
    environment:
      FITILA_MODEL_API_TOKEN: ${FITILA_MODEL_API_TOKEN:?}
    volumes:
      - voice-gateway-cache:/srv/.cache
    ports:
      # Loopback uniquement : sert au health-check local (déploiement,
      # watchdog) ; l'accès public passe par Traefik (voir labels), jamais
      # par ce port directement.
      - "127.0.0.1:8090:8090"
    labels:
      - "traefik.enable=true"
      # Chemin sur le domaine fitila.bj existant plutôt qu'un sous-domaine :
      # pas de nouvel enregistrement DNS ni d'attente de propagation, le
      # certificat TLS de fitila.bj couvre déjà ce chemin.
      - "traefik.http.middlewares.bariba-voice-gateway-strip.stripprefix.prefixes=/voice-api"
      - "traefik.http.routers.bariba-voice-gateway.rule=Host(`fitila.bj`) && PathPrefix(`/voice-api`)"
      - "traefik.http.routers.bariba-voice-gateway.priority=100"
      - "traefik.http.routers.bariba-voice-gateway.middlewares=bariba-voice-gateway-strip"
      - "traefik.http.routers.bariba-voice-gateway.entrypoints=websecure"
      - "traefik.http.routers.bariba-voice-gateway.tls.certresolver=myresolver"
      - "traefik.http.services.bariba-voice-gateway.loadbalancer.server.port=8090"
    networks:
      - web

networks:
  web:
    external: true

volumes:
  voice-gateway-cache:
  brain-gateway-cache:
