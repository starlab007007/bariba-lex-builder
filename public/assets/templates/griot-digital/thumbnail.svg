<svg xmlns="http://www.w3.org/2000/svg" width="400" height="300" viewBox="0 0 400 300">
  <defs>
    <linearGradient id="parchmentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F5E6D3"/>
      <stop offset="50%" style="stop-color:#E8D4BC"/>
      <stop offset="100%" style="stop-color:#D4C4A8"/>
    </linearGradient>
    <filter id="paper" x="0%" y="0%" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="5" result="noise"/>
      <feDiffuseLighting in="noise" lighting-color="#F5E6D3" surfaceScale="2" result="light">
        <feDistantLight azimuth="45" elevation="60"/>
      </feDiffuseLighting>
    </filter>
    <radialGradient id="glow" cx="50%" cy="40%" r="50%">
      <stop offset="0%" style="stop-color:#FFD700;stop-opacity:0.4"/>
      <stop offset="100%" style="stop-color:#FFD700;stop-opacity:0"/>
    </radialGradient>
  </defs>
  
  <!-- Parchment background -->
  <rect width="400" height="300" fill="url(#parchmentGrad)"/>
  <rect width="400" height="300" fill="url(#parchmentGrad)" filter="url(#paper)" opacity="0.3"/>
  
  <!-- Warm glow -->
  <ellipse cx="200" cy="120" rx="150" ry="100" fill="url(#glow)"/>
  
  <!-- Sankofa symbol (stylized) -->
  <g transform="translate(200, 130)" fill="#8B4513">
    <!-- Heart shape base -->
    <path d="M0,-40 C20,-60 50,-40 50,-10 C50,20 25,45 0,60 C-25,45 -50,20 -50,-10 C-50,-40 -20,-60 0,-40" 
          stroke="#5D3A1A" stroke-width="2" fill="#8B4513"/>
    <!-- Bird head looking back -->
    <circle cx="-15" cy="-20" r="12" fill="#5D3A1A"/>
    <path d="M-25,-25 L-35,-20 L-25,-15" fill="#5D3A1A"/>
    <!-- Eye -->
    <circle cx="-12" cy="-22" r="3" fill="#F5E6D3"/>
  </g>
  
  <!-- Decorative border -->
  <rect x="10" y="10" width="380" height="280" fill="none" stroke="#8B4513" stroke-width="2" rx="5"/>
  <rect x="20" y="20" width="360" height="260" fill="none" stroke="#8B4513" stroke-width="1" stroke-dasharray="10,5" rx="3"/>
  
  <!-- Title -->
  <text x="200" y="240" text-anchor="middle" font-family="Georgia, serif" font-size="24" fill="#5D3A1A" font-weight="bold">
    Griot Digital
  </text>
  <text x="200" y="265" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#8B6914">
    Traditional Storytelling
  </text>
  
  <!-- Corner decorations -->
  <g fill="#8B4513" opacity="0.6">
    <circle cx="30" cy="30" r="5"/>
    <circle cx="370" cy="30" r="5"/>
    <circle cx="30" cy="270" r="5"/>
    <circle cx="370" cy="270" r="5"/>
  </g>
  
  <!-- Subtle lens flare hint -->
  <circle cx="320" cy="60" r="15" fill="#FFD700" opacity="0.3"/>
  <circle cx="320" cy="60" r="8" fill="#FFFFFF" opacity="0.5"/>
</svg>
