name: Apply FITILA Creation Live and Immersive Feed Patches

on:
  push:
    branches:
      - release/fitila-flutter-android-v1.8.1-build12-web-parity
    paths:
      - .github/workflows/apply-live-feed-patches.yml

permissions:
  contents: write

jobs:
  apply-validate-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout release branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Reconstruct and verify patches
        shell: bash
        run: |
          set -euo pipefail
          cat .patches/creation_*.b64 | tr -d '\n\r' | base64 -d | gunzip > /tmp/creation.patch
          cat .patches/live_*.b64 | tr -d '\n\r' | base64 -d | gunzip > /tmp/live.patch
          cat .patches/feed_*.b64 | tr -d '\n\r' | base64 -d | gunzip > /tmp/feed.patch
          echo "41d9e706b6cce4b6f720841b786e7c8684bb6bc3bc1a9adc601395515cf5f2bc  /tmp/creation.patch" | sha256sum -c -
          echo "1e541d8d95ed3fa34a1297102878e6ccb1be08e791b88fd9b9d4130e6fc7f70d  /tmp/live.patch" | sha256sum -c -
          echo "a13fe3c16e2ac046a60f683277e0d8bdf6b993250e2735e5bbbcecd5e65f66fa  /tmp/feed.patch" | sha256sum -c -
          git status --short

      - name: Configure Git
        run: |
          git config user.name "OpenAI"
          git config user.email "noreply@openai.com"

      - name: Apply updated six creation IA features patch
        shell: bash
        run: |
          set -euo pipefail
          git apply --reject --whitespace=nowarn /tmp/creation.patch || true

          # Exactly three hunks overlap with the older IA implementation already online.
          test -f fitila_flutter/lib/core/fitila_backend.dart.rej
          test -f fitila_flutter/lib/main.dart.rej
          test "$(grep -c '^@@ ' fitila_flutter/lib/core/fitila_backend.dart.rej)" -eq 1
          test "$(grep -c '^@@ ' fitila_flutter/lib/main.dart.rej)" -eq 2

          # Backend block is already present. Verify all methods before discarding its reject.
          for symbol in submitBattleResponse fetchBattleChain fetchMyBattleStats saveCorpusContribution fetchCorpusContributionCount registerHanduniaWasaInterest; do
            grep -q "$symbol" fitila_flutter/lib/core/fitila_backend.dart
          done

          # The large rejected main.dart hunk is the previous generation of the six IA screens.
          # Replace that whole terminal block with the updated block carried by this patch.
          python - <<'PY'
          from pathlib import Path
          import re

          patch = Path('/tmp/creation.patch').read_text(encoding='utf-8')
          main_path = Path('fitila_flutter/lib/main.dart')
          main = main_path.read_text(encoding='utf-8')

          mdiff = re.search(
              r'diff --git a/fitila_flutter/lib/main\.dart b/fitila_flutter/lib/main\.dart\n(.*?)(?=\ndiff --git |\Z)',
              patch,
              re.S,
          )
          if not mdiff:
              raise SystemExit('main.dart diff not found in creation patch')

          h = re.search(
              r'@@ -18914,3 \+19018,1635 @@ const _fitilaTemplates = \[\n(.*)',
              mdiff.group(1),
              re.S,
          )
          if not h:
              raise SystemExit('updated IA screens hunk not found')

          old_count = new_count = 0
          added = []
          for line in h.group(1).splitlines():
              if line.startswith('@@ '):
                  break
              if line.startswith(' '):
                  old_count += 1
                  new_count += 1
              elif line.startswith('-'):
                  old_count += 1
              elif line.startswith('+'):
                  new_count += 1
                  added.append(line[1:])
              elif line.startswith('\\'):
                  pass
              else:
                  if old_count >= 3 and new_count >= 1635:
                      break
              if old_count >= 3 and new_count >= 1635:
                  break

          if old_count != 3 or new_count != 1635:
              raise SystemExit(f'unexpected IA hunk counts: old={old_count}, new={new_count}')

          block = '\n'.join(added)
          creation_marker = '// Création de contenu — 6 fonctionnalités IA validées le 15/09/2026 :'
          marker_pos = main.find(creation_marker)
          if marker_pos < 0:
              raise SystemExit('existing IA creation block marker not found')
          block_start = main.rfind('// ═════════', 0, marker_pos)
          if block_start < 0:
              raise SystemExit('existing IA creation block start not found')

          replacement = block.lstrip('\n') + '\n'
          main_path.write_text(main[:block_start] + replacement, encoding='utf-8')
          PY

          rm -f fitila_flutter/lib/core/fitila_backend.dart.rej fitila_flutter/lib/main.dart.rej

          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "feat(creation-ia): merge updated six creation IA features"
          else
            echo "Updated creation IA revision is already fully represented."
          fi

      - name: Apply Live Griot and Handunia Wasa patch
        shell: bash
        run: |
          set -euo pipefail
          git apply --reject --whitespace=nowarn /tmp/live.patch || true

          # The supplied live patch was authored on an intermediate local state
          # that is not included in the three supplied patches (audio capsule +
          # community Handunia fragment editor). Rebuild the two affected IA
          # classes deterministically from the Creation IA patch baseline, then
          # add only the Live patch's intended functional changes.
          python - <<'PY'
          from pathlib import Path
          import re

          main_path = Path('fitila_flutter/lib/main.dart')
          main = main_path.read_text(encoding='utf-8')
          creation_patch = Path('/tmp/creation.patch').read_text(encoding='utf-8')

          # Extract the full IA block added by the creation patch.
          mdiff = re.search(
              r'diff --git a/fitila_flutter/lib/main\.dart b/fitila_flutter/lib/main\.dart\n(.*?)(?=\ndiff --git |\Z)',
              creation_patch,
              re.S,
          )
          if not mdiff:
              raise SystemExit('Creation IA main.dart diff not found')
          h = re.search(
              r'@@ -18914,3 \+19018,1635 @@ const _fitilaTemplates = \[\n(.*)',
              mdiff.group(1),
              re.S,
          )
          if not h:
              raise SystemExit('Creation IA block hunk not found')

          old_count = new_count = 0
          added = []
          for line in h.group(1).splitlines():
              if line.startswith('@@ '):
                  break
              if line.startswith(' '):
                  old_count += 1
                  new_count += 1
              elif line.startswith('-'):
                  old_count += 1
              elif line.startswith('+'):
                  new_count += 1
                  added.append(line[1:])
              elif line.startswith('\\'):
                  pass
              if old_count >= 3 and new_count >= 1635:
                  break
          ia = '\n'.join(added) + '\n'

          def between(text, start_marker, end_marker):
              a = text.index(start_marker)
              b = text.index(end_marker, a)
              return text[a:b]

          # ---------- Live Griot: base from Creation IA ----------
          live = between(
              ia,
              'class _LiveGriotScreenState extends State<LiveGriotScreen> {',
              '// ─────────────────────────────────────────────────────────────────\n// 3. Sagesse Battle',
          )

          live = live.replace(
              "  bool _scheduling = false;\n",
              """  bool _scheduling = false;
          List<Map<String, dynamic>> _activeLives = const [];
          bool _loadingLives = true;
          bool _startingLive = false;

          @override
          void initState() {
          super.initState();
          _loadActiveLives();
          }
          """,
              1,
          )

          start_now = live.index('  void _startNow() {')
          schedule = live.index('  Future<void> _scheduleAnnouncement() async {', start_now)
          live_methods = """  Future<void> _loadActiveLives() async {
          setState(() => _loadingLives = true);
          try {
          final lives = await FitilaBackend.fetchActiveLiveSessions();
          if (!mounted) return;
          setState(() {
          _activeLives = lives;
          _loadingLives = false;
          });
          } catch (_) {
          if (!mounted) return;
          setState(() => _loadingLives = false);
          }
          }

          Future<void> _startLiveNow() async {
          final title = _title.text.trim();
          if (title.isEmpty) {
          ScaffoldMessenger.of(context).showSnackBar(
          const SnackBar(content: Text('Donnez un titre à votre direct avant de démarrer.')),
          );
          return;
          }
          setState(() => _startingLive = true);
          try {
          final live = await FitilaBackend.createLiveSession(
          title: title,
          description: _description.text.trim().isEmpty ? null : _description.text.trim(),
          language: _language,
          );
          if (!mounted) return;
          await Navigator.push(
          context,
          MaterialPageRoute(
          builder: (_) => LiveRoomScreen(
            liveId: live['id'].toString(),
            title: title,
            role: FitilaLiveRole.host,
          ),
          ),
          );
          if (mounted) _loadActiveLives();
          } catch (error) {
          if (!mounted) return;
          ScaffoldMessenger.of(context).showSnackBar(
          SnackBar(
          content: Text(
            'Impossible de démarrer le direct : ${error.toString().replaceFirst("Bad state: ", "")}',
          ),
          ),
          );
          } finally {
          if (mounted) setState(() => _startingLive = false);
          }
          }

          void _joinLive(Map<String, dynamic> live) {
          Navigator.push(
          context,
          MaterialPageRoute(
          builder: (_) => LiveRoomScreen(
          liveId: live['id'].toString(),
          title: live['title']?.toString() ?? 'Live Griot IA',
          role: FitilaLiveRole.viewer,
          ),
          ),
          ).then((_) {
          if (mounted) _loadActiveLives();
          });
          }

          """
          live = live[:start_now] + live_methods + live[schedule:]

          live = live.replace(
              "La diffusion en direct n'est pas encore active dans Fitila. Vous pouvez préparer la configuration et prévenir votre communauté par une annonce.",
              "La diffusion en direct multi-spectateurs fonctionne réellement (connexion audio directe entre appareils). Elle est dimensionnée pour un public restreint (une dizaine d'auditeurs) et peut échouer sur certains réseaux très restrictifs faute de serveur relais dédié.",
              1,
          )

          active_block = """          Row(
            children: [
              const Expanded(
                child: Text('Lives en cours', style: TextStyle(fontWeight: FontWeight.w800, fontSize: 15)),
              ),
              IconButton(
                onPressed: _loadingLives ? null : _loadActiveLives,
                icon: const Icon(Icons.refresh_rounded),
                tooltip: 'Actualiser',
              ),
            ],
          ),
          if (_loadingLives)
            const Padding(
              padding: EdgeInsets.symmetric(vertical: 12),
              child: Center(child: CircularProgressIndicator()),
            )
          else if (_activeLives.isEmpty)
            Padding(
              padding: const EdgeInsets.symmetric(vertical: 8),
              child: Text(
                'Aucun direct en cours pour le moment.',
                style: TextStyle(color: _fitilaMuted, fontSize: 12.5),
              ),
            )
          else
            for (final live in _activeLives)
              Container(
                margin: const EdgeInsets.only(bottom: 8),
                padding: const EdgeInsets.all(12),
                decoration: BoxDecoration(
                  color: _fitilaCard,
                  borderRadius: BorderRadius.circular(14),
                  border: Border.all(color: _fitilaBorder),
                ),
                child: Row(
                  children: [
                    Container(
                      width: 8,
                      height: 8,
                      decoration: const BoxDecoration(color: Colors.red, shape: BoxShape.circle),
                    ),
                    const SizedBox(width: 10),
                    Expanded(
                      child: Column(
                        crossAxisAlignment: CrossAxisAlignment.start,
                        children: [
                          Text(
                            live['title']?.toString() ?? 'Live Griot IA',
                            maxLines: 1,
                            overflow: TextOverflow.ellipsis,
                            style: const TextStyle(fontWeight: FontWeight.w700, fontSize: 13.5),
                          ),
                          Text(
                            "${live['host_display_name'] ?? 'Griot Fitila'} • ${live['viewer_count'] ?? 0} auditeur(s)",
                            style: TextStyle(fontSize: 11.5, color: _fitilaMuted),
                          ),
                        ],
                      ),
                    ),
                    FilledButton(
                      onPressed: () => _joinLive(live),
                      child: const Text('Rejoindre'),
                    ),
                  ],
                ),
              ),
          const SizedBox(height: 16),
          """
          needle = "          const SizedBox(height: 16),\n          Card(\n"
          if needle not in live:
              raise SystemExit('Live card insertion point not found')
          live = live.replace(needle, "          const SizedBox(height: 16),\n" + active_block + "          Card(\n", 1)

          config_line = "                  const Text('Configuration du direct', style: TextStyle(fontWeight: FontWeight.w800, fontSize: 14)),\n"
          if config_line not in live:
              raise SystemExit('Live configuration title not found')
          live = live.replace(
              config_line,
              config_line
              + "                  const SizedBox(height: 2),\n"
              + "                  Text(\n"
              + "                    'Utilisée pour démarrer un direct maintenant, ou pour programmer une simple annonce.',\n"
              + "                    style: TextStyle(fontSize: 11, color: _fitilaMuted),\n"
              + "                  ),\n",
              1,
          )

          old_buttons = """          Row(
            children: [
              Expanded(
                child: OutlinedButton.icon(
                  onPressed: _startNow,
                  icon: const Icon(Icons.podcasts_rounded),
                  label: const Text('Démarrer maintenant'),
                ),
              ),
              const SizedBox(width: 10),
              Expanded(
                child: FilledButton.icon(
                  onPressed: _scheduling ? null : _scheduleAnnouncement,
                  icon: _scheduling
                      ? const SizedBox(
                          width: 16,
                          height: 16,
                          child: CircularProgressIndicator(strokeWidth: 2, color: Colors.white),
                        )
                      : const Icon(Icons.campaign_rounded),
                  label: const Text('Programmer une annonce'),
                ),
              ),
            ],
          ),
          """
          new_buttons = """          Row(
            children: [
              Expanded(
                child: FilledButton.icon(
                  onPressed: _startingLive ? null : _startLiveNow,
                  icon: _startingLive
                      ? const SizedBox(
                          width: 16,
                          height: 16,
                          child: CircularProgressIndicator(strokeWidth: 2, color: Colors.white),
                        )
                      : const Icon(Icons.podcasts_rounded),
                  label: const Text('Démarrer le direct'),
                ),
              ),
              const SizedBox(width: 10),
              Expanded(
                child: OutlinedButton.icon(
                  onPressed: _scheduling ? null : _scheduleAnnouncement,
                  icon: _scheduling
                      ? const SizedBox(
                          width: 16,
                          height: 16,
                          child: CircularProgressIndicator(strokeWidth: 2),
                        )
                      : const Icon(Icons.campaign_rounded),
                  label: const Text('Programmer une annonce'),
                ),
              ),
            ],
          ),
          """
          actions_tail = live.rfind('          const SizedBox(height: 24),')
          actions_start = live.rfind('          Row(', 0, actions_tail)
          if actions_start < 0 or actions_tail < 0:
              raise SystemExit('Live action buttons structural bounds not found')
          live = live[:actions_start] + new_buttons + live[actions_tail:]

          # Replace current LiveGriot state but keep LiveRoomScreen inserted by live.patch.
          cur_live_a = main.index('class _LiveGriotScreenState extends State<LiveGriotScreen> {')
          room_marker = '/// Salle de direct réelle'
          if room_marker in main[cur_live_a:]:
              cur_live_b = main.index(room_marker, cur_live_a)
          else:
              cur_live_b = main.index('// ─────────────────────────────────────────────────────────────────\n// 3. Sagesse Battle', cur_live_a)
          main = main[:cur_live_a] + live.rstrip() + '\n\n' + main[cur_live_b:]

          # ---------- Handunia: coherent target from Creation IA baseline ----------
          hand = between(
              ia,
              'class _HanduniaWasaScreenState extends State<HanduniaWasaScreen> {',
              '// ─────────────────────────────────────────────────────────────────\n// Tuile de sélection',
          )

          hand = hand.replace(
              "  bool _saving = false;\n",
              """  bool _saving = false;
          final _fragmentController = TextEditingController();
          bool _publishingFragment = false;
          bool _generating = false;
          bool _aiAssisted = false;

          @override
          void dispose() {
          _fragmentController.dispose();
          super.dispose();
          }

          """,
              1,
          )

          generate = """  Future<void> _generateFragment() async {
          setState(() => _generating = true);
          try {
          const prompt =
          'Imagine en 3 à 4 phrases un fragment du monde Handunia Wasa : un lieu, '
          'un personnage ou un petit récit inspiré de la culture et de la langue bariba, '
          "comme s'il faisait partie d'un monde vivant et persistant. "
          'Réponds uniquement par le fragment, sans introduction ni explication.';
          final result = await FitilaBackend.askFitilaIa(prompt);
          if (!mounted) return;
          setState(() {
          _fragmentController.text = result;
          _aiAssisted = true;
          });
          } catch (_) {
          if (!mounted) return;
          ScaffoldMessenger.of(context).showSnackBar(
          const SnackBar(content: Text('Génération IA indisponible pour le moment.')),
          );
          } finally {
          if (mounted) setState(() => _generating = false);
          }
          }

          """
          toggle_pos = hand.index('  Future<void> _toggleInterest(bool value) async {')
          hand = hand[:toggle_pos] + generate + hand[toggle_pos:]

          build_pos = hand.index('  @override\n  Widget build(BuildContext context)')
          publish = """  Future<void> _publishFragment() async {
          final text = _fragmentController.text.trim();
          if (text.isEmpty) {
          ScaffoldMessenger.of(context).showSnackBar(
          const SnackBar(content: Text('Écrivez ou générez un fragment avant de publier.')),
          );
          return;
          }
          setState(() => _publishingFragment = true);
          final content = _aiAssisted
          ? '🌌 Fragment généré par Fitila IA pour Handunia Wasa\\n\\n$text\\n\\n'
              '(Texte réellement généré par l\'IA Fitila à partir d\'un thème bariba — vision exploratoire 10-15 ans, pas un monde vivant fonctionnel aujourd\'hui.)'
          : '🌌 Fragment imaginé pour Handunia Wasa\\n\\n$text\\n\\n'
              '(Contribution communautaire à une vision exploratoire 10-15 ans — pas un contenu généré par une IA.)';
          try {
          await FitilaBackend.createTextPost(
          text: content,
          hashtags: [
          'handunia-wasa',
          if (_aiAssisted) 'ia-generatif' else 'vision-communautaire',
          ],
          templateId: 'handunia-wasa',
          );
          if (!mounted) return;
          ScaffoldMessenger.of(context).showSnackBar(
          const SnackBar(content: Text('Fragment publié dans le fil.')),
          );
          setState(() {
          _fragmentController.clear();
          _aiAssisted = false;
          });
          } catch (_) {
          if (!mounted) return;
          ScaffoldMessenger.of(context).showSnackBar(
          const SnackBar(content: Text('Publication impossible. Réessayez.')),
          );
          } finally {
          if (mounted) setState(() => _publishingFragment = false);
          }
          }

          """
          hand = hand[:build_pos] + publish + hand[build_pos:]

          hand = hand.replace(
              "Vision exploratoire, non disponible aujourd'hui : aucune capacité de génération de monde vivant n'existe encore dans l'IA actuelle. Cet écran présente l'ambition à 10-15 ans, pas une fonctionnalité active.",
              "Vision exploratoire 10-15 ans : aucun monde vivant persistant n'existe aujourd'hui. Ce qui est réel dès maintenant : la génération de fragments texte par l'IA Fitila et leur publication dans le fil, ci-dessous.",
              1,
          )

          fragment_card = """          const SizedBox(height: 16),
          Card(
            child: Padding(
              padding: const EdgeInsets.all(14),
              child: Column(
                crossAxisAlignment: CrossAxisAlignment.start,
                children: [
                  const Text(
                    'Imaginer un fragment',
                    style: TextStyle(fontWeight: FontWeight.w800, fontSize: 14),
                  ),
                  const SizedBox(height: 4),
                  Text(
                    "Décrivez-le vous-même, ou laissez Fitila IA en générer un vraiment — relisez et modifiez avant de publier. Le fil indique toujours l'origine réelle : IA ou communauté.",
                    style: TextStyle(fontSize: 11.5, color: _fitilaMuted),
                  ),
                  const SizedBox(height: 10),
                  TextField(
                    controller: _fragmentController,
                    maxLines: 3,
                    onChanged: (value) {
                      if (value.trim().isEmpty && _aiAssisted) {
                        setState(() => _aiAssisted = false);
                      }
                    },
                    decoration: const InputDecoration(
                      hintText: 'Ex : Un marché nocturne où les proverbes prennent vie…',
                      border: OutlineInputBorder(),
                    ),
                  ),
                  if (_aiAssisted) ...[
                    const SizedBox(height: 6),
                    Row(
                      children: [
                        Icon(Icons.auto_awesome_rounded, size: 14, color: _fitilaGoldDeep),
                        const SizedBox(width: 4),
                        Text(
                          'Généré par Fitila IA — modifiable avant publication',
                          style: TextStyle(
                            fontSize: 11,
                            color: _fitilaGoldDeep,
                            fontWeight: FontWeight.w700,
                          ),
                        ),
                      ],
                    ),
                  ],
                  const SizedBox(height: 10),
                  Row(
                    children: [
                      Expanded(
                        child: OutlinedButton.icon(
                          onPressed: _generating ? null : _generateFragment,
                          icon: _generating
                              ? const SizedBox(
                                  width: 14,
                                  height: 14,
                                  child: CircularProgressIndicator(strokeWidth: 2),
                                )
                              : const Icon(Icons.auto_awesome_rounded, size: 16),
                          label: const Text('Générer avec Fitila IA'),
                        ),
                      ),
                      const SizedBox(width: 10),
                      Expanded(
                        child: FilledButton.icon(
                          onPressed: _publishingFragment ? null : _publishFragment,
                          icon: _publishingFragment
                              ? const SizedBox(
                                  width: 16,
                                  height: 16,
                                  child: CircularProgressIndicator(strokeWidth: 2, color: Colors.white),
                                )
                              : const Icon(Icons.auto_stories_rounded),
                          label: const Text('Publier'),
                        ),
                      ),
                    ],
                  ),
                ],
              ),
            ),
          ),
          """
          tail = "          const SizedBox(height: 24),\n"
          if tail not in hand:
              raise SystemExit('Handunia UI insertion point not found')
          hand = hand.replace(tail, fragment_card + tail, 1)

          cur_hand_a = main.index('class _HanduniaWasaScreenState extends State<HanduniaWasaScreen> {')
          cur_hand_b = main.index('// ─────────────────────────────────────────────────────────────────\n// Tuile de sélection', cur_hand_a)
          main = main[:cur_hand_a] + hand.rstrip() + '\n\n' + main[cur_hand_b:]

          main_path.write_text(main, encoding='utf-8')
          PY

          rm -f fitila_flutter/lib/main.dart.rej

          grep -q "import 'core/fitila_live.dart';" fitila_flutter/lib/main.dart
          grep -q '_loadActiveLives' fitila_flutter/lib/main.dart
          grep -q '_startLiveNow' fitila_flutter/lib/main.dart
          grep -q 'class LiveRoomScreen' fitila_flutter/lib/main.dart
          grep -q '_generateFragment' fitila_flutter/lib/main.dart
          grep -q '_publishFragment' fitila_flutter/lib/main.dart
          grep -q 'flutter_webrtc' fitila_flutter/pubspec.yaml
          test -f fitila_flutter/lib/core/fitila_live.dart
          test -f supabase/migrations/20260916090000_live_griot_ia_streaming.sql

          git add -A
          git commit -m "feat(live): integrate Live Griot and Handunia on supplied IA baseline"

      - name: Diagnose immersive premium feed patch
        shell: bash
        run: |
          set -euo pipefail
          git apply --reject --whitespace=nowarn /tmp/feed.patch || true
          echo "===== FEED REJECTS ====="
          find . -name '*.rej' -type f -print | sort | while read f; do
            echo "----- $f -----"
            grep '^@@ ' "$f" || true
          done
          echo "===== END FEED REJECTS ====="
          exit 1

      - name: Normalize Flutter 3.47 compatibility
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('fitila_flutter/lib/main.dart')
          s = p.read_text(encoding='utf-8')

          s = s.replace('separatorBuilder: (_, __) =>', 'separatorBuilder: (_, _) =>')

          # Flutter 3.47: Color.withOpacity is deprecated.
          s = re.sub(
              r'([A-Za-z0-9_\.\)\]]+)\.withOpacity\(([^\)]+)\)',
              r'\1.withValues(alpha: \2)',
              s,
          )

          # Flutter 3.47: DropdownButtonFormField.value is deprecated in favor of initialValue.
          s = re.sub(
              r'(DropdownButtonFormField<[^>]+>\(\n\s*)value:',
              r'\1initialValue:',
              s,
          )

          p.write_text(s, encoding='utf-8')
          PY

          git add fitila_flutter/lib/main.dart
          if ! git diff --cached --quiet; then
            git commit -m "fix(flutter): normalize patch code for Flutter 3.47"
          fi

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          channel: stable
          cache: true

      - name: Verify metadata and prepare server configuration
        shell: bash
        run: |
          set -euo pipefail
          cd fitila_flutter
          flutter --version
          grep -q '^version: 1.8.1+12$' pubspec.yaml
          grep -q 'android.permission.INTERNET' android/app/src/main/AndroidManifest.xml
          python - <<'PY'
          from pathlib import Path
          import json
          env_path = Path('../.env')
          if not env_path.exists():
              raise SystemExit('FITILA server configuration file ../.env is missing')
          env = {}
          for raw in env_path.read_text(encoding='utf-8').splitlines():
              line = raw.strip()
              if not line or line.startswith('#') or '=' not in line:
                  continue
              key, value = line.split('=', 1)
              env[key.strip()] = value.strip().strip('"').strip("'")
          url = env.get('SUPABASE_URL') or env.get('VITE_SUPABASE_URL') or ''
          key = env.get('SUPABASE_ANON_KEY') or env.get('SUPABASE_PUBLISHABLE_KEY') or env.get('VITE_SUPABASE_PUBLISHABLE_KEY') or ''
          if not url or not key:
              raise SystemExit('FITILA server URL or publishable key is missing')
          Path('.ci-dart-defines.json').write_text(
              json.dumps({'SUPABASE_URL': url, 'SUPABASE_ANON_KEY': key}),
              encoding='utf-8',
          )
          PY

      - name: Resolve dependencies
        run: cd fitila_flutter && flutter pub get

      - name: Static analysis
        run: cd fitila_flutter && flutter analyze

      - name: Full Flutter tests
        run: cd fitila_flutter && flutter test --dart-define-from-file=.ci-dart-defines.json --reporter compact

      - name: Build optimized release APK
        shell: bash
        run: |
          set -euo pipefail
          cd fitila_flutter
          flutter build apk --release \
            --dart-define-from-file=.ci-dart-defines.json \
            --obfuscate \
            --split-debug-info=build/symbols
          test -s build/app/outputs/flutter-apk/app-release.apk
          unzip -t build/app/outputs/flutter-apk/app-release.apk
          mkdir -p build/release-output
          cp build/app/outputs/flutter-apk/app-release.apk \
            build/release-output/FITILA-Android-v1.8.1-build12-creation-live-immersive-release.apk
          cp -R build/symbols build/release-output/symbols
          cd build/release-output
          sha256sum FITILA-Android-v1.8.1-build12-creation-live-immersive-release.apk | tee SHA256SUMS.txt
          ls -lh FITILA-Android-v1.8.1-build12-creation-live-immersive-release.apk

      - name: Remove temporary patch staging
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .patches
          rm -f .github/workflows/apply-live-feed-patches.yml
          git add -A
          git commit -m "chore(ci): remove temporary patch staging"

      - name: Push validated patch commits
        shell: bash
        run: |
          set -euo pipefail
          git push origin HEAD:${GITHUB_REF_NAME}

      - name: Upload validated APK
        uses: actions/upload-artifact@v4
        with:
          name: FITILA-Android-v1.8.1-build12-creation-live-immersive-release
          path: fitila_flutter/build/release-output/
          if-no-files-found: error
          retention-days: 14
