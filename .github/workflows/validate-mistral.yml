name: Validate FITILA AI providers
on:
  pull_request:
    paths: ['supabase/functions/**', 'tests/ai/**', 'tests/voice/**', 'src/lib/dunya/voiceProtocol.ts', 'src/components/admin/AIProviderSettings.tsx', 'src/components/admin/AdminSettings.tsx', 'e2e/ai-provider-settings.spec.ts', 'e2e/fixtures/ai-provider*', 'playwright.ai.config.ts', '.github/workflows/validate-mistral.yml']
  push:
    branches: [main]
    paths: ['supabase/functions/**', 'tests/ai/**', 'tests/voice/**', 'src/lib/dunya/voiceProtocol.ts', 'src/components/admin/AIProviderSettings.tsx', 'src/components/admin/AdminSettings.tsx', 'e2e/ai-provider-settings.spec.ts', 'e2e/fixtures/ai-provider*', 'playwright.ai.config.ts']
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with: { deno-version: v2.x }
      - name: Check all AI provider integrations
        run: deno check --node-modules-dir=none $(rg -l 'aiFetch' supabase/functions/*/index.ts) supabase/functions/dunya-voice-turn/index.ts supabase/functions/byt5-bariba-translate/index.ts supabase/functions/ai-provider-settings/index.ts
      - name: Test transport, application contracts and voice pipeline
        run: deno test --node-modules-dir=none --allow-env --allow-read=supabase/functions/_shared,public/data tests/ai/mistral.test.ts tests/ai/providers.test.ts tests/ai/localChat.test.ts tests/voice/dunyaVoice.test.ts tests/voice/metaVoiceCore.test.ts supabase/functions/_shared/translation-verifier_test.ts supabase/functions/_shared/deterministic-refine_test.ts
  browser:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: npm }
      - run: npm ci --legacy-peer-deps
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test --config=playwright.ai.config.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ai-provider-browser-results
          path: test-results
