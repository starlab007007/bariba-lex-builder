name: Aburu Fim Quality

on:
  push:
    branches:
      - release/fitila-flutter-android-v1.8.1-build12-web-parity
    paths:
      - 'src/App.tsx'
      - 'src/pages/fitila/AburuFimIA.tsx'
      - 'src/pages/tamtam/TamTamCreator.tsx'
      - 'src/pages/tamtam/TamTamMarket.tsx'
      - 'src/components/feed/VideoFeedCard.tsx'
      - 'src/hooks/useTamTamPosts.ts'
      - 'src/integrations/supabase/types.ts'
      - 'src/lib/mediaUpload.ts'
      - 'supabase/functions/aburu-fim-ai/**'
      - '.github/workflows/aburu-fim-quality.yml'

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-node@v4.4.0
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci --legacy-peer-deps
      - name: TypeScript
        run: npx tsc --noEmit -p tsconfig.app.json
      - name: Lint new Aburu surface
        run: >
          npx eslint
          src/App.tsx
          src/pages/fitila/AburuFimIA.tsx
          src/lib/mediaUpload.ts
      - name: Production build
        run: npm run build
