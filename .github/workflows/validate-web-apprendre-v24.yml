name: Validate Web Apprendre v2.4

on:
  push:
    branches:
      - feat/web-apprendre-v2.4-20260927
    paths:
      - '.github/workflows/validate-web-apprendre-v24.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Refresh npm lockfile
        run: npm install --package-lock-only --legacy-peer-deps

      - name: Clean install
        run: npm ci --legacy-peer-deps

      - name: Persist synchronized lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "chore(web): synchronize npm lockfile"
            git push origin HEAD:feat/web-apprendre-v2.4-20260927
          fi
      - name: Build web
        env:
          VITE_BUILD_SHA: ${{ github.sha }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
        run: npm run build
      - name: Verify Apprendre Voice admin
        run: |
          test -f src/components/admin/apprendre-voice/ApprendreVoiceAdmin.tsx
          test -f supabase/migrations/20260927100000_apprendre_voice_roles.sql
          test -f supabase/migrations/20260927100100_apprendre_voice_studio.sql
          test -f supabase/migrations/20260927120000_apprendre_voice_v24.sql
          test -f supabase/migrations/20260927123000_apprendre_voice_security_hardening.sql
