name: FITILA Optimized Lightweight APK

on:
  push:
    branches:
      - release/fitila-flutter-android-v1.8.1-build12-web-parity
    paths:
      - '.github/workflows/flutter-optimized-lightweight-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-lightweight:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: fitila_flutter

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          channel: stable
          cache: true

      - name: Prepare FITILA server configuration
        run: |
          python - <<'PY'
          from pathlib import Path
          import json

          env = {}
          for raw in Path('../.env').read_text(encoding='utf-8').splitlines():
              line = raw.strip()
              if line and not line.startswith('#') and '=' in line:
                  key, value = line.split('=', 1)
                  env[key.strip()] = value.strip().strip('"').strip("'")

          url = env.get('SUPABASE_URL') or env.get('VITE_SUPABASE_URL') or ''
          key = (
              env.get('SUPABASE_ANON_KEY')
              or env.get('SUPABASE_PUBLISHABLE_KEY')
              or env.get('VITE_SUPABASE_PUBLISHABLE_KEY')
              or ''
          )
          if not url or not key:
              raise SystemExit('FITILA server configuration is missing')

          Path('.ci-dart-defines.json').write_text(
              json.dumps({'SUPABASE_URL': url, 'SUPABASE_ANON_KEY': key}),
              encoding='utf-8',
          )
          PY

      - name: Resolve dependencies
        run: flutter pub get

      - name: Verify optimized source
        run: |
          grep -q '^version: 1.8.3+14$' pubspec.yaml
          flutter analyze
          flutter test test/handunia_lot3_ai_guide_test.dart \
            --dart-define-from-file=.ci-dart-defines.json \
            --reporter compact

      - name: Build optimized ARM64 QA APK
        run: >-
          flutter build apk
          --profile
          --target-platform android-arm64
          --tree-shake-icons
          --dart-define-from-file=.ci-dart-defines.json

      - name: Validate and prepare optimized APK
        run: |
          set -euo pipefail
          src="build/app/outputs/flutter-apk/app-profile.apk"
          test -s "$src"
          unzip -t "$src" >/dev/null
          mkdir -p build/lightweight-output
          target="build/lightweight-output/FITILA-Android-v1.8.3-build14-handunia-lot3-ARM64-optimized-qa.apk"
          cp "$src" "$target"
          cd build/lightweight-output
          sha256sum *.apk | tee SHA256SUMS.txt
          du -h *.apk | tee SIZES.txt

      - name: Upload optimized APK
        uses: actions/upload-artifact@v4
        with:
          name: FITILA-Android-v1.8.3-build14-handunia-lot3-ARM64-optimized-qa
          path: fitila_flutter/build/lightweight-output/
          if-no-files-found: error
          compression-level: 6
          retention-days: 14

