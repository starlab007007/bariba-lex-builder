name: FITILA Optimized Lightweight APK

on:
  push:
    branches:
      - release/fitila-flutter-android-v1.8.1-build12-web-parity
    paths:
      - '.github/workflows/flutter-optimized-lightweight-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-lightweight:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: fitila_flutter

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          channel: stable
          cache: true

      - name: Prepare FITILA server configuration
        run: |
          python - <<'PY'
          from pathlib import Path
          import json

          env = {}
          for raw in Path('../.env').read_text(encoding='utf-8').splitlines():
              line = raw.strip()
              if line and not line.startswith('#') and '=' in line:
                  key, value = line.split('=', 1)
                  env[key.strip()] = value.strip().strip('"').strip("'")

          url = env.get('SUPABASE_URL') or env.get('VITE_SUPABASE_URL') or ''
          key = (
              env.get('SUPABASE_ANON_KEY')
              or env.get('SUPABASE_PUBLISHABLE_KEY')
              or env.get('VITE_SUPABASE_PUBLISHABLE_KEY')
              or ''
          )
          if not url or not key:
              raise SystemExit('FITILA server configuration is missing')

          Path('.ci-dart-defines.json').write_text(
              json.dumps({'SUPABASE_URL': url, 'SUPABASE_ANON_KEY': key}),
              encoding='utf-8',
          )
          PY

      - name: Resolve dependencies
        run: flutter pub get

      - name: Verify optimized source
        run: |
          flutter analyze
          flutter test test/content_creation_modules_test.dart             --dart-define-from-file=.ci-dart-defines.json             --reporter compact

      - name: Build lightweight split APKs
        run: >-
          flutter build apk
          --profile
          --split-per-abi
          --tree-shake-icons
          --dart-define-from-file=.ci-dart-defines.json

      - name: Prepare lightweight APK artifacts
        run: |
          set -euo pipefail
          mkdir -p build/lightweight-output

          for abi in armeabi-v7a arm64-v8a x86_64; do
            src="build/app/outputs/flutter-apk/app-${abi}-profile.apk"
            test -s "$src"
            cp "$src" "build/lightweight-output/FITILA-v1.8.1-build12-${abi}-optimized.apk"
          done

          cd build/lightweight-output
          sha256sum *.apk | tee SHA256SUMS.txt
          du -h *.apk | sort -h | tee SIZES.txt

      - name: Upload lightweight APKs
        uses: actions/upload-artifact@v4
        with:
          name: FITILA-v1.8.1-build12-optimized-split-apks
          path: fitila_flutter/build/lightweight-output/
          if-no-files-found: error
          retention-days: 14
