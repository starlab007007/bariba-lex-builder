name: DUNYA Flutter linguistic validation
on:
  push:
    branches:
      - release/fitila-web-flutter-parity-20261016
    paths:
      - 'fitila_flutter/lib/dunya/**'
      - 'fitila_flutter/android/app/src/main/kotlin/bj/fitila/fitila_native/DunyaByt5Channel.kt'
      - 'fitila_flutter/android/app/src/main/kotlin/bj/fitila/fitila_native/MainActivity.kt'
      - 'fitila_flutter/android/app/build.gradle.kts'
      - 'fitila_flutter/lib/main.dart'
      - 'fitila_flutter/lib/core/fitila_memory_store.dart'
      - 'fitila_flutter/test/dunya_*'
      - '.github/workflows/dunya-flutter-validation.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: fitila_flutter
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          channel: stable
          cache: true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      # Le pont ONNX natif remplit le disque du runner (echec « No space left on
      # device » le 19/10). On libere les SDK inutilises avant la compilation.
      - name: Free runner disk space
        working-directory: ${{ github.workspace }}
        run: |
          echo "Disque avant :"; df -h / | tail -1
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup \
                      /usr/local/share/boost /usr/share/swift \
                      /opt/hostedtoolcache/CodeQL || true
          sudo docker image prune -af >/dev/null 2>&1 || true
          echo "Disque apres :"; df -h / | tail -1
      - name: Resolve dependencies
        run: flutter pub get
      - name: Analyze linguistic modules
        run: dart analyze lib/dunya/voice/dunya_local_refiner.dart lib/dunya/voice/dunya_translator.dart lib/core/fitila_memory_store.dart
      - name: Run DUNYA tests
        run: flutter test test/dunya_local_refiner_test.dart test/dunya_memory_bidirectional_test.dart --reporter expanded
      # Les journaux bruts ne sont pas toujours lisibles : en cas d'echec on
      # remonte les lignes utiles en annotations GitHub.
      - name: Compile Android debug (includes native ONNX bridge)
        run: |
          status=0
          flutter build apk --debug --target-platform android-arm64 > /tmp/dunya-build.log 2>&1 || status=$?
          tail -80 /tmp/dunya-build.log
          if [ "$status" -ne 0 ]; then
            # Une seule annotation multiligne : GitHub n'en affiche que dix par
            # etape, et les journaux bruts ne sont pas toujours telechargeables.
            detail=$(tail -70 /tmp/dunya-build.log \
              | sed 's/%/%25/g; s/\r//g' \
              | awk '{ printf "%s%%0A", $0 }')
            echo "::error title=Echec de la compilation Android::${detail}"
            echo "Disque au moment de l'echec :"; df -h / | tail -1
          fi
          exit "$status"
