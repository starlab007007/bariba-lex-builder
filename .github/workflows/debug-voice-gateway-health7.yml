name: Debug voice-gateway health (temporaire, 7)

# Workflow de diagnostic jetable : voir debug-voice-gateway-health4.yml /
# health5.yml / health6.yml (supprimés) pour le contexte.
#
# health6.yml refusait systématiquement le dispatch API ("Workflow does not
# have 'workflow_dispatch' trigger", 422) malgré un YAML byte-identique et
# en apparence valide. Cause réelle, isolée par bisection sur un workflow
# minimal séparé : les 4 étapes "traceback omnilingual_asr (partie N)"
# utilisaient `run: echo "::notice::live2a: ..."` en scalaire YAML SUR UNE
# SEULE LIGNE (sans `|`). Un tel scalaire "plain" contient alors la séquence
# `: ` (deux-points + espace, ex. "live2a: ") — interdite par la grammaire
# YAML dans un scalaire non cité en contexte bloc. Le parseur de GitHub
# n'affiche pas d'erreur de syntaxe claire pour autant : il enregistre le
# workflow en mode dégradé (son `name` dans `GET .../actions/workflows`
# devient le CHEMIN du fichier au lieu du champ `name:` du YAML — signe
# fiable du problème), et `workflow_dispatch` n'est alors plus reconnu.
# Fix : passer ces 4 étapes en bloc `run: |` (le contenu devient littéral,
# le `: ` n'y a plus de sens spécial). Renommer en health7.yml a aussi été
# fait en cours de route pour forcer un ré-enregistrement propre.
# À supprimer une fois le diagnostic terminé.

on:
  workflow_dispatch: {}

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - name: Setup clé SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id
          chmod 600 ~/.ssh/id
          ssh-keyscan -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: docker ps -a (état du conteneur)
        run: |
          OUT="$(ssh -i ~/.ssh/id -o StrictHostKeyChecking=no "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" "docker ps -a --filter name=bariba-voice-gateway --format '{{.Names}} | {{.Status}} | {{.Image}}'" 2>&1)"
          echo "::notice::ps: ${OUT}"

      - name: docker inspect (code de sortie / health)
        run: |
          OUT="$(ssh -i ~/.ssh/id -o StrictHostKeyChecking=no "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" "docker inspect bariba-voice-gateway --format 'ExitCode={{.State.ExitCode}} OOMKilled={{.State.OOMKilled}} Health={{.State.Health.Status}} Error={{.State.Error}}'" 2>&1)"
          echo "::notice::inspect: ${OUT}"

      - name: date de création de l'IMAGE en cours d'exécution
        run: |
          OUT="$(ssh -i ~/.ssh/id -o StrictHostKeyChecking=no "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" "docker inspect ghcr.io/starlab007007/bariba-lex-builder-voice-gateway:latest --format 'ImageId={{.Id}} Created={{.Created}}'" 2>&1)"
          echo "::notice::image: ${OUT}"

      - name: import LIVE torch + fairseq2n dans le conteneur (partie 1)
        run: |
          OUT="$(ssh -i ~/.ssh/id -o StrictHostKeyChecking=no "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" "docker exec bariba-voice-gateway python -c \"import torch; print('torch', torch.__version__, 'cuda_build', torch.version.cuda); import fairseq2n; print('fairseq2n import OK')\"" 2>&1 | tr '\n' '|' | cut -c1-900)"
          echo "::notice::live1: ${OUT}"

      - name: import LIVE omnilingual_asr dans le conteneur (capture complète)
        run: |
          ssh -i ~/.ssh/id -o StrictHostKeyChecking=no "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" "docker exec bariba-voice-gateway python -c \"from omnilingual_asr.models.inference.pipeline import ASRInferencePipeline; print('omnilingual_asr import OK')\"" > /tmp/live2.txt 2>&1
          echo "longueur totale: $(wc -c < /tmp/live2.txt)"
        continue-on-error: true

      - name: traceback omnilingual_asr (partie 1)
        run: |
          echo "::notice::live2a: $(cut -c1-900 /tmp/live2.txt | tr '\n' '|')"
        continue-on-error: true

      - name: traceback omnilingual_asr (partie 2)
        run: |
          echo "::notice::live2b: $(cut -c901-1800 /tmp/live2.txt 2>/dev/null | tr '\n' '|')"
        continue-on-error: true

      - name: traceback omnilingual_asr (partie 3)
        run: |
          echo "::notice::live2c: $(cut -c1801-2700 /tmp/live2.txt 2>/dev/null | tr '\n' '|')"
        continue-on-error: true

      - name: traceback omnilingual_asr (partie 4, fin)
        run: |
          echo "::notice::live2d: $(tail -c 900 /tmp/live2.txt 2>/dev/null | tr '\n' '|')"
        continue-on-error: true

      - name: curl -v health local (depuis le VPS)
        run: |
          OUT="$(ssh -i ~/.ssh/id -o StrictHostKeyChecking=no "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" "curl -v --max-time 5 http://127.0.0.1:8090/health" 2>&1 | tr '\n' '|' | cut -c1-900)"
          echo "::notice::health: ${OUT}"
