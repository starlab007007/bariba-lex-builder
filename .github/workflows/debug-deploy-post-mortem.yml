name: Debug deploy post-mortem (temporaire)

on:
  workflow_dispatch: {}

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - name: Setup clé SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id
          chmod 600 ~/.ssh/id
          ssh-keyscan -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: etat global
        run: |
          OUT="$(ssh -i ~/.ssh/id -o StrictHostKeyChecking=no "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" "docker ps -a --filter name=bariba-voice-gateway --format '{{.Names}} | {{.Status}} | {{.Image}}' && echo --- && docker inspect bariba-voice-gateway --format 'ExitCode={{.State.ExitCode}} OOMKilled={{.State.OOMKilled}} Health={{.State.Health.Status}} Error={{.State.Error}} StartedAt={{.State.StartedAt}}'" 2>&1 | tr '\n' '|')"
          echo "::notice::etat: ${OUT}"

      - name: image active vs disponible sur ghcr
        run: |
          OUT="$(ssh -i ~/.ssh/id -o StrictHostKeyChecking=no "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" "docker inspect ghcr.io/starlab007007/bariba-lex-builder-voice-gateway:latest --format 'ImageId={{.Id}} Created={{.Created}}' && echo --- && docker inspect bariba-voice-gateway --format 'RunningImage={{.Image}}'" 2>&1 | tr '\n' '|')"
          echo "::notice::images: ${OUT}"

      - name: health check logs recentes (partie 1)
        run: |
          ssh -i ~/.ssh/id -o StrictHostKeyChecking=no "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" "docker logs --tail 80 bariba-voice-gateway" > /tmp/logs.txt 2>&1
          echo "::notice::logs1: $(cut -c1-900 /tmp/logs.txt | tr '\n' '|')"

      - name: health check logs recentes (partie 2)
        run: echo "::notice::logs2: $(cut -c901-1800 /tmp/logs.txt 2>/dev/null | tr '\n' '|')"
        continue-on-error: true

      - name: health check logs recentes (partie 3)
        run: echo "::notice::logs3: $(cut -c1801-2700 /tmp/logs.txt 2>/dev/null | tr '\n' '|')"
        continue-on-error: true

      - name: health check logs recentes (partie 4, fin)
        run: echo "::notice::logs4: $(tail -c 900 /tmp/logs.txt 2>/dev/null | tr '\n' '|')"
        continue-on-error: true

      - name: curl health local
        run: |
          OUT="$(ssh -i ~/.ssh/id -o StrictHostKeyChecking=no "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" "curl -sS --max-time 5 http://127.0.0.1:8090/health" 2>&1 | tr '\n' '|' | cut -c1-900)"
          echo "::notice::health: ${OUT}"
