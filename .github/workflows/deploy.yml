# Build v2.1 - GitHub Pro enabled
name: Deploy React App Bariba de zime
on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build
        env:
          VITE_BUILD_SHA: ${{ github.sha }}
          VITE_BUILD_TIME: ${{ github.event.head_commit.timestamp }}

      - name: Build successful
        run: echo "✅ Build completed successfully!"

  deploy:
    needs: build
    runs-on: ubuntu-latest
    # Only deploy if VPS secrets are configured
    if: ${{ vars.DEPLOY_ENABLED == 'true' }}
    steps:
      - name: Déployer sur le VPS avec Docker Compose
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e  # Arrête le script en cas d'erreur

            cd /home/debian/bariba-lex-builder

            echo "📥 Mise à jour du code..."
            git fetch --prune origin main
            git checkout -B main FETCH_HEAD
            git reset --hard FETCH_HEAD

            echo "🛑 Arrêt des anciens conteneurs..."
            docker compose -f docker-composer.yml down

            echo "🔨 Construction et redémarrage des services..."
            VITE_BUILD_SHA=${{ github.sha }} VITE_BUILD_TIME=$(date -Iseconds) docker compose -f docker-composer.yml build --build-arg VITE_BUILD_SHA=${{ github.sha }} --build-arg VITE_BUILD_TIME=$(date -Iseconds)
            docker compose -f docker-composer.yml up -d --force-recreate

            echo "🧹 Nettoyage des anciennes images inutilisées...."
            docker image prune -af
