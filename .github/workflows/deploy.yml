# Build v3 - Build once on GitHub, deploy validated dist atomically to VPS
name: Deploy React App Bariba de zime
on:
  push:
    branches:
      - main

concurrency:
  group: deploy-main
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout code
        uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v4.4.0
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Build application
        run: npm run build
        env:
          VITE_BUILD_SHA: ${{ github.sha }}
          VITE_BUILD_TIME: ${{ github.event.head_commit.timestamp }}
          VITE_SUPABASE_URL: https://dvswhjawiooprghzeyol.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_Rs6ysvbwQ0oGpHuYulZ5Hw_loUqyGKw

      - name: Validate built bundle
        run: |
          test -f dist/index.html
          test -s dist/index.html
          test -f nginx.conf
          test -f docker-composer.yml
          echo "✅ Build bundle validated"

      - name: Package deployment bundle
        run: |
          tar -czf fitila-web-deploy.tgz dist nginx.conf docker-composer.yml
          sha256sum fitila-web-deploy.tgz > fitila-web-deploy.tgz.sha256

      - name: Upload deployment bundle
        uses: actions/upload-artifact@v4
        with:
          name: fitila-web-${{ github.sha }}
          path: |
            fitila-web-deploy.tgz
            fitila-web-deploy.tgz.sha256
          if-no-files-found: error
          retention-days: 7

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 12
    if: ${{ vars.DEPLOY_ENABLED == 'true' }}
    steps:
      - name: Download validated deployment bundle
        uses: actions/download-artifact@v4
        with:
          name: fitila-web-${{ github.sha }}
          path: deploy-package

      - name: Verify bundle checksum
        run: |
          cd deploy-package
          sha256sum -c fitila-web-deploy.tgz.sha256

      - name: Copy validated bundle to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "deploy-package/fitila-web-deploy.tgz"
          target: "/home/debian/bariba-lex-builder"
          strip_components: 1

      - name: Activate validated bundle on VPS
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          command_timeout: 10m
          script: |
            set -e
            cd /home/debian/bariba-lex-builder

            echo "📦 Activation du build validé par GitHub..."
            rm -rf dist.next
            mkdir -p dist.next
            tar -xzf fitila-web-deploy.tgz -C /tmp
            test -f /tmp/dist/index.html

            rm -rf dist.next
            mv /tmp/dist dist.next
            cp /tmp/nginx.conf ./nginx.conf
            cp /tmp/docker-composer.yml ./docker-composer.yml
            rm -f fitila-web-deploy.tgz
            rm -rf /tmp/dist /tmp/nginx.conf /tmp/docker-composer.yml

            if [ -d dist ]; then
              rm -rf dist.previous
              mv dist dist.previous
            fi
            mv dist.next dist

            echo "🚀 Redémarrage Nginx sans build Docker..."
            docker compose -f docker-composer.yml pull react-app-bariba || true
            docker compose -f docker-composer.yml up -d --force-recreate --remove-orphans --no-build

            echo "🧪 Smoke tests FITILA / Classe / administration..."
            sleep 2
            curl -fsS --max-time 10 http://127.0.0.1:8085/ >/dev/null
            curl -fsS --max-time 10 http://127.0.0.1:8085/classe >/dev/null
            curl -fsS --max-time 10 http://127.0.0.1:8085/classe/N1 >/dev/null
            curl -fsS --max-time 10 http://127.0.0.1:8085/admin >/dev/null
            curl -fsS --max-time 10 http://127.0.0.1:8085/admin/apprendre-voice >/dev/null
            curl --resolve fitila.bj:443:127.0.0.1 -fsS --max-time 10 https://fitila.bj/classe >/dev/null

            echo "✅ FITILA web actif depuis le bundle GitHub ${{ github.sha }}"

            echo "🧹 Nettoyage léger..."
            rm -rf dist.previous
            docker image prune -f || true
