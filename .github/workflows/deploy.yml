# Build v2.5 - Fix Node.js 20 deprecation warning
name: Deploy React App Bariba de zime
on:
  push:
    branches:
      - main

concurrency:
  group: deploy-main
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout code
        uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v4.4.0
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Build application
        run: npm run build
        env:
          VITE_BUILD_SHA: ${{ github.sha }}
          VITE_BUILD_TIME: ${{ github.event.head_commit.timestamp }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}

      - name: Build successful
        run: echo "✅ Build completed successfully!"

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Only deploy if VPS secrets are configured
    if: ${{ vars.DEPLOY_ENABLED == 'true' }}
    steps:
      - name: Déployer sur le VPS avec Docker Compose
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          command_timeout: 20m
          script: |
            set -e  # Arrête le script en cas d'erreur

            cd /home/debian/bariba-lex-builder

            echo "🧹 Libération d'espace avant mise à jour..."
            docker image prune -af || true
            docker builder prune -af || true
            git gc --prune=now || true

            echo "📥 Mise à jour du code..."
            git fetch --prune origin main
            # Nettoyer les modifications locales avant checkout pour éviter
            # "local changes would be overwritten by checkout"
            git reset --hard HEAD || true
            git clean -fd
            git checkout -B main FETCH_HEAD
            git reset --hard FETCH_HEAD
            git clean -fd

            echo "🔨 Construction et redémarrage des services..."
            export VITE_BUILD_SHA=${{ github.sha }}
            export VITE_BUILD_TIME=$(date -Iseconds)
            export VITE_SUPABASE_URL=${{ secrets.VITE_SUPABASE_URL }}
            export VITE_SUPABASE_PUBLISHABLE_KEY=${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
            docker compose -f docker-composer.yml build
            docker compose -f docker-composer.yml up -d --force-recreate --remove-orphans

            echo "🧹 Nettoyage des anciennes images inutilisées...."
            docker image prune -f

            echo "🔐 Diagnostic TLS / Traefik fitila.bj..."
            echo "--- containers reverse proxy ---"
            docker ps --format '{{.Names}} {{.Image}} {{.Ports}}' | grep -Ei 'traefik|proxy|nginx|react-app-bariba' || true
            echo "--- certificate served for fitila.bj ---"
            timeout 8 sh -c "echo | openssl s_client -connect 127.0.0.1:443 -servername fitila.bj 2>/dev/null | openssl x509 -noout -subject -issuer -dates -ext subjectAltName" || true
            echo "--- HTTPS response ---"
            curl -k -sSI --max-time 10 https://fitila.bj/ | head -20 || true
            echo "--- Traefik labels for FITILA ---"
            docker inspect react-app-bariba-js --format '{{json .Config.Labels}}' || true
            echo "--- Traefik static configuration / mounts ---"
            docker inspect traefik --format 'CMD={{json .Config.Cmd}}' || true
            docker inspect traefik --format 'MOUNTS={{json .Mounts}}' || true
            docker inspect traefik --format 'LABELS={{json .Config.Labels}}' || true
            echo "--- TLS verification without insecure bypass ---"
            timeout 10 curl -fsSI https://fitila.bj/ | head -20 || true
            timeout 10 curl -fsSI https://fitila.bj/admin | head -20 || true
            timeout 10 sh -c "echo | openssl s_client -connect 127.0.0.1:443 -servername fitila.bj -verify_return_error 2>&1 | tail -25" || true
            echo "--- recent Traefik ACME/TLS logs ---"
            TRAEFIK_CONTAINER=$(docker ps --format '{{.Names}}' | grep -Ei '^traefik|traefik' | head -1 || true)
            if [ -n "$TRAEFIK_CONTAINER" ]; then
              docker logs --tail 250 "$TRAEFIK_CONTAINER" 2>&1 | grep -Ei 'fitila\.bj|acme|certificate|resolver|letsencrypt|tls' | tail -120 || true
            fi
