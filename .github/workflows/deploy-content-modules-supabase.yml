name: Deploy FITILA Content Modules to Supabase

on:
  push:
    branches:
      - release/fitila-flutter-android-v1.8.1-build12-web-parity
    paths:
      - supabase/migrations/**
      - supabase/functions/live-turn-credentials/**
      - supabase/functions/ai-translate/**
      - supabase/functions/bariba-tts/**
      - supabase/functions/_shared/**
      - .github/workflows/deploy-content-modules-supabase.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fitila-content-modules-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_ID: dvswhjawiooprghzeyol
      TURN_URLS: ${{ secrets.TURN_URLS }}
      TURN_SHARED_SECRET: ${{ secrets.TURN_SHARED_SECRET }}
      TURN_TTL_SECONDS: ${{ vars.TURN_TTL_SECONDS || '3600' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate production secrets
        shell: bash
        run: |
          set -euo pipefail
          for name in SUPABASE_ACCESS_TOKEN; do
            if [ -z "${!name:-}" ]; then
              echo "Missing required production secret: $name" >&2
              exit 1
            fi
          done
          if [ "$SUPABASE_PROJECT_ID" != "dvswhjawiooprghzeyol" ]; then
            echo "Refusing to deploy to an unexpected Supabase project." >&2
            exit 1
          fi

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Apply release database migration
        run: |
          python - <<'PY'
          from pathlib import Path
          from urllib.request import Request, urlopen
          import json
          import os

          project_ref = os.environ['SUPABASE_PROJECT_ID']
          access_token = os.environ['SUPABASE_ACCESS_TOKEN']
          migration = Path(
              'supabase/migrations/20260919133000_aburu_product_link_and_realtime.sql'
          ).read_text(encoding='utf-8')

          request = Request(
              f'https://api.supabase.com/v1/projects/{project_ref}/database/query',
              data=json.dumps({'query': migration}).encode('utf-8'),
              method='POST',
              headers={
                  'Authorization': f'Bearer {access_token}',
                  'Content-Type': 'application/json',
              },
          )
          with urlopen(request, timeout=180) as response:
              if response.status not in (200, 201):
                  raise SystemExit(
                      f'Database migration API returned HTTP {response.status}'
                  )
          print('Release database migration applied through Management API.')
          PY

      - name: Configure temporary TURN credentials
        run: |
          if [ -n "$TURN_URLS" ] && [ -n "$TURN_SHARED_SECRET" ]; then
            supabase secrets set \
              TURN_URLS="$TURN_URLS" \
              TURN_SHARED_SECRET="$TURN_SHARED_SECRET" \
              TURN_TTL_SECONDS="$TURN_TTL_SECONDS" \
              --project-ref "$SUPABASE_PROJECT_ID"
          else
            echo "TURN secrets are not configured; Live Griot will use STUN fallback."
          fi

      - name: Validate Echo service configuration
        shell: bash
        run: |
          set -euo pipefail
          secrets="$(supabase secrets list --project-ref "$SUPABASE_PROJECT_ID")"
          echo "$secrets" | grep -q 'LOVABLE_API_KEY' || {
            echo "Missing Supabase secret required by ai-translate: LOVABLE_API_KEY" >&2
            exit 1
          }
          echo "Echo translation secret is configured."
          if echo "$secrets" | grep -Eq 'HUGGING_FACE_API_TOKEN|HF_TOKEN|HUGGINGFACEHUB_API_TOKEN'; then
            echo "A Hugging Face token is configured for Bariba TTS."
          else
            echo "No Hugging Face token found; bariba-tts will rely on its configured/public Space fallback."
          fi

      - name: Deploy Echo translation and Bariba TTS functions
        run: |
          supabase functions deploy ai-translate \
            --project-ref "$SUPABASE_PROJECT_ID"
          supabase functions deploy bariba-tts \
            --project-ref "$SUPABASE_PROJECT_ID"

      - name: Deploy Live Griot TURN function
        run: |
          supabase functions deploy live-turn-credentials \
            --project-ref "$SUPABASE_PROJECT_ID"

      - name: Verify deployed schema contract
        run: |
          python - <<'PY'
          from pathlib import Path
          from urllib.error import HTTPError
          from urllib.request import Request, urlopen
          import json

          values = {}
          for raw in Path('.env').read_text(encoding='utf-8').splitlines():
              line = raw.strip()
              if line and not line.startswith('#') and '=' in line:
                  key, value = line.split('=', 1)
                  values[key.strip()] = value.strip().strip('"').strip("'")

          url = values.get('SUPABASE_URL') or values.get('VITE_SUPABASE_URL')
          key = (
              values.get('SUPABASE_ANON_KEY')
              or values.get('SUPABASE_PUBLISHABLE_KEY')
              or values.get('VITE_SUPABASE_PUBLISHABLE_KEY')
          )
          request = Request(
              f'{url}/rest/v1/rpc/fitila_content_modules_schema_version',
              data=b'{}',
              method='POST',
              headers={
                  'apikey': key,
                  'Authorization': f'Bearer {key}',
                  'Content-Type': 'application/json',
              },
          )
          with urlopen(request, timeout=20) as response:
              version = json.loads(response.read().decode('utf-8'))
          if version != '20260918.2':
              raise SystemExit(f'Unexpected content-module schema: {version!r}')

          product_request = Request(
              f'{url}/rest/v1/tamtam_posts?select=id,product_id&limit=1',
              headers={
                  'apikey': key,
                  'Authorization': f'Bearer {key}',
              },
          )
          try:
              with urlopen(product_request, timeout=20) as response:
                  if response.status != 200:
                      raise SystemExit(
                          f'Aburu product relation unavailable (HTTP {response.status})'
                      )
          except HTTPError as error:
              raise SystemExit(
                  f'Aburu product relation unavailable (HTTP {error.code})'
              )

          for function_name in ('ai-translate', 'bariba-tts'):
              request = Request(
                  f'{url}/functions/v1/{function_name}',
                  method='OPTIONS',
                  headers={
                      'apikey': key,
                      'Authorization': f'Bearer {key}',
                      'Origin': 'https://fitila.bj',
                      'Access-Control-Request-Method': 'POST',
                      'Access-Control-Request-Headers': 'authorization,content-type',
                  },
              )
              try:
                  with urlopen(request, timeout=20) as response:
                      status = response.status
              except HTTPError as error:
                  status = error.code
              if status not in (200, 204, 401):
                  raise SystemExit(
                      f'{function_name} is unavailable (HTTP {status})'
                  )

          turn_request = Request(
              f'{url}/functions/v1/live-turn-credentials',
              data=b'{}',
              method='POST',
              headers={
                  'apikey': key,
                  'Authorization': f'Bearer {key}',
                  'Content-Type': 'application/json',
              },
          )
          try:
              with urlopen(turn_request, timeout=20) as response:
                  status = response.status
          except HTTPError as error:
              status = error.code
          if status not in (200, 401):
              raise SystemExit(
                  f'live-turn-credentials is unavailable (HTTP {status})'
              )
          print('Supabase content-module schema 20260918.2 is deployed.')
          print('Echo ai-translate and bariba-tts endpoints are deployed.')
          print('Live Griot TURN credential endpoint is deployed.')
          PY
