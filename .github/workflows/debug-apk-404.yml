name: Debug APK 404 (temporaire)

on:
  workflow_dispatch: {}

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - name: en-tetes publics de l'APK arm64
        run: |
          OUT="$(curl -sS -I "https://fitila.bj/dunya-packs/android/v1.8.22-build33-223/FITILA-Android-v1.8.22-build33-keyboard-translator-arm64.apk" 2>&1 | tr -d '\r' | tr '\n' '|')"
          echo "::notice::head: ${OUT}"

      - name: debut du fichier (signature zip/APK)
        run: |
          OUT="$(curl -sS -r 0-3 "https://fitila.bj/dunya-packs/android/v1.8.22-build33-223/FITILA-Android-v1.8.22-build33-keyboard-translator-arm64.apk" | head -c 4 | od -An -c | tr -s ' ')"
          echo "::notice::magic: ${OUT}"

      - name: releases.json public
        run: |
          OUT="$(curl -sS "https://fitila.bj/dunya-packs/android/releases.json" | python3 -c "import json,sys; d=json.load(sys.stdin); print([r['version'] for r in d['releases']][-3:])")"
          echo "::notice::releases: ${OUT}"

      - name: page install
        run: |
          OUT="$(curl -sS -o /dev/null -w 'code=%{http_code}' https://fitila.bj/install)"
          echo "::notice::install: ${OUT}"
