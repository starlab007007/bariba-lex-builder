name: Debug voice-gateway torchaudio (container python:3.11-slim)

# Workflow de diagnostic jetable : le job tourne DANS un conteneur
# python:3.11-slim (la même image de base que voice-gateway/Dockerfile),
# via `jobs.<job>.container`, pour reproduire fidèlement l'environnement
# du build Docker qui échoue — tout en gardant des étapes `run:` natives
# (annotations ::notice:: fiables), contrairement à docker/build-push-action
# (buildx) qui ne remonte qu'un résumé "exit code: 1" sans détail.
# À supprimer une fois le diagnostic terminé.

on:
  workflow_dispatch: {}

jobs:
  debug:
    runs-on: ubuntu-latest
    container:
      image: python:3.11-slim
    steps:
      - name: apt-get (mêmes paquets que le Dockerfile)
        run: |
          apt-get update -qq
          apt-get install -y --no-install-recommends ffmpeg libsndfile1 build-essential cmake > /tmp/apt.log 2>&1
          echo "::notice::apt exit=$? — $(tail -c 300 /tmp/apt.log | tr '\n' '|')"
        continue-on-error: true

      - name: écrire requirements.txt (identique au Dockerfile, pas de checkout — git absent de l'image slim)
        run: |
          cat > /tmp/requirements.txt <<'EOF'
          transformers>=4.46,<5
          numpy
          omnilingual-asr
          soundfile
          fastapi
          uvicorn[standard]
          pydantic
          EOF
        continue-on-error: true

      - name: pip install -r requirements.txt
        run: |
          set +e
          pip install --no-cache-dir --upgrade pip setuptools wheel > /tmp/install0.log 2>&1
          pip install --no-cache-dir -r /tmp/requirements.txt > /tmp/install.log 2>&1
          echo "exit=$?" >> /tmp/install.log
          echo "::notice::install (fin): $(tail -c 900 /tmp/install.log | tr '\n' '|')"
        continue-on-error: true

      - name: Versions résolues (pip show)
        run: |
          set +e
          TORCH_VER="$(pip show torch 2>/tmp/te.txt | grep -i '^Version:' | awk '{print $2}' | cut -d'+' -f1)"
          TORCHAUDIO_VER="$(pip show torchaudio 2>/tmp/tae.txt | grep -i '^Version:' | awk '{print $2}' | cut -d'+' -f1)"
          echo "::notice::torch=${TORCH_VER:-ÉCHEC} torchaudio=${TORCHAUDIO_VER:-ÉCHEC} | torch_err=$(tail -c 200 /tmp/te.txt|tr '\n' ' ') | ta_err=$(tail -c 200 /tmp/tae.txt|tr '\n' ' ')"
        continue-on-error: true

      - name: Force-reinstall CPU (partie 1)
        run: |
          set +e
          TORCH_VER="$(pip show torch | grep -i '^Version:' | awk '{print $2}' | cut -d'+' -f1)"
          TORCHAUDIO_VER="$(pip show torchaudio | grep -i '^Version:' | awk '{print $2}' | cut -d'+' -f1)"
          {
            echo "resolved torch=${TORCH_VER:-vide} torchaudio=${TORCHAUDIO_VER:-vide}"
            pip install --no-cache-dir --force-reinstall --no-deps "torch==${TORCH_VER}" ${TORCHAUDIO_VER:+"torchaudio==${TORCHAUDIO_VER}"} --index-url https://download.pytorch.org/whl/cpu
            echo "exit=$?"
          } > /tmp/pipout.txt 2>&1
          echo "::notice::p1: $(cut -c1-900 /tmp/pipout.txt | tr '\n' '|')"
        continue-on-error: true

      - name: Force-reinstall CPU (partie 2)
        run: |
          echo "::notice::p2: $(cut -c901-1800 /tmp/pipout.txt 2>/dev/null | tr '\n' '|')"
        continue-on-error: true

      - name: Force-reinstall CPU (partie 3, fin)
        run: |
          LEN=$(wc -c < /tmp/pipout.txt 2>/dev/null || echo 0)
          echo "::notice::p3 (len=${LEN}): $(tail -c 900 /tmp/pipout.txt 2>/dev/null | tr '\n' '|')"
        continue-on-error: true

      - name: Vérification import finale
        run: |
          set +e
          python -c "import torch; print('torch:', torch.__version__, torch.cuda.is_available())" > /tmp/vt.txt 2>&1
          echo "::notice::verif torch: $(tail -c 400 /tmp/vt.txt | tr '\n' '|')"
          python -c "import torchaudio; print('torchaudio:', torchaudio.__version__)" > /tmp/vta.txt 2>&1
          echo "::notice::verif torchaudio: $(tail -c 400 /tmp/vta.txt | tr '\n' '|')"
        continue-on-error: true
