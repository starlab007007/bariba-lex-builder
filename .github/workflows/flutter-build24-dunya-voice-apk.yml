# FITILA Build24 — DUNYA voix hors ligne
name: FITILA Build24 DUNYA Voice APK

on:
  push:
    branches:
      - feat/build24-dunya-voice-offline
    paths:
      - 'fitila_flutter/**'
      - '.github/workflows/flutter-build24-dunya-voice-apk.yml'
  workflow_dispatch:

concurrency:
  group: fitila-build24-apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-apk:
    name: Android release APK 1.8.15+26
    runs-on: ubuntu-latest
    timeout-minutes: 75
    defaults:
      run:
        working-directory: fitila_flutter

    steps:
      - name: Checkout Build24
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Flutter 3.47.4
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          channel: stable
          cache: true

      - name: Verify release metadata
        run: |
          flutter --version
          grep -q '^version: 1.8.15+26$' pubspec.yaml
          grep -q 'sherpa_onnx' pubspec.yaml
          test -x android/gradlew
          grep -q 'android.permission.INTERNET' android/app/src/main/AndroidManifest.xml

      - name: Prepare FITILA server configuration
        run: |
          python - <<'PY'
          from pathlib import Path
          import json

          env_path = Path('../.env')
          if not env_path.exists():
              raise SystemExit('FITILA server configuration file ../.env is missing')

          env = {}
          for raw in env_path.read_text(encoding='utf-8').splitlines():
              line = raw.strip()
              if line and not line.startswith('#') and '=' in line:
                  key, value = line.split('=', 1)
                  env[key.strip()] = value.strip().strip('"').strip("'")

          url = env.get('SUPABASE_URL') or env.get('VITE_SUPABASE_URL') or ''
          key = (
              env.get('SUPABASE_ANON_KEY')
              or env.get('SUPABASE_PUBLISHABLE_KEY')
              or env.get('VITE_SUPABASE_PUBLISHABLE_KEY')
              or ''
          )
          if not url or not key:
              raise SystemExit('FITILA Supabase URL/publishable key is missing')

          Path('.ci-dart-defines.json').write_text(
              json.dumps({'SUPABASE_URL': url, 'SUPABASE_ANON_KEY': key}),
              encoding='utf-8',
          )
          PY

      - name: Resolve dependencies
        run: flutter pub get

      - name: Static analysis
        run: |
          set -o pipefail
          mkdir -p build/ci-report
          flutter analyze 2>&1 | tee build/ci-report/analyze.txt

      - name: Full Flutter tests
        run: |
          set -o pipefail
          flutter test --dart-define-from-file=.ci-dart-defines.json --reporter expanded 2>&1 | tee build/ci-report/test.txt

      - name: Prepare Android release signing
        env:
          FITILA_KEYSTORE_BASE64: ${{ secrets.FITILA_KEYSTORE_BASE64 }}
          FITILA_KEYSTORE_PASSWORD: ${{ secrets.FITILA_KEYSTORE_PASSWORD }}
          FITILA_KEY_ALIAS: ${{ secrets.FITILA_KEY_ALIAS }}
          FITILA_KEY_PASSWORD: ${{ secrets.FITILA_KEY_PASSWORD }}
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64, os, secrets, subprocess

          names = (
              'FITILA_KEYSTORE_BASE64',
              'FITILA_KEYSTORE_PASSWORD',
              'FITILA_KEY_ALIAS',
              'FITILA_KEY_PASSWORD',
          )
          values = {name: os.environ.get(name, '') for name in names}
          production_ready = all(values.values())

          if production_ready:
              keystore = Path('android/app/fitila-release.jks')
              keystore.write_bytes(base64.b64decode(values['FITILA_KEYSTORE_BASE64']))
              store_password = values['FITILA_KEYSTORE_PASSWORD']
              key_alias = values['FITILA_KEY_ALIAS']
              key_password = values['FITILA_KEY_PASSWORD']
              mode = 'production'
          else:
              keystore = Path('android/app/fitila-ci-release.jks')
              store_password = secrets.token_urlsafe(24)
              key_password = store_password
              key_alias = 'fitila-ci'
              subprocess.run([
                  'keytool','-genkeypair','-noprompt',
                  '-keystore',str(keystore),
                  '-storepass',store_password,
                  '-keypass',key_password,
                  '-alias',key_alias,
                  '-keyalg','RSA','-keysize','2048','-validity','3650',
                  '-dname','CN=FITILA CI Release,O=FITILA,C=BJ'
              ], check=True)
              mode = 'ci-ephemeral'

          Path('android/key.properties').write_text('\n'.join([
              f'storeFile=app/{keystore.name}',
              f'storePassword={store_password}',
              f'keyAlias={key_alias}',
              f'keyPassword={key_password}',
              ''
          ]), encoding='utf-8')

          Path('build').mkdir(exist_ok=True)
          Path('build/SIGNING_MODE.txt').write_text(mode+'\n', encoding='utf-8')
          print('SIGNING_MODE='+mode)
          PY

      - name: Build release APKs (universal + per processor)
        run: |
          set -o pipefail
          exec > >(tee build/ci-report/build.txt) 2>&1
          flutter build apk --release \
            --dart-define-from-file=.ci-dart-defines.json \
            --obfuscate \
            --split-debug-info=build/symbols
          mkdir -p build/universal
          cp build/app/outputs/flutter-apk/app-release.apk build/universal/
          flutter build apk --release --split-per-abi \
            --target-platform android-arm,android-arm64 \
            --dart-define-from-file=.ci-dart-defines.json \
            --obfuscate \
            --split-debug-info=build/symbols-split

      - name: Verify and package APKs
        run: |
          set -euo pipefail
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          mkdir -p build/final-apk
          declare -A apks=(
            [universal]=build/universal/app-release.apk
            [arm64]=build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
            [armv7]=build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
          )
          for kind in universal arm64 armv7; do
            src="${apks[$kind]}"
            test -s "$src"
            unzip -t "$src" >/dev/null
            unzip -l "$src" | grep -q 'libsherpa-onnx-c-api.so'
            "$APKSIGNER" verify "$src"
            cp "$src" "build/final-apk/FITILA-Android-v1.8.15-build26-dunya-voice-$kind.apk"
          done
          "$APKSIGNER" verify --print-certs build/universal/app-release.apk | head -5
          cp build/SIGNING_MODE.txt build/final-apk/
          cd build/final-apk
          sha256sum *.apk | tee SHA256SUMS.txt
          du -h *.apk | tee SIZES.txt

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: FITILA-Android-v1.8.15-build26-dunya-voice
          path: fitila_flutter/build/final-apk/
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

      - name: Publish CI report (branch ci-reports/build24)
        if: always()
        working-directory: .
        run: |
          set +e
          mkdir -p /tmp/report
          cp -R fitila_flutter/build/ci-report/. /tmp/report/ 2>/dev/null
          cp fitila_flutter/build/final-apk/SIZES.txt fitila_flutter/build/final-apk/SHA256SUMS.txt /tmp/report/ 2>/dev/null
          echo "${{ github.sha }} ${{ job.status }}" > /tmp/report/STATUS.txt
          header="$(git config --get http.https://github.com/.extraheader)"
          cd /tmp/report
          git init -q
          git checkout -q -b ci-reports/build24
          git -c user.name=fitila-ci -c user.email=ci@fitila.bj add -A
          git -c user.name=fitila-ci -c user.email=ci@fitila.bj commit -qm "CI report ${{ github.sha }}"
          git -c http.extraheader="$header" push -qf "https://github.com/${{ github.repository }}" ci-reports/build24

      - name: Publish prerelease fitila-v1.8.15-build26
        env:
          GH_TOKEN: ${{ github.token }}
        working-directory: fitila_flutter/build/final-apk
        run: |
          set -euo pipefail
          tag=fitila-v1.8.15-build26
          notes="FITILA 1.8.15+26 — DUNYA voix d'abord, 100 % hors ligne (écoute FR + baatɔnum, voix baatɔnum, rappels, calculs, mémoire). APK armv7 pour les téléphones d'entrée de gamme, arm64 pour les récents, universal sinon. Installer ensuite le pack voix depuis l'app (release dunya-voice-pack-v1). Signature : $(cat SIGNING_MODE.txt)."
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" *.apk SHA256SUMS.txt SIZES.txt --clobber
          else
            gh release create "$tag" *.apk SHA256SUMS.txt SIZES.txt --title "FITILA 1.8.15 Build26 — DUNYA Voix" --notes "$notes" --target "$GITHUB_SHA" --prerelease
          fi
