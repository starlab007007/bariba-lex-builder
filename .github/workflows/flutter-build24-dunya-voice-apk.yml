# FITILA Build24 — DUNYA voix hors ligne
name: FITILA Android Keyboard Translator Fix

on:
  push:
    branches:
      - main
      - feat/build24-dunya-voice-offline
      - fix/flutter-keyboard-translator-20261016
      - release/fitila-web-flutter-parity-20261016
      - fix/fitila-bilingual-native-predictions-20261016
      - feat/fitila-native-keyboard-auto-bidirectional-20261016
      - feat/fitila-byt5-keyboard-copy-send-20261016
      - feat/dunya-hybrid-online-offline-mms-omni-20261016
      - feat/fitila-village-offline-mms-packs-20261017
    paths:
      - 'fitila_flutter/**'
      - '.github/workflows/flutter-build24-dunya-voice-apk.yml'
      - 'scripts/test-native-keyboard-translator.py'
  workflow_dispatch:

concurrency:
  group: fitila-build24-apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-apk:
    name: Android release APK 1.8.23+34
    runs-on: ubuntu-latest
    timeout-minutes: 75
    defaults:
      run:
        working-directory: fitila_flutter

    steps:
      - name: Checkout Build24
        uses: actions/checkout@v4

      - name: Free runner disk space
        working-directory: .
        run: |
          df -h / | tail -1
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/local/share/boost \
            /usr/share/swift /opt/hostedtoolcache /usr/local/lib/node_modules \
            /usr/local/share/powershell /usr/local/share/chromium /usr/share/miniconda \
            /usr/local/julia* /opt/az /opt/microsoft /opt/google /usr/lib/google-cloud-sdk \
            /usr/local/aws-cli /usr/local/aws-sam-cli /usr/share/az_* || true
          sudo docker system prune -af >/dev/null 2>&1 || true
          sudo apt-get clean || true
          df -h / | tail -1

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Flutter 3.47.4
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          channel: stable
          cache: true

      - name: Cache Gradle dependencies
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Verify release metadata
        run: |
          flutter --version
          grep -q '^version: 1.8.23+34$' pubspec.yaml
          grep -q 'sherpa_onnx' pubspec.yaml
          test -x android/gradlew
          grep -q 'android.permission.INTERNET' android/app/src/main/AndroidManifest.xml

      - name: Prepare FITILA server configuration
        run: |
          python - <<'PY'
          from pathlib import Path
          import json

          env_path = Path('../.env')
          if not env_path.exists():
              raise SystemExit('FITILA server configuration file ../.env is missing')

          env = {}
          for raw in env_path.read_text(encoding='utf-8').splitlines():
              line = raw.strip()
              if line and not line.startswith('#') and '=' in line:
                  key, value = line.split('=', 1)
                  env[key.strip()] = value.strip().strip('"').strip("'")

          url = env.get('SUPABASE_URL') or env.get('VITE_SUPABASE_URL') or ''
          key = (
              env.get('SUPABASE_ANON_KEY')
              or env.get('SUPABASE_PUBLISHABLE_KEY')
              or env.get('VITE_SUPABASE_PUBLISHABLE_KEY')
              or ''
          )
          if not url or not key:
              raise SystemExit('FITILA Supabase URL/publishable key is missing')

          Path('.ci-dart-defines.json').write_text(
              json.dumps({'SUPABASE_URL': url, 'SUPABASE_ANON_KEY': key}),
              encoding='utf-8',
          )
          PY

      - name: Resolve dependencies
        run: flutter pub get

      - name: Reuse checks for the identical verified application source
        id: prevalidated
        working-directory: .
        run: |
          # Run 38872707041 passed 24 native tests and 214 Flutter tests.
          # Only the emulator driver changed. Any app/config change runs them again.
          if [ "$(git rev-parse HEAD:fitila_flutter)" = "659f0f26bfe29510a98dae01c0d707a6ecf6dcfe" ] && [ "$(git rev-parse HEAD:.env)" = "4f553b4b030f09c9847f474e88488880908c98c0" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Application source matches the tested tree from run 38872707041."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Static analysis
        if: steps.prevalidated.outputs.skip != 'true'
        run: |
          set -o pipefail
          mkdir -p build/ci-report
          flutter analyze 2>&1 | tee build/ci-report/analyze.txt

      - name: Provide swap for native compilation and tests
        working-directory: .
        run: |
          sudo swapoff -a || true
          sudo fallocate -l 12G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile >/dev/null
          sudo swapon /swapfile
          free -h

      - name: Native keyboard regression tests
        if: steps.prevalidated.outputs.skip != 'true'
        run: |
          cd android
          ./gradlew :app:testDebugUnitTest --tests "com.fitila.bariba.*" --max-workers=2 -Ptarget-platform=android-x64 --stacktrace

      - name: Full Flutter tests
        if: steps.prevalidated.outputs.skip != 'true'
        run: |
          set -o pipefail
          flutter test --dart-define-from-file=.ci-dart-defines.json --reporter expanded 2>&1 | tee build/ci-report/test.txt

      - name: Build emulator APK
        run: flutter build apk --debug --target-platform android-x64 --dart-define-from-file=.ci-dart-defines.json

      - name: Enable KVM
        run: sudo chmod 666 /dev/kvm

      - name: Exercise real Android keyboard and deployed ByT5
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: |
            adb install -r fitila_flutter/build/app/outputs/flutter-apk/app-debug.apk
            python3 scripts/test-native-keyboard-translator.py

      - name: Upload native keyboard emulator evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: FITILA-Keyboard-Translator-Android-Evidence
          path: keyboard-emulator-proof/
          if-no-files-found: ignore
          retention-days: 14

      - name: Prepare Android release signing
        env:
          FITILA_KEYSTORE_BASE64: ${{ secrets.FITILA_KEYSTORE_BASE64 }}
          FITILA_KEYSTORE_PASSWORD: ${{ secrets.FITILA_KEYSTORE_PASSWORD }}
          FITILA_KEY_ALIAS: ${{ secrets.FITILA_KEY_ALIAS }}
          FITILA_KEY_PASSWORD: ${{ secrets.FITILA_KEY_PASSWORD }}
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64, os, secrets, subprocess

          names = (
              'FITILA_KEYSTORE_BASE64',
              'FITILA_KEYSTORE_PASSWORD',
              'FITILA_KEY_ALIAS',
              'FITILA_KEY_PASSWORD',
          )
          values = {name: os.environ.get(name, '') for name in names}
          production_ready = all(values.values())

          if production_ready:
              keystore = Path('android/app/fitila-release.jks')
              keystore.write_bytes(base64.b64decode(values['FITILA_KEYSTORE_BASE64']))
              store_password = values['FITILA_KEYSTORE_PASSWORD']
              key_alias = values['FITILA_KEY_ALIAS']
              key_password = values['FITILA_KEY_PASSWORD']
              mode = 'production'
          else:
              keystore = Path('android/app/fitila-ci-release.jks')
              store_password = secrets.token_urlsafe(24)
              key_password = store_password
              key_alias = 'fitila-ci'
              subprocess.run([
                  'keytool','-genkeypair','-noprompt',
                  '-keystore',str(keystore),
                  '-storepass',store_password,
                  '-keypass',key_password,
                  '-alias',key_alias,
                  '-keyalg','RSA','-keysize','2048','-validity','3650',
                  '-dname','CN=FITILA CI Release,O=FITILA,C=BJ'
              ], check=True)
              mode = 'ci-ephemeral'

          Path('android/key.properties').write_text('\n'.join([
              f'storeFile=app/{keystore.name}',
              f'storePassword={store_password}',
              f'keyAlias={key_alias}',
              f'keyPassword={key_password}',
              f'parallelValidation={str(not production_ready).lower()}',
              ''
          ]), encoding='utf-8')

          Path('build').mkdir(exist_ok=True)
          Path('build/SIGNING_MODE.txt').write_text(mode+'\n', encoding='utf-8')
          Path('build/INSTALL_MODE.txt').write_text(('production-update' if production_ready else 'parallel-keyboard-validation')+'\n', encoding='utf-8')
          print('SIGNING_MODE='+mode)
          PY

      - name: Build release APKs (per processor)
        run: |
          set -o pipefail
          exec > >(tee build/ci-report/build.txt) 2>&1
          flutter build apk --release --split-per-abi \
            --target-platform android-arm,android-arm64 \
            --dart-define-from-file=.ci-dart-defines.json \
            --obfuscate \
            --split-debug-info=build/symbols
          df -h / | tail -1

      - name: Verify and package APKs
        run: |
          set -euo pipefail
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          mkdir -p build/final-apk
          declare -A apks=(
            [arm64]=build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
            [armv7]=build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
          )
          for kind in arm64 armv7; do
            src="${apks[$kind]}"
            test -s "$src"
            unzip -t "$src" >/dev/null
            unzip -l "$src" | grep -q 'libsherpa-onnx-c-api.so'
            "$APKSIGNER" verify "$src"
            cp "$src" "build/final-apk/FITILA-Android-v1.8.23-build34-keyboard-translator-$kind.apk"
          done
          "$APKSIGNER" verify --print-certs build/final-apk/*-arm64.apk > build/final-apk/SIGNER.txt
          grep -iE "certificate (DN|SHA-256)" build/final-apk/SIGNER.txt || cat build/final-apk/SIGNER.txt
          cp build/SIGNING_MODE.txt build/INSTALL_MODE.txt build/final-apk/
          cd build/final-apk
          sha256sum *.apk | tee SHA256SUMS.txt
          du -h *.apk | tee SIZES.txt

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: FITILA-Android-v1.8.23-build34-keyboard-translator
          path: |
            fitila_flutter/build/final-apk/
            fitila_flutter/build/app/reports/tests/
            fitila_flutter/build/app/test-results/
          if-no-files-found: error
          compression-level: 0
          retention-days: 30


