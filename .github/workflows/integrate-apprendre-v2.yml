name: Integrate Apprendre V2 payload

on:
  push:
    branches:
      - feat/apprendre-v2-integral-20260926
    paths:
      - '.github/workflows/integrate-apprendre-v2.yml'
      - '.integration/apprendre_code_payload.b64.*'
      - 'fitila_flutter/assets/data/apprendre_v2.gz.b64.*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore exact uploaded Apprendre files
        shell: bash
        run: |
          set -euo pipefail
          cat .integration/apprendre_code_payload.b64.0{0,1,2,3,4,5}             | tr -d '\r\n'             | base64 -d > /tmp/apprendre-delta.tar.gz
          echo "0634ff3cd8817348288836ca810aeb27292bf2d527aa1e05f9e89f065c6894bd  /tmp/apprendre-delta.tar.gz"             | sha256sum -c -
          tar -xzf /tmp/apprendre-delta.tar.gz -C .

          cat fitila_flutter/assets/data/apprendre_v2.gz.b64.*             | tr -d '\r\n'             | base64 -d > /tmp/apprendre-v2.json.gz
          gzip -dc /tmp/apprendre-v2.json.gz > fitila_flutter/assets/data/apprendre_v2.json
          echo "2c3b072cd100bba66dde301439aea91e81980089b301235116d2f7aa54a4bd7b  fitila_flutter/assets/data/apprendre_v2.json"             | sha256sum -c -

      - name: Validate offline learning corpus
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          p = Path('fitila_flutter/assets/data/apprendre_v2.json')
          d = json.loads(p.read_text(encoding='utf-8'))
          assert d['version'] == '2.0.0'
          assert len(d['profiles']) == 4
          assert len(d['foundations']) == 10
          assert len(d['themes']) == 12
          assert len(d['cards']) == 1847
          assert len(d['scenes']) == 3
          assert len(d['proverbs']) == 3
          assert all(t['cards'] for t in d['themes'])
          print('Apprendre corpus OK:', {
              'profiles': len(d['profiles']),
              'foundations': len(d['foundations']),
              'themes': len(d['themes']),
              'cards': len(d['cards']),
              'scenes': len(d['scenes']),
              'proverbs': len(d['proverbs']),
          })
          PY

      - name: Integrate Apprendre route without touching other modules
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          p = Path('fitila_flutter/lib/main.dart')
          s = p.read_text(encoding='utf-8')

          import_line = "import 'apprendre/apprendre_hub.dart';\n"
          if import_line not in s:
              anchor = "import 'core/web_parity_models.dart';\n"
              if anchor not in s:
                  raise SystemExit('main.dart import anchor not found')
              s = s.replace(anchor, anchor + import_line, 1)

          old = "FitilaPage.learn => const LearnScreen(),"
          new = """FitilaPage.learn => ApprendreHubScreen(
            links: [
              ApLegacyLink(
                label: 'Badges',
                icon: Icons.emoji_events_rounded,
                builder: (_) => const LearningBadgesScreen(),
              ),
              ApLegacyLink(
                label: 'Historique',
                icon: Icons.history_rounded,
                builder: (_) => const LearningHistoryScreen(),
              ),
              ApLegacyLink(
                label: 'Profil apprenant',
                icon: Icons.badge_rounded,
                builder: (_) => const LearnerProfileScreen(),
              ),
              ApLegacyLink(
                label: 'Classe (lecture)',
                icon: Icons.school_rounded,
                builder: (_) => const ClasseScreen(),
              ),
            ],
          ),"""
          if 'FitilaPage.learn => ApprendreHubScreen(' not in s:
              if old not in s:
                  raise SystemExit('main.dart learn route anchor not found')
              s = s.replace(old, new, 1)

          p.write_text(s, encoding='utf-8')
          PY

      - name: Verify exact Apprendre source payload
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import hashlib

          expected = {
            'fitila_flutter/lib/apprendre/apprendre_explore.dart': ('678db54ff0a31e49b3529007f1f52924056cb4f2', 25479),
            'fitila_flutter/lib/apprendre/apprendre_foundation.dart': ('34e9d1f8d2af6a63c68d7f51ea590aab2a94968f', 18225),
            'fitila_flutter/lib/apprendre/apprendre_hub.dart': ('d10835330e3ac283aab88d5368031fcb1abaeca7', 21135),
            'fitila_flutter/lib/apprendre/apprendre_models.dart': ('908a56c13b235844dafb72bd58b79a113492226d', 12062),
            'fitila_flutter/lib/apprendre/apprendre_onboarding.dart': ('831d2d877ff00548391cb41ca3c5d85cf238ce24', 7187),
            'fitila_flutter/lib/apprendre/apprendre_session.dart': ('dc62a4a045ef649a5fe2d12e6f4e3e516e3a1f95', 26623),
            'fitila_flutter/lib/apprendre/apprendre_store.dart': ('34d48bbd33b9296eeed7a4eb1cd57293ca5e254f', 8064),
            'fitila_flutter/lib/apprendre/apprendre_tasks.dart': ('6c048e775104c6b4e244cb5deae9f9b734d6ba10', 12170),
            'fitila_flutter/lib/apprendre/apprendre_ui.dart': ('dc766a999e59d921cde5672db6b9dbd172aa4a50', 18287),
            'fitila_flutter/test/apprendre_module_test.dart': ('885066911ba6ef28239213ce709ec8a72ea1359f', 5316),
          }
          for name, (blob_sha, size) in expected.items():
              b = Path(name).read_bytes()
              assert len(b) == size, (name, len(b), size)
              actual = hashlib.sha1(b'blob ' + str(len(b)).encode() + b'\0' + b).hexdigest()
              assert actual == blob_sha, (name, actual, blob_sha)
          print('Exact uploaded Apprendre code verified.')
          PY

      - name: Commit integrated module
        shell: bash
        run: |
          set -euo pipefail
          rm -f .integration/apprendre_code_payload.b64.*
          rm -f fitila_flutter/assets/data/apprendre_v2.gz.b64.*
          git config user.name "FITILA CI"
          git config user.email "actions@fitila.local"
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing to commit."
            exit 0
          fi
          git commit -m "feat(apprendre): integrate uploaded Mɛɛribu v2 module"
          git push origin HEAD:feat/apprendre-v2-integral-20260926
