name: Validate DUNYA Flutter parity
on:
  push:
    branches:
      - fix/dunya-flutter-online-web-parity-20261018
    paths:
      - 'fitila_flutter/**'
      - '.github/workflows/validate-dunya-flutter-parity.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-dunya-flutter-parity-${{ github.ref }}
  cancel-in-progress: true

jobs:
  flutter-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Java 21 for MapLibre Android compilation
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          channel: stable
          cache: true
      - name: Offline ByT5 certification gate tests
        run: python3 -m unittest discover -s scripts/dunya_translate -p 'test_certify_mobile_pack.py' -v
      - name: Dependencies
        working-directory: fitila_flutter
        run: flutter pub get
      - name: Static analysis
        working-directory: fitila_flutter
        run: flutter analyze
      - name: Verify Java toolchain
        run: java -version
      - name: Bound CI Gradle memory and workers
        working-directory: fitila_flutter
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('android/gradle.properties')
          content = p.read_text()
          content = content.replace('-Xmx8G', '-Xmx3G').replace('-XX:MaxMetaspaceSize=4G', '-XX:MaxMetaspaceSize=768m')
          content += '\norg.gradle.workers.max=2\norg.gradle.parallel=false\nkotlin.compiler.execution.strategy=in-process\n'
          p.write_text(content)
          PY
      - name: Compile Kotlin Android independently
        working-directory: fitila_flutter/android
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/dunya-logs"
          chmod +x gradlew
          set -o pipefail
          ./gradlew :app:compileDebugKotlin --no-daemon --max-workers=2 --console=plain --stacktrace 2>&1 | tee "$RUNNER_TEMP/dunya-logs/kotlin-debug.log"
      - name: Build arm64 Android debug APK
        working-directory: fitila_flutter
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/dunya-logs"
          set -o pipefail
          flutter build apk --debug --target-platform android-arm64 2>&1 | tee "$RUNNER_TEMP/dunya-logs/android-arm64-debug.log"
      - name: Preserve Android diagnostics independently of Flutter build
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dunya-android-build-diagnostics
          path: ${{ runner.temp }}/dunya-logs/*.log
          retention-days: 7
          if-no-files-found: error
      - name: DUNYA routing regression tests
        working-directory: fitila_flutter
        run: |
          flutter test test/dunya_online_routing_test.dart
          flutter test test/dunya_assistant_test.dart
      - name: Full Flutter test suite
        working-directory: fitila_flutter
        run: flutter test
