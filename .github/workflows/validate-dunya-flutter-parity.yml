name: Validate DUNYA Flutter parity
on:
  push:
    branches:
      - fix/dunya-flutter-online-web-parity-20261018
    paths:
      - 'fitila_flutter/**'
      - '.github/workflows/validate-dunya-flutter-parity.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-dunya-flutter-parity-${{ github.ref }}
  cancel-in-progress: true

jobs:
  flutter-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Java 21 for MapLibre Android compilation
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          channel: stable
          cache: true
      - name: Offline ByT5 certification gate tests
        run: python3 -m unittest discover -s scripts/dunya_translate -p 'test_certify_mobile_pack.py' -v
      - name: Dependencies
        working-directory: fitila_flutter
        run: flutter pub get
      - name: Static analysis
        working-directory: fitila_flutter
        run: flutter analyze
      # Android compilation is handled by dunya-android-arm64-artifact.yml.
      # Do not compile native Kotlin + the full APK again in this QA job:
      # the duplicate NDK/CMake install exhausted the runner disk.
      - name: Disk space diagnostics
        run: df -h /
      - name: Linguistic quality regressions
        working-directory: fitila_flutter
        run: |
          flutter test test/dunya_linguistic_quality_test.dart
          flutter test test/dunya_translation_memory_test.dart
      - name: DUNYA routing regression tests
        working-directory: fitila_flutter
        run: |
          flutter test test/dunya_online_routing_test.dart
          flutter test test/dunya_assistant_test.dart
      - name: Full Flutter test suite
        working-directory: fitila_flutter
        run: flutter test
