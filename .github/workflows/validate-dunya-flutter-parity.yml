name: Validate DUNYA Flutter parity
on:
  push:
    branches:
      - fix/dunya-flutter-online-web-parity-20261018
    paths:
      - 'fitila_flutter/**'
      - '.github/workflows/validate-dunya-flutter-parity.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-dunya-flutter-parity-${{ github.ref }}
  cancel-in-progress: true

jobs:
  flutter-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Java 21 for MapLibre Android compilation
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          channel: stable
          cache: true
      - name: Offline ByT5 certification gate tests
        run: python3 -m unittest discover -s scripts/dunya_translate -p 'test_certify_mobile_pack.py' -v
      - name: Dependencies
        working-directory: fitila_flutter
        run: flutter pub get
      - name: Static analysis
        working-directory: fitila_flutter
        run: flutter analyze
      - name: Verify Java toolchain
        run: java -version
      - name: Compile Android debug Kotlin with complete diagnostics
        working-directory: fitila_flutter
        shell: bash
        run: |
          set -o pipefail
          mkdir -p build/ci-diagnostics
          echo "=== JDK ==="
          java -version
          echo "=== Memory ==="
          free -h
          echo "=== Disk ==="
          df -h .
          flutter build apk --debug --verbose 2>&1 | tee build/ci-diagnostics/android-debug-build.log
      - name: Upload Android build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dunya-android-build-diagnostics
          path: fitila_flutter/build/ci-diagnostics/android-debug-build.log
          retention-days: 7
          if-no-files-found: warn
      - name: DUNYA routing regression tests
        working-directory: fitila_flutter
        run: |
          flutter test test/dunya_online_routing_test.dart
          flutter test test/dunya_assistant_test.dart
      - name: Full Flutter test suite
        working-directory: fitila_flutter
        run: flutter test
