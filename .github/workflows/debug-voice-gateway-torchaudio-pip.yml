name: Debug voice-gateway torchaudio pip (temporaire)

# Workflow de diagnostic jetable : reproduit en dehors de Docker/buildx (dont
# la sortie détaillée n'atteint jamais l'API Checks, seulement un résumé
# "exit code: 1") les mêmes commandes pip que voice-gateway/Dockerfile, sur
# le runner GitHub-hébergé directement, où chaque étape `run:` native expose
# normalement sa sortie complète via ::notice::/::error::.
# À supprimer une fois le diagnostic terminé.

on:
  workflow_dispatch: {}

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: pip install -r requirements.txt
        run: |
          set +e
          pip install --no-cache-dir -r voice-gateway/requirements.txt > /tmp/install.log 2>&1
          echo "exit=$?" >> /tmp/install.log
          echo "::notice::install: $(tail -c 900 /tmp/install.log | tr '\n' '|')"
        continue-on-error: true

      - name: Versions résolues
        run: |
          set +e
          TORCH_VER="$(python -c "import torch; print(torch.__version__.split('+')[0])" 2>/tmp/torcherr.txt)"
          TORCHAUDIO_VER="$(python -c "import torchaudio; print(torchaudio.__version__.split('+')[0])" 2>/tmp/taerr.txt)"
          echo "::notice::torch=${TORCH_VER:-ÉCHEC} torchaudio=${TORCHAUDIO_VER:-ÉCHEC} | torch_err=$(tail -c 300 /tmp/torcherr.txt | tr '\n' ' ') | ta_err=$(tail -c 300 /tmp/taerr.txt | tr '\n' ' ')"
        continue-on-error: true

      - name: pip install --force-reinstall --no-deps torch+torchaudio CPU (partie 1)
        run: |
          set +e
          TORCH_VER="$(python -c "import torch; print(torch.__version__.split('+')[0])" 2>/dev/null)"
          TORCHAUDIO_VER="$(python -c "import torchaudio; print(torchaudio.__version__.split('+')[0])" 2>/dev/null)"
          echo "resolved torch=${TORCH_VER:-vide} torchaudio=${TORCHAUDIO_VER:-vide}" > /tmp/pipout.txt
          pip install --no-cache-dir --force-reinstall --no-deps "torch==${TORCH_VER}" ${TORCHAUDIO_VER:+"torchaudio==${TORCHAUDIO_VER}"} --index-url https://download.pytorch.org/whl/cpu >> /tmp/pipout.txt 2>&1
          echo "exit=$?" >> /tmp/pipout.txt
          echo "::notice::p1: $(cut -c1-900 /tmp/pipout.txt | tr '\n' '|')"
        continue-on-error: true

      - name: Sortie pip (partie 2)
        run: |
          echo "::notice::p2: $(cut -c901-1800 /tmp/pipout.txt 2>/dev/null | tr '\n' '|')"
        continue-on-error: true

      - name: Sortie pip (partie 3, fin)
        run: |
          LEN=$(wc -c < /tmp/pipout.txt 2>/dev/null || echo 0)
          echo "::notice::p3 (len=${LEN}): $(tail -c 900 /tmp/pipout.txt 2>/dev/null | tr '\n' '|')"
        continue-on-error: true

      - name: Vérification import finale
        run: |
          python -c "import torch; print('torch:', torch.__version__, torch.cuda.is_available())" 2>&1 | tail -c 400
          python -c "import torchaudio; print('torchaudio:', torchaudio.__version__)" 2>&1 | tail -c 400
        continue-on-error: true
