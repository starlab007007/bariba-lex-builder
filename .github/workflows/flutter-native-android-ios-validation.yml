name: FITILA Native Android iOS Validation

on:
  push:
    branches:
      - claude/audit-routes-consolidation-2c51cu
      - feat/apprendre-v2.4-build19-20260927
    paths:
      - 'fitila_flutter/**'
      - '.github/workflows/flutter-native-android-ios-validation.yml'
  pull_request:
    branches:
      - feat/apprendre-v2.4-build19-20260927
    paths:
      - 'fitila_flutter/**'
      - '.github/workflows/flutter-native-android-ios-validation.yml'
  workflow_dispatch:

concurrency:
  group: fitila-native-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  android-native:
    name: Android / Kotlin / Java / Gradle
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: fitila_flutter
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          channel: stable
          cache: true

      - name: Toolchain
        run: |
          flutter --version
          java -version
          ./android/gradlew --version

      - name: Resolve dependencies
        run: flutter pub get

      - name: Flutter static analysis
        run: flutter analyze

      - name: Flutter tests
        run: flutter test --reporter compact

      - name: Compile Android native debug
        run: |
          cd android
          ./gradlew             :app:compileDebugKotlin             :app:compileDebugJavaWithJavac             :app:assembleDebug             --stacktrace

      - name: Verify APK
        run: |
          test -s build/app/outputs/flutter-apk/app-debug.apk || test -s build/app/outputs/apk/debug/app-debug.apk

  ios-native:
    name: iOS / Swift / Xcode / Keyboard Extension
    runs-on: macos-15
    timeout-minutes: 50
    defaults:
      run:
        working-directory: fitila_flutter
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          channel: stable
          cache: true

      - name: Toolchain
        run: |
          flutter --version
          xcodebuild -version
          swift --version

      - name: Resolve dependencies
        run: |
          flutter pub get
          cd ios
          pod install

      - name: Validate Xcode project
        run: |
          xcodebuild -list -project ios/Runner.xcodeproj
          plutil -lint ios/Runner/Info.plist
          plutil -lint ios/Runner/Runner.entitlements
          plutil -lint ios/BaribaKeyboard/Info.plist
          plutil -lint ios/BaribaKeyboard/BaribaKeyboard.entitlements

      - name: Compile iOS app and keyboard extension
        run: |
          flutter build ios --simulator --debug
          xcodebuild             -project ios/Runner.xcodeproj             -scheme Runner             -configuration Debug             -sdk iphonesimulator             -destination 'generic/platform=iOS Simulator'             CODE_SIGNING_ALLOWED=NO             build

      - name: Verify keyboard extension
        run: |
          test -d build/ios/iphonesimulator/Runner.app
          test -d build/ios/iphonesimulator/Runner.app/PlugIns/BaribaKeyboard.appex
