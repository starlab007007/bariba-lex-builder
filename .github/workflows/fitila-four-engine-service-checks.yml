name: FITILA four voice engines adapter checks
on:
  pull_request:
    paths:
      - 'experiments/bariba_voice_compare/**'
      - '.github/workflows/fitila-four-engine-service-checks.yml'
  push:
    branches:
      - feat/bariba-four-engine-service-20261014
    paths:
      - 'experiments/bariba_voice_compare/**'
      - '.github/workflows/fitila-four-engine-service-checks.yml'
permissions:
  contents: read
jobs:
  adapter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Python compile and metrics tests
        run: |
          python -m compileall -q experiments/bariba_voice_compare
          python -m unittest discover -s experiments/bariba_voice_compare -p 'test_*.py'
      - name: Validate container config
        run: |
          docker compose -f experiments/bariba_voice_compare/docker-compose.yml config --quiet
        env:
          FITILA_MODEL_API_TOKEN: ci-test-value
          FITILA_SUPABASE_PUBLISHABLE_KEY: ci-test-key
