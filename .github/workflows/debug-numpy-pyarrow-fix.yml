name: Debug numpy/pyarrow fix verification (temporaire)

on:
  workflow_dispatch: {}

jobs:
  verify:
    runs-on: ubuntu-latest
    container:
      image: python:3.11-slim
    steps:
      - name: apt deps
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ffmpeg libsndfile1 build-essential cmake
      - name: pip upgrade
        run: pip install --no-cache-dir --upgrade pip setuptools wheel
      - uses: actions/checkout@v4
      - name: install + swap CPU + vérif (tout dans une seule étape)
        run: |
          set +e
          pip install --no-cache-dir -r voice-gateway/requirements.txt > /tmp/out.txt 2>&1
          RC1=$?
          echo "::notice::rc1=${RC1} lignes=$(wc -l < /tmp/out.txt) octets=$(wc -c < /tmp/out.txt)"
          tail -n 25 /tmp/out.txt > /tmp/tail1.txt
          echo "::notice::tail1a: $(cut -c1-900 /tmp/tail1.txt | tr '\n' '|')"
          echo "::notice::tail1b: $(tail -c 900 /tmp/tail1.txt | tr '\n' '|')"

          if [ "$RC1" -ne 0 ]; then
            echo "::error::pip install a échoué (rc=${RC1}), arrêt."
            exit 1
          fi

          TORCH_VER="$(pip show torch 2>/dev/null | grep -i '^Version:' | awk '{print $2}' | cut -d'+' -f1)"
          echo "::notice::torch_ver=${TORCH_VER}"
          pip install --no-cache-dir --force-reinstall --no-deps \
            "torch==${TORCH_VER}" "torchaudio==${TORCH_VER}" \
            --index-url https://download.pytorch.org/whl/cpu > /tmp/out2.txt 2>&1
          RC2=$?
          echo "::notice::rc2=${RC2} $(tail -c 900 /tmp/out2.txt | tr '\n' '|')"

          FAIRSEQ2N_VER="$(pip show fairseq2n 2>/dev/null | grep -i '^Version:' | awk '{print $2}' | cut -d'+' -f1)"
          echo "::notice::fairseq2n_ver=${FAIRSEQ2N_VER}"
          pip install --no-cache-dir --force-reinstall --no-deps \
            "fairseq2n==${FAIRSEQ2N_VER}" "fairseq2==${FAIRSEQ2N_VER}" \
            --index-url "https://fair.pkg.atmeta.com/fairseq2/whl/pt${TORCH_VER}/cpu" > /tmp/out3.txt 2>&1
          RC3=$?
          echo "::notice::rc3=${RC3} $(tail -c 900 /tmp/out3.txt | tr '\n' '|')"

          echo "::notice::versions: $(pip show numpy pyarrow torch torchaudio fairseq2n 2>&1 | grep -E '^(Name|Version)' | tr '\n' ' ')"

          python -c "from omnilingual_asr.models.inference.pipeline import ASRInferencePipeline; print('omnilingual_asr import OK')" > /tmp/out4.txt 2>&1
          RC4=$?
          echo "::notice::rc4=${RC4} $(cut -c1-900 /tmp/out4.txt | tr '\n' '|')"
          exit $RC4
