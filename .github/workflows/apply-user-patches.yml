name: Apply FITILA User Patches

on:
  push:
    branches:
      - release/fitila-flutter-android-v1.8.1-build12-web-parity
    paths:
      - .github/workflows/apply-user-patches.yml

permissions:
  contents: write

jobs:
  apply-validate-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout release branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct and verify user patches
        shell: bash
        run: |
          set -euo pipefail
          cat .patches/p4_* | tr -d '\n\r' | base64 -d | gunzip > /tmp/patch4.diff
          cat .patches/pia_* | tr -d '\n\r' | base64 -d | gunzip > /tmp/patchIA.diff
          echo "b25f139dfbf9b5bc611abcf280ddbab7d2a17a24e71a77547a54aec6e6b2788d  /tmp/patch4.diff" | sha256sum -c -
          echo "ca5224436fa6a83930c9a927e36b08d254955d784767a1d1d04cfbd327f5a03f  /tmp/patchIA.diff" | sha256sum -c -
          git status --short

      - name: Apply finalisation patch 4 of 4 with three-way merge
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "OpenAI"
          git config user.email "noreply@openai.com"
          git apply --3way /tmp/patch4.diff
          if git ls-files -u | grep -q .; then
            echo "Patch 4/4 produced merge conflicts:"
            git status --short
            exit 1
          fi
          git add -A
          git commit -m "feat(flutter): apply finalisation patch 4/4"

      - name: Apply six creation AI features patch
        shell: bash
        run: |
          set -euo pipefail
          git apply --3way /tmp/patchIA.diff
          if git ls-files -u | grep -q .; then
            echo "IA patch produced merge conflicts:"
            git status --short
            exit 1
          fi
          git add -A
          git commit -m "feat(fil): apply 6 creation IA features"

      - name: Apply Flutter 3.47 compatibility fixes
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re

          backend = Path('fitila_flutter/lib/core/fitila_backend.dart')
          b = backend.read_text(encoding='utf-8')
          b = b.replace('Future.wait([', 'Future.wait<dynamic>([')
          needle = "      if (direction != null) 'current_direction': direction,"
          if needle in b and '// ignore: use_null_aware_elements' not in b[b.find(needle)-80:b.find(needle)]:
              b = b.replace(needle, '      // ignore: use_null_aware_elements\n' + needle, 1)
          backend.write_text(b, encoding='utf-8')

          main = Path('fitila_flutter/lib/main.dart')
          s = main.read_text(encoding='utf-8')
          s = s.replace("import 'package:record/record.dart';\n", '')
          s = s.replace("import 'package:shared_preferences/shared_preferences.dart';\n", '')
          s = s.replace('(_, __) =>', '(_, _) =>')
          s = re.sub(r'\.withOpacity\(([^()\n]+)\)', r'.withValues(alpha: \1)', s)
          s = re.sub(
              r'(DropdownButtonFormField(?:<[^>]+>)?\([\s\S]{0,500}?)\bvalue:',
              r'\1initialValue:',
              s,
          )
          if not s.startswith('// ignore_for_file: unused_element'):
              s = '// ignore_for_file: unused_element\n\n' + s
          main.write_text(s, encoding='utf-8')
          PY
          git add fitila_flutter/lib/core/fitila_backend.dart fitila_flutter/lib/main.dart
          git commit -m "fix(flutter): align new patches with Flutter 3.47 analyzer"

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          channel: stable
          cache: true

      - name: Verify release metadata and prepare server configuration
        shell: bash
        run: |
          set -euo pipefail
          cd fitila_flutter
          flutter --version
          grep -q '^version: 1.8.1+12$' pubspec.yaml
          grep -q 'android.permission.INTERNET' android/app/src/main/AndroidManifest.xml
          python - <<'PY'
          from pathlib import Path
          import json
          env_path = Path('../.env')
          if not env_path.exists():
              raise SystemExit('FITILA server configuration file ../.env is missing')
          env = {}
          for raw in env_path.read_text(encoding='utf-8').splitlines():
              line = raw.strip()
              if not line or line.startswith('#') or '=' not in line:
                  continue
              key, value = line.split('=', 1)
              env[key.strip()] = value.strip().strip('"').strip("'")
          url = env.get('SUPABASE_URL') or env.get('VITE_SUPABASE_URL') or ''
          key = env.get('SUPABASE_ANON_KEY') or env.get('SUPABASE_PUBLISHABLE_KEY') or env.get('VITE_SUPABASE_PUBLISHABLE_KEY') or ''
          if not url or not key:
              raise SystemExit('FITILA server URL or publishable key is missing')
          Path('.ci-dart-defines.json').write_text(
              json.dumps({'SUPABASE_URL': url, 'SUPABASE_ANON_KEY': key}),
              encoding='utf-8',
          )
          PY

      - name: Resolve dependencies
        run: cd fitila_flutter && flutter pub get

      - name: Static analysis
        run: cd fitila_flutter && flutter analyze

      - name: Full Flutter tests
        run: cd fitila_flutter && flutter test --dart-define-from-file=.ci-dart-defines.json --reporter compact

      - name: Build optimized release APK
        shell: bash
        run: |
          set -euo pipefail
          cd fitila_flutter
          flutter build apk --release \
            --dart-define-from-file=.ci-dart-defines.json \
            --obfuscate \
            --split-debug-info=build/symbols
          test -s build/app/outputs/flutter-apk/app-release.apk
          unzip -t build/app/outputs/flutter-apk/app-release.apk
          mkdir -p build/release-output
          cp build/app/outputs/flutter-apk/app-release.apk build/release-output/FITILA-Android-v1.8.1-build12-web-parity-patched-release.apk
          cp -R build/symbols build/release-output/symbols
          cd build/release-output
          sha256sum FITILA-Android-v1.8.1-build12-web-parity-patched-release.apk | tee SHA256SUMS.txt

      - name: Remove temporary patch staging
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .patches
          git add -A
          git commit -m "chore(ci): remove temporary patch staging"

      - name: Push validated patch commits
        shell: bash
        run: |
          set -euo pipefail
          git push origin HEAD:${GITHUB_REF_NAME}

      - name: Upload validated APK
        uses: actions/upload-artifact@v4
        with:
          name: FITILA-Android-v1.8.1-build12-patched-release
          path: fitila_flutter/build/release-output/
          if-no-files-found: error
          retention-days: 14
