name: Debug voice-gateway health (temporaire, 6)

# Workflow de diagnostic jetable : voir debug-voice-gateway-health4.yml /
# health5.yml (supprimés) pour le contexte.
# À supprimer une fois le diagnostic terminé.

on:
  workflow_dispatch: {}

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - name: Setup clé SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id
          chmod 600 ~/.ssh/id
          ssh-keyscan -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: docker ps -a (état du conteneur)
        run: |
          OUT="$(ssh -i ~/.ssh/id -o StrictHostKeyChecking=no "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" "docker ps -a --filter name=bariba-voice-gateway --format '{{.Names}} | {{.Status}} | {{.Image}}'" 2>&1)"
          echo "::notice::ps: ${OUT}"

      - name: docker inspect (code de sortie / health)
        run: |
          OUT="$(ssh -i ~/.ssh/id -o StrictHostKeyChecking=no "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" "docker inspect bariba-voice-gateway --format 'ExitCode={{.State.ExitCode}} OOMKilled={{.State.OOMKilled}} Health={{.State.Health.Status}} Error={{.State.Error}}'" 2>&1)"
          echo "::notice::inspect: ${OUT}"

      - name: date de création de l'IMAGE (pas du conteneur) — confirme si c'est bien le nouveau build
        run: |
          OUT="$(ssh -i ~/.ssh/id -o StrictHostKeyChecking=no "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" "docker inspect ghcr.io/starlab007007/bariba-lex-builder-voice-gateway:latest --format 'ImageId={{.Id}} Created={{.Created}}'" 2>&1)"
          echo "::notice::image: ${OUT}"

      - name: pip show torch DANS le conteneur en cours d'exécution
        run: |
          OUT="$(ssh -i ~/.ssh/id -o StrictHostKeyChecking=no "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" "docker exec bariba-voice-gateway pip show torch" 2>&1 | tr '\n' '|' | cut -c1-900)"
          echo "::notice::pip_torch: ${OUT}"

      - name: pip show fairseq2n DANS le conteneur en cours d'exécution
        run: |
          OUT="$(ssh -i ~/.ssh/id -o StrictHostKeyChecking=no "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" "docker exec bariba-voice-gateway pip show fairseq2n" 2>&1 | tr '\n' '|' | cut -c1-900)"
          echo "::notice::pip_fairseq2n: ${OUT}"

      - name: pip show fairseq2 DANS le conteneur en cours d'exécution
        run: |
          OUT="$(ssh -i ~/.ssh/id -o StrictHostKeyChecking=no "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" "docker exec bariba-voice-gateway pip show fairseq2" 2>&1 | tr '\n' '|' | cut -c1-900)"
          echo "::notice::pip_fairseq2: ${OUT}"
