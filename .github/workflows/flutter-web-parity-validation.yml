name: FITILA Flutter Web Parity Validation

on:
  push:
    branches:
      - feature/fitila-web-parity-20260914
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-web-parity:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fitila_flutter

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Static analysis
        run: flutter analyze

      - name: Flutter tests
        run: flutter test --reporter compact

      - name: Compile Android debug APK
        run: flutter build apk --debug
