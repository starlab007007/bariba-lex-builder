name: Deploy FITILA voice & translation functions

on:
  push:
    branches: [main, fix/prod-quality]
    paths:
      - .github/workflows/deploy-voice-translate-functions.yml
      - supabase/functions/byt5-bariba-translate/**
      - supabase/functions/bariba-tts/**
      - supabase/functions/tts-audio/**
      - supabase/functions/fitila-ia-chat/**
      - supabase/functions/_shared/translation-verifier.ts
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_ID: dvswhjawiooprghzeyol
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Type-check and test before deploying
        run: |
          for f in byt5-bariba-translate bariba-tts tts-audio fitila-ia-chat; do
            deno check supabase/functions/$f/index.ts
          done
          deno test --no-check --allow-read --allow-env --allow-net supabase/functions/_shared/translation-verifier_test.ts
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Deploy
        run: |
          test -n "$SUPABASE_ACCESS_TOKEN" || { echo "SUPABASE_ACCESS_TOKEN manquant"; exit 1; }
          for f in tts-audio bariba-tts byt5-bariba-translate fitila-ia-chat; do
            supabase functions deploy "$f" --project-ref "$SUPABASE_PROJECT_ID"
          done
