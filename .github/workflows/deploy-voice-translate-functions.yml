name: Deploy FITILA voice & translation functions

# Deploy only after blocking checks and a project-scoped credential preflight.
on:
  push:
    branches: [main]
    paths: ['supabase/functions/**', '.github/workflows/deploy-voice-translate-functions.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_ID: dvswhjawiooprghzeyol
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Type-check and test before deploying
        run: |
          set -euo pipefail
          mkdir -p /tmp/rep
          exec > >(tee /tmp/rep/typecheck.txt) 2>&1
          for f in byt5-bariba-translate bariba-stt bariba-tts tts-audio fitila-ia-chat meta-voice-gateway dunya-voice-turn transcribe-audio ai-translate fitila-tem-ia-chat; do
            deno check supabase/functions/$f/index.ts
          done
          deno test --no-check --allow-read --allow-env --allow-net supabase/functions/_shared/translation-verifier_test.ts
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Verify Supabase deployment credential
        run: |
          set -euo pipefail
          test -n "$SUPABASE_ACCESS_TOKEN" || { echo "::error::SUPABASE_ACCESS_TOKEN is missing from GitHub production secrets."; exit 1; }
          code=$(curl -sS --max-time 15 -o /tmp/supabase-auth-check.json -w '%{http_code}' \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_ID/functions")
          if [ "$code" != 200 ]; then
            echo "::error::Supabase deployment credential rejected (HTTP $code). Replace the production SUPABASE_ACCESS_TOKEN secret with a valid token scoped to FITILA and Edge Functions write access. No functions were deployed."
            exit 1
          fi
      - name: Deploy
        run: |
          set -o pipefail
          mkdir -p /tmp/rep
          { test -n "$SUPABASE_ACCESS_TOKEN" && echo "token: present" || echo "token: MISSING"; } | tee /tmp/rep/deploy.txt
          supabase --version | tee -a /tmp/rep/deploy.txt
          rc=0
          for f in tts-audio bariba-stt bariba-tts byt5-bariba-translate fitila-ia-chat meta-voice-gateway dunya-voice-turn transcribe-audio ai-translate fitila-tem-ia-chat; do
            echo "== $f" | tee -a /tmp/rep/deploy.txt
            supabase functions deploy "$f" --project-ref "$SUPABASE_PROJECT_ID" --use-api 2>&1 | tee -a /tmp/rep/deploy.txt || rc=1
          done
          exit $rc
      - name: Publish deployment diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fitila-edge-deployment-${{ github.sha }}
          path: /tmp/rep/
          if-no-files-found: ignore
          retention-days: 14
