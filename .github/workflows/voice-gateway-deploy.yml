name: Déployer la passerelle vocale bariba (production)

# Construit l'image voice-gateway/, la publie sur GHCR, puis la déploie sur
# le VPS fitila.bj avec health-check réel et rollback automatique — pour que
# le TTS/STT bariba ne dépende plus des Spaces Hugging Face gratuits.
# Voir voice-gateway/README.md pour le contexte complet.

on:
  push:
    branches: [main]
    paths:
      - 'voice-gateway/**'
      - 'brain-gateway/**'
      - 'docker-composer.yml'
      - 'scripts/verify-fitila-services.py'
      - '.github/workflows/voice-gateway-deploy.yml'
  workflow_dispatch: {}

concurrency:
  group: voice-gateway-deploy
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Connexion GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Référence de l'image
        id: meta
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}-voice-gateway" >> "$GITHUB_OUTPUT"
      - name: Build et push (tag latest + SHA)
        uses: docker/build-push-action@v6
        with:
          context: voice-gateway
          cache-from: type=gha
          cache-to: type=gha,mode=max
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}:latest
            ${{ steps.meta.outputs.image }}:${{ github.sha }}

  build-brain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Test brain HTTP isolation and request bounds
        run: |
          pip install -r brain-gateway/requirements.txt
          python -m unittest discover -s brain-gateway -p 'test_*.py' -v
      - uses: docker/build-push-action@v6
        with:
          context: brain-gateway
          push: true
          tags: |
            ghcr.io/starlab007007/bariba-lex-builder-brain-gateway:latest
            ghcr.io/starlab007007/bariba-lex-builder-brain-gateway:${{ github.sha }}

  deploy:
    needs: [build-and-push, build-brain]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Synchroniser docker-composer.yml sur le VPS
        # Ne pas supposer que deploy.yml (déclenché séparément) l'a déjà fait :
        # ce workflow doit rester correct même s'il tourne seul (dispatch
        # manuel, ou avant que deploy.yml n'ait fini sa propre copie).
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "docker-composer.yml,scripts/verify-fitila-services.py"
          target: "/home/debian/bariba-lex-builder"
          overwrite: true
      - name: Déploiement + health-check + rollback automatique sur le VPS
        # v0.1.10, pas v1.x : c'est la version déjà prouvée par deploy.yml,
        # mirror-dunya-brain.yml et publish-dunya-packs.yml dans ce même
        # repo. v1.0.3 échouait silencieusement en ~2s sans jamais exécuter
        # le script. Mais même avec v0.1.10, l'utilisation de `env:`/`envs:`
        # pour transmettre IMAGE/GHCR_READ_TOKEN/FITILA_MODEL_API_TOKEN a
        # reproduit exactement le même échec silencieux en 2s (alors que
        # deploy.yml, qui fonctionne, n'utilise ni `env:` ni `envs:` sur son
        # étape ssh-action) : le vrai problème était ce mécanisme de
        # transmission d'env, pas la version de l'action. Les valeurs sont
        # donc désormais interpolées directement dans `script` via `${{ }}`,
        # exactement comme le fait deploy.yml.
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          command_timeout: 30m
          script: |
            set -uo pipefail
            # ::error:: devient une annotation lisible via l'API GitHub même
            # quand les logs bruts du run ne sont pas téléchargeables depuis
            # mon environnement — ce trap est donc le seul moyen fiable dont
            # je dispose de diagnostiquer un échec ici sans deviner.
            trap 'echo "::error::deploy script a échoué : commande [$BASH_COMMAND], code $?"' ERR
            set -e

            IMAGE="${{ needs.build-and-push.outputs.image }}"
            GHCR_READ_TOKEN="${{ secrets.GHCR_READ_TOKEN }}"
            FITILA_MODEL_API_TOKEN="${{ secrets.FITILA_MODEL_API_TOKEN }}"

            echo "::notice::1/6 cd"
            cd /home/debian/bariba-lex-builder

            echo "::notice::2/6 ghcr login (si token fourni)"
            if [ -n "${GHCR_READ_TOKEN:-}" ]; then
              echo "$GHCR_READ_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
            fi

            # docker-composer.yml exige FITILA_MODEL_API_TOKEN (interpolation
            # Compose, ${VAR:?}) ; ce n'était jusqu'ici jamais défini ici de
            # façon automatique (uniquement via `export` manuel documenté dans
            # experiments/bariba_voice_compare/OPERATIONS.md), ce qui faisait
            # échouer `docker compose up` en quelques secondes. Le secret
            # GitHub FITILA_MODEL_API_TOKEN devient la source de vérité ; ce
            # fichier .env (chargé automatiquement par Compose, même dossier)
            # est réécrit à chaque déploiement pour rester synchronisé —
            # la même valeur doit aussi être le secret Supabase du même nom.
            echo "::notice::3/6 écriture .env"
            : "${FITILA_MODEL_API_TOKEN:?Secret GitHub FITILA_MODEL_API_TOKEN manquant}"
            printf 'FITILA_MODEL_API_TOKEN=%s\n' "$FITILA_MODEL_API_TOKEN" > .env
            chmod 600 .env

            previous_id="$(docker inspect bariba-voice-gateway --format '{{.Image}}' 2>/dev/null || true)"
            previous_brain_id="$(docker inspect fitila-dunya-brain --format '{{.Image}}' 2>/dev/null || true)"
            rollback_services() {
              if [ -n "$previous_id" ]; then
                docker tag "$previous_id" "$IMAGE:latest"
                docker compose -f docker-composer.yml up -d --no-build bariba-voice-gateway
              fi
              if [ -n "$previous_brain_id" ]; then
                docker tag "$previous_brain_id" ghcr.io/starlab007007/bariba-lex-builder-brain-gateway:latest
                docker compose -f docker-composer.yml up -d --no-build dunya-brain
              else
                docker stop fitila-dunya-brain 2>/dev/null || true
              fi
            }

            # Same signed model artifact as Flutter; never replace a good model
            # with an incomplete download. No third-party inference is used.
            brain_dir=/home/debian/bariba-lex-builder/dunya-packs/brain
            brain_file=gemma-4-E2B-it.litertlm
            brain_sha=181938105e0eefd105961417e8da75903eacda102c4fce9ce90f50b97139a63c
            mkdir -p "$brain_dir"
            if ! (cd "$brain_dir" && echo "$brain_sha  $brain_file" | sha256sum -c --status); then
              curl -fL --retry 3 -C - -o "$brain_dir/$brain_file.part" "https://huggingface.co/litert-community/gemma-4-E2B-it-litert-lm/resolve/main/$brain_file"
              (cd "$brain_dir" && echo "$brain_sha  $brain_file.part" | sha256sum -c)
              mv "$brain_dir/$brain_file.part" "$brain_dir/$brain_file"
              chmod 644 "$brain_dir/$brain_file"
            fi
            free -m
            docker pull ghcr.io/starlab007007/bariba-lex-builder-brain-gateway:latest
            docker compose -f docker-composer.yml up -d --no-build dunya-brain

            # experiments/bariba_voice_compare/ (service.py expérimental,
            # restart: unless-stopped) écoute aussi 127.0.0.1:8090 et peut être
            # relancé manuellement pour des comparaisons (voir son OPERATIONS.md) ;
            # s'il tourne, `docker compose up` échoue avec "port is already
            # allocated" avant même d'atteindre le health-check. Le service de
            # production réel est désormais bariba-voice-gateway (voir le même
            # OPERATIONS.md) : on libère donc toujours le port en sa faveur.
            echo "::notice::3b/6 libérer le port 8090 (service expérimental meta-voice, si relancé manuellement)"
            docker stop fitila-meta-voice-api 2>/dev/null || true

            echo "::notice::4/6 docker pull $IMAGE:latest"
            docker pull "$IMAGE:latest"
            echo "::notice::5/6 docker compose up"
            docker compose -f docker-composer.yml up -d --no-build bariba-voice-gateway
            echo "::notice::6/6 attente health-check"

            echo "⏳ Attente du démarrage (chargement des modèles, jusqu'à 3 min)..."
            ok=""
            for i in $(seq 1 36); do
              if curl -fsS --max-time 5 http://127.0.0.1:8090/health 2>/dev/null | grep -q '"status":"ok"'; then
                ok="1"; break
              fi
              sleep 5
            done

            if [ -z "$ok" ]; then
              echo "::error::bariba-voice-gateway pas sain après 3 min : $(docker logs --tail 30 bariba-voice-gateway 2>&1 | tr '\n' ' ' | cut -c1-900)"
              if [ -n "$previous_id" ]; then
                docker tag "$previous_id" "$IMAGE:latest" 2>/dev/null || true
                docker compose -f docker-composer.yml up -d --no-build bariba-voice-gateway || true
              fi
              exit 1
            fi

            echo "✅ bariba-voice-gateway sain (modèles chargés)."
            export FITILA_MODEL_API_TOKEN
            # Inference, not just model loading: catches the list[str] ASR
            # regression and verifies the new self-hosted conversational model.
            if ! python3 scripts/verify-fitila-services.py; then
              echo "::error::Real inference failed; restoring previous services"
              rollback_services
              exit 1
            fi
            docker image prune -f || true
