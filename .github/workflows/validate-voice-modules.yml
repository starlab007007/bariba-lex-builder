name: Validate Translator and IA voice
on:
  pull_request:
    paths: ['src/components/voice/**', 'src/hooks/useReplySpeech.ts', 'src/hooks/useSmartTranslator.ts', 'src/lib/voice/**', 'src/lib/dunya/**', 'src/pages/fitila/FitilaIA.tsx', 'src/pages/fitila/FitilaTemIA.tsx', 'src/pages/tamtam/TamTamTranslator.tsx', 'supabase/functions/dunya-voice-turn/**', 'supabase/functions/_shared/transcription-*.ts', 'supabase/functions/_shared/dunya-voice-core.ts', 'supabase/migrations/*fitila_asr*', 'tests/voice/**', 'e2e/voice-modules.spec.ts', 'e2e/fixtures/voice-modules.*', 'playwright.voice-modules.config.ts', 'vite.voice.config.ts', '.github/workflows/validate-voice-modules.yml']
  push:
    branches: [main]
    paths: ['src/components/voice/**', 'src/hooks/useReplySpeech.ts', 'src/hooks/useSmartTranslator.ts', 'src/lib/voice/**', 'src/pages/fitila/FitilaTemIA.tsx', 'src/pages/tamtam/TamTamTranslator.tsx', 'supabase/functions/dunya-voice-turn/**', 'supabase/functions/_shared/transcription-*.ts', 'supabase/functions/_shared/dunya-voice-core.ts', 'supabase/migrations/*fitila_asr*', 'tests/voice/**']
permissions:
  contents: read
jobs:
  voice:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: npm }
      - run: npm ci --legacy-peer-deps
      - run: npm run build
      - uses: denoland/setup-deno@v2
        with: { deno-version: v2.x }
      - run: deno check --node-modules-dir=none supabase/functions/dunya-voice-turn/index.ts supabase/functions/bariba-stt/index.ts supabase/functions/refine-bariba/index.ts
      - run: deno test --node-modules-dir=none --allow-env tests/voice/dunyaVoice.test.ts tests/voice/metaVoiceCore.test.ts tests/voice/replySpeech.test.ts tests/voice/transcriptionRepair.test.ts
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test --config=playwright.voice-modules.config.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: translator-ia-voice-results
          path: test-results
