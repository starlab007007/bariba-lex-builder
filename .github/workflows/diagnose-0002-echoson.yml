name: FITILA semantic merge validation 0002-0008

on:
  push:
    branches:
      - release/fitila-flutter-android-v1.8.1-build12-web-parity
    paths:
      - .github/workflows/diagnose-0002-echoson.yml

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Reconstruct and verify certified patch chain
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import base64,gzip,hashlib
          expected={
            '0002-design-premium-6-modules.patch':'7976eea171984ac5289905a485404990db0418e524ad03f5cbfbd17057a3d051',
            '0003-handunia-wasa-socle-technique.patch':'be30d8fd605993973aee182139b08b75e7fc0cc849035a8b8fe43d17cb04056a',
            '0004-handunia-wasa-dynamique-social.patch':'63336234fdc3b7bca061acc375f23df74287b5d50aa834659ea2b02bf6d5c55b',
            'handunia_wasa_dynamique_social_migration.sql':'6cc7575ee8fe02df081809f5f4cb2ca33f45dc61e941192d15457be4e5b47635',
            '0005-sagesse-battle-proverbe-a-trou-ia.patch':'9c38477c2396be6ad6b1bcf0fdfc2cc9f50082e13b0e82aa902ae8386bfd1b1a',
            '0006-aburu-fim-galerie-live-video.patch':'52ae14abe5b53a7d0d557f6bde720840d9e72b17fa43ce5bbc1be4964fa30ed3',
            '0007-sasara-ia-edition-ligne-par-ligne.patch':'cb0a531b10c25b090f0a26b8677d09224c16171cd3323bd6910804c5599dd701',
            '0008-fil-fitila-createur-contenu-plein-ecran-kuaishou.patch':'0de7dcf4672f1c9ac52f45ec5fcb7a7cf30303d32cc771c3eb352a8b9247993c',
            '20260916225824_sagesse_battle_votes_communaute.sql':'87995d36e227a19b488c99d7bd43c8d87224d5c565ce83ccfe0a0807da16a1ee',
          }
          out=Path('/tmp/fitila-patches'); out.mkdir(parents=True,exist_ok=True)
          def unpack(encoded,bundle_sha):
              packed=base64.b64decode(encoded,validate=True)
              got=hashlib.sha256(packed).hexdigest()
              assert got==bundle_sha,(got,bundle_sha)
              raw=gzip.decompress(packed); pos=0
              while pos<len(raw):
                  assert raw.startswith(b'###FILE ',pos)
                  eol=raw.find(b'\n',pos)
                  name,size_s=raw[pos+8:eol].decode().rsplit(' ',1)
                  size=int(size_s); start=eol+1; end=start+size; data=raw[start:end]
                  assert raw[end:end+8]==b'\n###END\n'
                  if name in expected:
                      sha=hashlib.sha256(data).hexdigest()
                      print(name,sha)
                      assert sha==expected[name],(name,sha,expected[name])
                      (out/name).write_bytes(data)
                  pos=end+8
          prefix=[]
          for i in (1,2,3,4):
              prefix.append(''.join(Path(f'.patches/step1_fix_{i:02d}.b64').read_text().split()))
          prefix.append(''.join(Path('.patches/step1_fix_05a.b64').read_text().split())+''.join(Path('.patches/step1_fix_05b.b64').read_text().split()))
          for i in (6,7,8):
              prefix.append(''.join(Path(f'.patches/step1_fix_{i:02d}.b64').read_text().split()))
          tail=[''.join(Path(f'.patches/step1_upload_{i:02d}.b64').read_text().split()) for i in range(3,7)]
          unpack(''.join(prefix)+''.join(tail),'b9edeff2d51255d2d509e0337baaa7113bf3e5a530a1914acfc287195eb2d3e9')
          second=''.join(''.join(Path(f'.patches/step2_upload_{i:02d}.b64').read_text().split()) for i in range(1,5))
          unpack(second,'183a0681e102509e3ad58077a88538e703ea797903f9678ad48214fbb2bd89c4')
          missing=set(expected)-{p.name for p in out.iterdir()}
          assert not missing,missing
          PY

      - name: Seed missing local EchoSon playback primitives
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('fitila_flutter/lib/main.dart')
          s=p.read_text(encoding='utf-8')
          if '_togglePlayback' not in s:
              field='  bool _publishing = false;\n'
              assert field in s
              s=s.replace(field,field+'  final _playback = audio.AudioPlayer();\n  bool _playingBack = false;\n',1)
              dispose='    _mediaController.dispose();\n    super.dispose();'
              assert dispose in s
              s=s.replace(dispose,'    _mediaController.dispose();\n    _playback.dispose();\n    super.dispose();',1)
              anchor='\n  Future<void> _translate() async {'
              assert anchor in s
              methods=(
                '  Future<void> _discardRecording() async {\n'
                '    await _playback.stop();\n'
                '    if (!mounted) return;\n'
                '    setState(() {\n'
                '      _audio = null;\n'
                '      _playingBack = false;\n'
                '    });\n'
                '  }\n\n'
                '  Future<void> _togglePlayback() async {\n'
                '    final clip = _audio;\n'
                '    if (clip == null) return;\n'
                '    if (_playingBack) {\n'
                '      await _playback.stop();\n'
                '      if (mounted) setState(() => _playingBack = false);\n'
                '      return;\n'
                '    }\n'
                '    await _playback.play(audio.DeviceFileSource(clip.path));\n'
                '    if (!mounted) return;\n'
                '    setState(() => _playingBack = true);\n'
                '    _playback.onPlayerComplete.first.then((_) {\n'
                '      if (mounted) setState(() => _playingBack = false);\n'
                '    });\n'
                '  }\n'
              )
              s=s.replace(anchor,'\n'+methods+anchor,1)
              # Preserve playback state correctly after recording/publishing.
              rec='          _recording = false;\n          _audio = asset;'
              if rec in s:
                  s=s.replace(rec,'          _recording = false;\n          _audio = asset;\n          _playingBack = false;',1)
              reset="        _translated = '';\n        _audio = null;"
              if reset in s:
                  s=s.replace(reset,"        _translated = '';\n        _audio = null;\n        _playingBack = false;",1)
              p.write_text(s,encoding='utf-8')
          PY

      - name: Apply semantic context patch chain by scoped classes
        shell: bash
        run: |
          set -euo pipefail
          cp .github/scripts/apply_fitila_patch_chain.py /tmp/apply.py
          python - <<'PY'
          from pathlib import Path
          p=Path('/tmp/apply.py')
          s=p.read_text(encoding='utf-8')
          # Keep relocation state per semantic class/section instead of one
          # global line shift across a 20k+ line main.dart.
          old='''    current = target.read_text(encoding="utf-8").splitlines(keepends=True)
    line_shift = 0
    for idx, h in enumerate(fp.hunks, 1):
        old, new = hunk_sequences(h)
'''
          new='''    current = target.read_text(encoding="utf-8").splitlines(keepends=True)
    section_shift: dict[str, int] = {}
    for idx, h in enumerate(fp.hunks, 1):
        old, new = hunk_sequences(h)
        line_shift = section_shift.get(h.section, 0)
'''
          assert old in s
          s=s.replace(old,new,1)
          old2='''        line_shift += len(new) - old_span
        print(
'''
          new2='''        line_shift += len(new) - old_span
        section_shift[h.section] = line_shift
        print(
'''
          assert old2 in s
          s=s.replace(old2,new2,1)
          # Insert hunks also update their own section shift.
          old3='''            line_shift += len(new)
            print(f"{patch_name}: {target_rel} hunk {idx}/{len(fp.hunks)} inserted at {pos+1}")
'''
          new3='''            line_shift += len(new)
            section_shift[h.section] = line_shift
            print(f"{patch_name}: {target_rel} hunk {idx}/{len(fp.hunks)} inserted at {pos+1}")
'''
          assert old3 in s
          s=s.replace(old3,new3,1)
          p.write_text(s,encoding='utf-8')
          PY

          python /tmp/apply.py             /tmp/fitila-patches/0002-design-premium-6-modules.patch             /tmp/fitila-patches/0003-handunia-wasa-socle-technique.patch             /tmp/fitila-patches/0004-handunia-wasa-dynamique-social.patch             /tmp/fitila-patches/0005-sagesse-battle-proverbe-a-trou-ia.patch             /tmp/fitila-patches/0006-aburu-fim-galerie-live-video.patch             /tmp/fitila-patches/0007-sasara-ia-edition-ligne-par-ligne.patch             /tmp/fitila-patches/0008-fil-fitila-createur-contenu-plein-ecran-kuaishou.patch

          test -z "$(grep -R -l -E '^(<<<<<<<|=======|>>>>>>>)' fitila_flutter/lib || true)"
          cmp -s /tmp/fitila-patches/handunia_wasa_dynamique_social_migration.sql supabase/migrations/20260916222617_handunia_wasa_dynamique_social.sql
          cmp -s /tmp/fitila-patches/20260916225824_sagesse_battle_votes_communaute.sql supabase/migrations/20260916225824_sagesse_battle_votes_communaute.sql
          git diff --check

          for symbol in             '_FitilaDarkStage'             '_FitilaOrbMic'             'fetchHanduniaLieux'             'fetchHanduniaWorldFeed'             'toggleHanduniaFragmentLike'             '_scoreWithAi'             'toggleBattleResponseVote'             '_AburuGalleryCard'             'fetchCorpusCommunityCountThisMonth'             '_ImmersiveFeedDeckState'
          do
            grep -R -q "$symbol" fitila_flutter/lib || { echo "MISSING_SYMBOL=$symbol"; exit 1; }
          done
          echo "SEMANTIC_CHAIN_APPLIED=YES"

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          channel: stable
          cache: true

      - name: Resolve dependencies and analyze
        shell: bash
        run: |
          set -euo pipefail
          cd fitila_flutter
          flutter pub get
          flutter analyze
