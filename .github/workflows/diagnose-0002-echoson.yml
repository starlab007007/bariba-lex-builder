      - name: Apply semantic context patch chain by scoped classes
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          src=Path('/tmp/fitila-patches/0002-design-premium-6-modules.patch')
          lines=src.read_text(encoding='utf-8').splitlines(keepends=True)
          out=[]; hunk=0; skip=False
          for line in lines:
              if line.startswith('@@ '):
                  hunk += 1
                  skip = hunk in (4, 9)
              elif line.startswith('diff --git '):
                  skip = False
              if not skip:
                  out.append(line)
          assert hunk == 14, hunk
          Path('/tmp/fitila-patches/0002-semantic.patch').write_text(''.join(out),encoding='utf-8')
          for name in ('0003-handunia-wasa-socle-technique.patch','0004-handunia-wasa-dynamique-social.patch'):
              src=Path('/tmp/fitila-patches')/name
              text=src.read_text(encoding='utf-8')
              text=text.replace('@@ class HanduniaWasaScreen extends StatefulWidget {','@@ class _HanduniaWasaScreenState extends State<HanduniaWasaScreen> {')
              if name.startswith('0003-'):
                  text=text.replace(
                      '@@ -23612,26 +23612,169 @@ class _HanduniaWasaScreenState extends State<HanduniaWasaScreen> {\n }\n \n class _HanduniaWasaScreenState extends State<HanduniaWasaScreen> {\n',
                      '@@ -23614,24 +23614,167 @@ class _HanduniaWasaScreenState extends State<HanduniaWasaScreen> {\n class _HanduniaWasaScreenState extends State<HanduniaWasaScreen> {\n',
                      1,
                  )
              if name.startswith('0004-'):
                  text=text.replace(
                      '@@ -23612,16 +23612,23 @@ class _HanduniaWasaScreenState extends State<HanduniaWasaScreen> {\n }\n \n class _HanduniaWasaScreenState extends State<HanduniaWasaScreen> {\n',
                      '@@ -23614,14 +23614,21 @@ class _HanduniaWasaScreenState extends State<HanduniaWasaScreen> {\n class _HanduniaWasaScreenState extends State<HanduniaWasaScreen> {\n',
                      1,
                  )
              (src.parent/(name.replace('.patch','-semantic.patch'))).write_text(text,encoding='utf-8')
          src5=Path('/tmp/fitila-patches/0005-sagesse-battle-proverbe-a-trou-ia.patch')
          lines5=src5.read_text(encoding='utf-8').splitlines(keepends=True)
          out5=[]; in_main=False; main_hunk=0; skip=False
          for line in lines5:
              if line.startswith('diff --git '):
                  in_main=line.startswith('diff --git a/fitila_flutter/lib/main.dart ')
