              )
              echo=echo.replace(anchor,'\n'+methods+anchor,1)
              rec='          _recording = false;\n          _audio = asset;'
              if rec in echo:
                  echo=echo.replace(rec,'          _recording = false;\n          _audio = asset;\n          _playingBack = false;',1)
              reset="        _translated = '';\n        _audio = null;"
              if reset in echo:
                  echo=echo.replace(reset,"        _translated = '';\n        _audio = null;\n        _playingBack = false;",1)
              s=s[:echo_start]+echo+s[echo_end:]
              challenge_anchor = "      final results = await Future.wait([\n        FitilaBackend.fetchBattleChain(challengeId: challengeId),"
