              echo=echo.replace(field,field+'  final _playback = audio.AudioPlayer();\n  bool _playingBack = false;\n',1)
              dispose='    _mediaController.dispose();\n    super.dispose();'
              assert dispose in echo
              echo=echo.replace(dispose,'    _mediaController.dispose();\n    _playback.dispose();\n    super.dispose();',1)
              anchor='\n  Future<void> _translate() async {'
              assert anchor in echo
              methods=(
                '  Future<void> _discardRecording() async {\n'
                '    await _playback.stop();\n'
                '    if (!mounted) return;\n'
                '    setState(() {\n'
                '      _audio = null;\n'
                '      _playingBack = false;\n'
                "      // Sans audio ni texte déjà saisi, revenir à l'accueil plutôt que de\n"
