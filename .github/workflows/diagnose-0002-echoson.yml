name: FITILA recover historical prerequisite bundles

on:
  push:
    branches:
      - release/fitila-flutter-android-v1.8.1-build12-web-parity
    paths:
      - .github/workflows/diagnose-0002-echoson.yml

permissions:
  contents: read

jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Locate and verify historical p4 and pia fragments
        shell: bash
        run: |
          set -euo pipefail
          echo '=== historical prerequisite paths ==='
          git log --all --name-only --format= -- .patches \
            | sed '/^$/d' | sort -u \
            | grep -E '^\.patches/(p4_|pia_)' || true

          recover_family() {
            local family="$1"
            local out="$2"
            local expected="$3"
            local tmpdir="/tmp/recover-${family}"
            mkdir -p "$tmpdir"
            mapfile -t paths < <(git log --all --name-only --format= -- .patches | sed '/^$/d' | sort -u | grep -E "^\\.patches/${family}" || true)
            echo "family=$family paths=${#paths[@]}"
            if [ "${#paths[@]}" -eq 0 ]; then
              return 2
            fi
            for path in "${paths[@]}"; do
              last=$(git log --all -1 --format=%H -- "$path")
              echo "$path last-change=$last"
              src="$last:$path"
              if ! git cat-file -e "$src" 2>/dev/null; then
                src="$last^:$path"
              fi
              git cat-file -e "$src"
              git show "$src" > "$tmpdir/$(basename "$path")"
              echo "  source=$src bytes=$(wc -c < "$tmpdir/$(basename "$path")")"
            done
            cat "$tmpdir"/* | tr -d '\n\r' | base64 -d | gunzip > "$out"
            sha=$(sha256sum "$out" | awk '{print $1}')
            echo "$family reconstructed-sha=$sha bytes=$(wc -c < "$out")"
            test "$sha" = "$expected"
            grep -E '^(diff --git|index )' "$out" | head -120 || true
          }

          recover_family 'p4_' /tmp/patch4.diff b25f139dfbf9b5bc611abcf280ddbab7d2a17a24e71a77547a54aec6e6b2788d
          recover_family 'pia_' /tmp/patchIA.diff ca5224436fa6a83930c9a927e36b08d254955d784767a1d1d04cfbd327f5a03f
