              assert sage_proverb_old in s
              s=s.replace(sage_proverb_old,sage_proverb_new,1)
              # Premium Live Griot, en conservant les deux actions réelles actuelles.
              live_class=s.index('class _LiveGriotScreenState')
              live_button=s.index('_startingLive ? null : _startLiveNow', live_class)
              live_start=s.rfind('          Row(', live_class, live_button)
