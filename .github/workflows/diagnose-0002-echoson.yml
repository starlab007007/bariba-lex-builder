          from pathlib import Path

          def brace_one_line_ifs(text):
              out = []
              changed = 0
              for line in text.splitlines():
                  stripped = line.lstrip()
                  indent = line[:len(line) - len(stripped)]
                  if not stripped.startswith('if ('):
                      out.append(line)
                      continue
                  open_idx = stripped.find('(')
                  depth = 0
                  close_idx = -1
                  for idx in range(open_idx, len(stripped)):
                      ch = stripped[idx]
                      if ch == '(':
                          depth += 1
                      elif ch == ')':
                          depth -= 1
                          if depth == 0:
                              close_idx = idx
                              break
                  if close_idx < 0:
                      out.append(line)
                      continue
                  condition = stripped[open_idx + 1:close_idx]
                  statement = stripped[close_idx + 1:].strip()
                  if not statement or statement.startswith('{') or not statement.endswith(';'):
                      out.append(line)
                      continue
                  out.extend([
                      indent + 'if (' + condition + ') {',
                      indent + '  ' + statement,
                      indent + '}',
                  ])
                  changed += 1
              return '\n'.join(out) + '\n', changed

          for rel in (
              'fitila_flutter/lib/main.dart',
              'fitila_flutter/lib/core/fitila_backend.dart',
          ):
              p = Path(rel)
              updated, changed = brace_one_line_ifs(p.read_text(encoding='utf-8'))
              p.write_text(updated, encoding='utf-8')
              print(f'BRACED_SINGLE_LINE_IFS {rel}: {changed}')
          PY

