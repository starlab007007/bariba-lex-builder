name: FITILA recover EchoSon local baseline

on:
  push:
    branches:
      - release/fitila-flutter-android-v1.8.1-build12-web-parity
    paths:
      - .github/workflows/diagnose-0002-echoson.yml

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Search all Git history for EchoSon playback primitives
        shell: bash
        run: |
          set -euo pipefail
          file=fitila_flutter/lib/main.dart
          echo '=== COMMITS ADDING _togglePlayback ==='
          git log --all --format='%H %ad %s' --date=iso -S'_togglePlayback' -- "$file" || true
          echo '=== COMMITS ADDING _discardRecording ==='
          git log --all --format='%H %ad %s' --date=iso -S'_discardRecording' -- "$file" || true
          echo '=== COMMITS ADDING _playback ==='
          git log --all --format='%H %ad %s' --date=iso -S'_playback' -- "$file" || true
          echo '=== ALL REFS CONTAINING SYMBOLS ==='
          found=0
          for ref in $(git for-each-ref --format='%(refname)' refs/remotes/origin refs/tags); do
            if git grep -q '_togglePlayback' "$ref" -- "$file" 2>/dev/null; then
              found=1
              echo "--- $ref ---"
              git grep -n -E '_playback|_playingBack|_togglePlayback|_discardRecording' "$ref" -- "$file" || true
            fi
          done
          if [ "$found" -eq 0 ]; then echo 'NO_REF_WITH_PLAYBACK_SYMBOLS'; fi

          echo '=== RELEVANT COMMIT SNAPSHOTS ==='
          mapfile -t commits < <(
            {
              git log --all --format='%H' -S'_togglePlayback' -- "$file"
              git log --all --format='%H' -S'_discardRecording' -- "$file"
              git log --all --format='%H' -S'_playback' -- "$file"
            } | sort -u
          )
          for c in "${commits[@]}"; do
            echo "===== $c $(git show -s --format='%s' "$c") ====="
            git show "$c:$file" > /tmp/main.dart 2>/dev/null || continue
            python - "$c" <<'PY'
          import sys
          from pathlib import Path
          s=Path('/tmp/main.dart').read_text()
          lines=s.splitlines()
          for i,l in enumerate(lines):
              if 'class _EchoSonScreenState' in l:
                  start=i
                  end=min(len(lines),i+500)
                  for j in range(start,end):
                      if any(x in lines[j] for x in ('_playback','_playingBack','_togglePlayback','_discardRecording')):
                          a=max(start,j-12); b=min(end,j+45)
                          print(f'--- {a+1}:{b} ---')
                          for k in range(a,b):
                              print(f'{k+1}: {lines[k]}')
                  break
          PY
          done
