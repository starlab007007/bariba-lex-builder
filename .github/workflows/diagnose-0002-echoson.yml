name: FITILA diagnose 0002 base

on:
  push:
    branches:
      - release/fitila-flutter-android-v1.8.1-build12-web-parity
    paths:
      - .github/workflows/diagnose-0002-echoson.yml

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reconstruct 0002 and inspect 3-way base
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import base64,gzip,hashlib
          prefix=[]
          for i in (1,2,3,4): prefix.append(''.join(Path(f'.patches/step1_fix_{i:02d}.b64').read_text().split()))
          prefix.append(''.join(Path('.patches/step1_fix_05a.b64').read_text().split())+''.join(Path('.patches/step1_fix_05b.b64').read_text().split()))
          for i in (6,7,8): prefix.append(''.join(Path(f'.patches/step1_fix_{i:02d}.b64').read_text().split()))
          tail=[''.join(Path(f'.patches/step1_upload_{i:02d}.b64').read_text().split()) for i in range(3,7)]
          packed=base64.b64decode(''.join(prefix)+''.join(tail),validate=True)
          assert hashlib.sha256(packed).hexdigest()=='b9edeff2d51255d2d509e0337baaa7113bf3e5a530a1914acfc287195eb2d3e9'
          raw=gzip.decompress(packed); pos=0
          while pos<len(raw):
              eol=raw.find(b'\n',pos); name,size_s=raw[pos+8:eol].decode().rsplit(' ',1); size=int(size_s)
              start=eol+1; end=start+size; data=raw[start:end]
              if name=='0002-design-premium-6-modules.patch':
                  Path('/tmp/0002.patch').write_bytes(data)
                  print('sha256',hashlib.sha256(data).hexdigest())
              pos=end+8
          PY
          echo '=== PATCH HEADERS / INDEX ==='
          grep -E '^(diff --git|index |--- |\+\+\+ )' /tmp/0002.patch
          echo '=== MAIN.DART INDEX BASE OBJECT CHECK ==='
          OLD=$(awk '/^diff --git a\/fitila_flutter\/lib\/main.dart/{f=1;next} f && /^index /{split($2,a,"\\.\\."); print a[1]; exit}' /tmp/0002.patch)
          echo "old-prefix=$OLD"
          git rev-parse "$OLD^{blob}" || true
          FULL=$(git rev-parse "$OLD^{blob}" 2>/dev/null || true)
          if [ -n "$FULL" ]; then
            echo "base-blob=$FULL"
            git cat-file -s "$FULL"
            git show "$FULL" | grep -n -A120 -B20 'class _EchoSonScreenState' | head -180 || true
          else
            echo 'BASE_BLOB_NOT_IN_HISTORY'
          fi
          echo '=== GIT APPLY 3WAY CHECK ==='
          git apply --3way --check /tmp/0002.patch || true
          echo '=== CURRENT ECHOSON KEY SYMBOLS ==='
          grep -n -E 'class _EchoSonScreenState|_playback|_playingBack|_discardRecording|_togglePlayback' fitila_flutter/lib/main.dart | head -80 || true
