name: FITILA step 1 - three-way integration

on:
  push:
    branches:
      - release/fitila-flutter-android-v1.8.1-build12-web-parity
    paths:
      - .github/workflows/apply-step1-3way.yml

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct certified four-file bundle
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import base64, gzip, hashlib

          prefix_paths = [
            '.patches/step1_fix_01.b64',
            '.patches/step1_fix_02.b64',
            '.patches/step1_fix_03.b64',
            '.patches/step1_fix_04.b64',
            '.patches/step1_fix_05a.b64',
            '.patches/step1_fix_05b.b64',
            '.patches/step1_fix_06.b64',
            '.patches/step1_fix_07.b64',
            '.patches/step1_fix_08.b64',
          ]
          tail_paths = [
            '.patches/step1_upload_03.b64',
            '.patches/step1_upload_04.b64',
            '.patches/step1_upload_05.b64',
            '.patches/step1_upload_06.b64',
          ]
          encoded = ''.join(''.join(Path(p).read_text(encoding='utf-8').split()) for p in prefix_paths + tail_paths)
          packed = base64.b64decode(encoded, validate=True)
          bundle_sha = hashlib.sha256(packed).hexdigest()
          want_bundle = 'b9edeff2d51255d2d509e0337baaa7113bf3e5a530a1914acfc287195eb2d3e9'
          print('bundle sha256:', bundle_sha)
          if bundle_sha != want_bundle:
              raise SystemExit(f'Bundle SHA mismatch: {bundle_sha} != {want_bundle}')
          raw = gzip.decompress(packed)
          expected = {
            '0002-design-premium-6-modules.patch': '7976eea171984ac5289905a485404990db0418e524ad03f5cbfbd17057a3d051',
            '0003-handunia-wasa-socle-technique.patch': 'be30d8fd605993973aee182139b08b75e7fc0cc849035a8b8fe43d17cb04056a',
            'handunia_wasa_dynamique_social_migration.sql': '6cc7575ee8fe02df081809f5f4cb2ca33f45dc61e941192d15457be4e5b47635',
            '0004-handunia-wasa-dynamique-social.patch': '63336234fdc3b7bca061acc375f23df74287b5d50aa834659ea2b02bf6d5c55b',
          }
          out = Path('/tmp/fitila-step1')
          out.mkdir(parents=True, exist_ok=True)
          pos = 0
          found = set()
          while pos < len(raw):
              if not raw.startswith(b'###FILE ', pos):
                  raise SystemExit(f'Invalid marker at byte {pos}')
              eol = raw.index(b'\n', pos)
              name, size_s = raw[pos+8:eol].decode().rsplit(' ', 1)
              size = int(size_s)
              start = eol + 1
              end = start + size
              if raw[end:end+8] != b'\n###END\n':
                  raise SystemExit(f'Invalid framing for {name}')
              data = raw[start:end]
              if name in expected:
                  got = hashlib.sha256(data).hexdigest()
                  print(name, got)
                  if got != expected[name]:
                      raise SystemExit(f'SHA mismatch for {name}')
                  (out / name).write_bytes(data)
                  found.add(name)
              pos = end + 8
          if found != set(expected):
              raise SystemExit(f'Missing files: {set(expected)-found}')
          PY

      - name: Apply 0002 with three-way merge
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "OpenAI"
          git config user.email "noreply@openai.com"
          patch=/tmp/fitila-step1/0002-design-premium-6-modules.patch
          if ! git apply --3way --whitespace=nowarn "$patch"; then
            echo '===== THREE-WAY STATUS ====='
            git status --short
            echo '===== CONFLICT MARKERS ====='
            grep -n -C 12 '^<<<<<<<\|^=======\|^>>>>>>>' fitila_flutter/lib/main.dart || true
            exit 1
          fi
          git diff --check

      - name: Apply 0003 and 0004 on merged result
        shell: bash
        run: |
          set -euo pipefail
          for name in 0003-handunia-wasa-socle-technique.patch 0004-handunia-wasa-dynamique-social.patch; do
            patch="/tmp/fitila-step1/$name"
            if ! git apply --check "$patch"; then
              echo "===== CHECK FAILED: $name ====="
              git apply --reject --whitespace=nowarn "$patch" || true
              find . -name '*.rej' -type f -print -exec sh -c 'echo ----- $1; cat "$1"' _ {} \;
              exit 1
            fi
            git apply --whitespace=nowarn "$patch"
          done
          git diff --check

      - name: Verify standalone SQL identity
        shell: bash
        run: |
          set -euo pipefail
          standalone=/tmp/fitila-step1/handunia_wasa_dynamique_social_migration.sql
          migration=supabase/migrations/20260916222617_handunia_wasa_dynamique_social.sql
          cmp -s "$standalone" "$migration"
          echo '6cc7575ee8fe02df081809f5f4cb2ca33f45dc61e941192d15457be4e5b47635  supabase/migrations/20260916222617_handunia_wasa_dynamique_social.sql' | sha256sum -c -
          test "$(find supabase/migrations -maxdepth 1 -type f -name '*handunia_wasa_dynamique_social*.sql' | wc -l)" -eq 1

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          channel: stable
          cache: true

      - name: Validate Flutter
        shell: bash
        run: |
          set -euo pipefail
          cd fitila_flutter
          flutter pub get
          flutter analyze

      - name: Commit and push validated step 1
        shell: bash
        run: |
          set -euo pipefail
          git add \
            fitila_flutter/lib/main.dart \
            fitila_flutter/lib/core/fitila_backend.dart \
            supabase/migrations/20260916221308_handunia_wasa_monde_vivant.sql \
            supabase/migrations/20260916222617_handunia_wasa_dynamique_social.sql
          git diff --cached --check
          git diff --cached --quiet && { echo 'No application changes staged'; exit 1; }
          git commit -m 'feat(fitila): integrate step1 premium design and Handunia social'
          git push origin HEAD:${GITHUB_REF_NAME}
