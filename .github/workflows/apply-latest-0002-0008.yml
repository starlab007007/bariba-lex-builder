# RUN STEP 1 — exact 4-file bundle with one-character staging repair
name: FITILA step 1 - apply 0002 0003 0004 and Handunia SQL

on:
  push:
    branches:
      - release/fitila-flutter-android-v1.8.1-build12-web-parity
    paths:
      - .github/workflows/apply-latest-0002-0008.yml

permissions:
  contents: write

jobs:
  apply-step1:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Extract and verify exact 4 uploaded files
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import base64, gzip, hashlib

          expected = {
            '0002-design-premium-6-modules.patch': '7976eea171984ac5289905a485404990db0418e524ad03f5cbfbd17057a3d051',
            '0003-handunia-wasa-socle-technique.patch': 'be30d8fd605993973aee182139b08b75e7fc0cc849035a8b8fe43d17cb04056a',
            'handunia_wasa_dynamique_social_migration.sql': '6cc7575ee8fe02df081809f5f4cb2ca33f45dc61e941192d15457be4e5b47635',
            '0004-handunia-wasa-dynamique-social.patch': '63336234fdc3b7bca061acc375f23df74287b5d50aa834659ea2b02bf6d5c55b',
          }

          parts = sorted(Path('.patches').glob('step1_exact_*.b64'))
          if len(parts) != 2:
              raise SystemExit(f'Expected 2 step1_exact parts, got {len(parts)}')
          chunks = [''.join(p.read_text(encoding='utf-8', errors='strict').split()) for p in parts]
          joined = ''.join(chunks)
          boundary = len(chunks[0])
          print('step1_exact cleaned lengths:', [len(x) for x in chunks], 'total=', len(joined))

          def validate_candidate(encoded: str):
              try:
                  packed = base64.b64decode(encoded, validate=True)
                  raw = gzip.decompress(packed)
              except Exception:
                  return None
              result = {}
              for name, want in expected.items():
                  marker = ('###FILE ' + name + ' ').encode()
                  pos = raw.find(marker)
                  if pos < 0:
                      return None
                  eol = raw.find(b'\n', pos)
                  if eol < 0:
                      return None
                  header = raw[pos + 8:eol].decode()
                  parsed_name, size_s = header.rsplit(' ', 1)
                  if parsed_name != name:
                      return None
                  size = int(size_s)
                  start = eol + 1
                  end = start + size
                  data = raw[start:end]
                  if len(data) != size or raw[end:end+8] != b'\n###END\n':
                      return None
                  got = hashlib.sha256(data).hexdigest()
                  if got != want:
                      return None
                  result[name] = data
              return result

          candidates = []
          if len(joined) % 4 == 1:
              # The staging is known to contain one extra base64 character.
              # It was split at the part boundary, so test a safe window around
              # that boundary plus the extreme ends. Exact SHA-256 checks below
              # make false acceptance impossible.
              positions = list(range(max(0, boundary - 32), min(len(joined), boundary + 33)))
              positions += list(range(0, min(16, len(joined))))
              positions += list(range(max(0, len(joined) - 16), len(joined)))
              seen = set()
              for pos in positions:
                  if pos in seen:
                      continue
                  seen.add(pos)
                  fixed = joined[:pos] + joined[pos+1:]
                  result = validate_candidate(fixed)
                  if result is not None:
                      candidates.append((pos, joined[pos], result))
          else:
              result = validate_candidate(joined)
              if result is not None:
                  candidates.append((-1, '', result))

          if len(candidates) != 1:
              raise SystemExit(f'Could not uniquely repair exact step1 staging; valid candidates={[(p,c) for p,c,_ in candidates]}')

          removed_pos, removed_char, files = candidates[0]
          print(f'Validated exact bundle; removed staging char at position {removed_pos}: {removed_char!r}')
          out = Path('/tmp/fitila-step1')
          out.mkdir(parents=True, exist_ok=True)
          for name, data in files.items():
              got = hashlib.sha256(data).hexdigest()
              print(f'{name}: {got}')
              (out / name).write_bytes(data)
          PY

      - name: Apply 0002 0003 0004 sequentially
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "OpenAI"
          git config user.email "noreply@openai.com"
          for name in \
            0002-design-premium-6-modules.patch \
            0003-handunia-wasa-socle-technique.patch \
            0004-handunia-wasa-dynamique-social.patch
          do
            patch="/tmp/fitila-step1/$name"
            echo "===== CHECK $name ====="
            git apply --check "$patch"
            echo "===== APPLY $name ====="
            git apply --whitespace=nowarn "$patch"
          done

      - name: Verify standalone SQL equals canonical migration exactly once
        shell: bash
        run: |
          set -euo pipefail
          standalone="/tmp/fitila-step1/handunia_wasa_dynamique_social_migration.sql"
          migration="supabase/migrations/20260916222617_handunia_wasa_dynamique_social.sql"
          test -s "$standalone"
          test -s "$migration"
          cmp -s "$standalone" "$migration"
          echo "6cc7575ee8fe02df081809f5f4cb2ca33f45dc61e941192d15457be4e5b47635  $migration" | sha256sum -c -
          test "$(find supabase/migrations -maxdepth 1 -type f -name '*handunia_wasa_dynamique_social*.sql' | wc -l)" -eq 1

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: cd fitila_flutter && flutter pub get

      - name: Static analysis
        run: cd fitila_flutter && flutter analyze

      - name: Commit and push step 1 only after validation
        shell: bash
        run: |
          set -euo pipefail
          git add fitila_flutter/lib/main.dart \
                  fitila_flutter/lib/core/fitila_backend.dart \
                  supabase/migrations/20260916221308_handunia_wasa_monde_vivant.sql \
                  supabase/migrations/20260916222617_handunia_wasa_dynamique_social.sql
          git diff --cached --check
          git commit -m "feat(fitila): apply step1 design and Handunia social patches"
          git push origin HEAD:${GITHUB_REF_NAME}
