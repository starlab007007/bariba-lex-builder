# STEP 1 — apply only the four files received on 2026-09-17
name: FITILA step 1 - apply 0002 0003 0004 and Handunia SQL

on:
  push:
    branches:
      - release/fitila-flutter-android-v1.8.1-build12-web-parity
    paths:
      - .github/workflows/apply-latest-0002-0008.yml

permissions:
  contents: write

jobs:
  apply-step1:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Extract and verify exact uploaded patches
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import base64, hashlib, zlib

          expected = {
            '0002-design-premium-6-modules.patch': '7976eea171984ac5289905a485404990db0418e524ad03f5cbfbd17057a3d051',
            '0003-handunia-wasa-socle-technique.patch': 'be30d8fd605993973aee182139b08b75e7fc0cc849035a8b8fe43d17cb04056a',
            '0004-handunia-wasa-dynamique-social.patch': '63336234fdc3b7bca061acc375f23df74287b5d50aa834659ea2b02bf6d5c55b',
          }

          parts = sorted(Path('.patches').glob('newseries_*.b64'))
          if not parts:
              raise SystemExit('Missing .patches/newseries_*.b64 staging files')
          text = ''.join(p.read_text(encoding='utf-8', errors='ignore') for p in parts)
          alphabet = set('ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/=')
          clean = ''.join(ch for ch in text if ch in alphabet)
          packed = base64.b64decode(clean, validate=False)

          # Recover the gzip payload as a stream. The historical staging has a
          # damaged CRC/trailer, but the beginning of the stream is intact.
          # We still accept nothing unless each requested patch matches its
          # exact SHA-256 below.
          dec = zlib.decompressobj(16 + zlib.MAX_WBITS)
          recovered = bytearray()
          for i in range(0, len(packed), 256):
              try:
                  recovered.extend(dec.decompress(packed[i:i+256]))
              except zlib.error as exc:
                  print(f'WARNING: gzip trailer/CRC error after {len(recovered)} recovered bytes: {exc}')
                  break
          raw = bytes(recovered)

          pos = 0
          out = Path('/tmp/fitila-step1')
          out.mkdir(parents=True, exist_ok=True)
          found = set()
          while pos < len(raw) and found != set(expected):
              if not raw.startswith(b'###FILE ', pos):
                  raise SystemExit(f'Invalid bundle marker at byte {pos}')
              eol = raw.find(b'\n', pos)
              if eol < 0:
                  raise SystemExit('Truncated bundle header')
              header = raw[pos+8:eol].decode()
              name, size_s = header.rsplit(' ', 1)
              size = int(size_s)
              start = eol + 1
              end = start + size
              if end + 8 > len(raw):
                  raise SystemExit(f'Truncated {name} before requested files were fully recovered')
              data = raw[start:end]
              if raw[end:end+8] != b'\n###END\n':
                  raise SystemExit(f'Invalid end marker for {name}')
              if name in expected:
                  (out / name).write_bytes(data)
                  found.add(name)
              pos = end + 8

          for name, want in expected.items():
              p = out / name
              if not p.exists():
                  raise SystemExit(f'Missing {name} in recovered bundle')
              got = hashlib.sha256(p.read_bytes()).hexdigest()
              print(f'{name}: {got}')
              if got != want:
                  raise SystemExit(f'SHA mismatch for {name}: {got} != {want}')
          PY

      - name: Apply 0002 0003 0004 sequentially
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "OpenAI"
          git config user.email "noreply@openai.com"
          for name in \
            0002-design-premium-6-modules.patch \
            0003-handunia-wasa-socle-technique.patch \
            0004-handunia-wasa-dynamique-social.patch
          do
            patch="/tmp/fitila-step1/$name"
            echo "===== CHECK $name ====="
            git apply --check "$patch"
            echo "===== APPLY $name ====="
            git apply --whitespace=nowarn "$patch"
          done

      - name: Verify Handunia social migration exactly once
        shell: bash
        run: |
          set -euo pipefail
          migration="supabase/migrations/20260916222617_handunia_wasa_dynamique_social.sql"
          test -s "$migration"
          echo "6cc7575ee8fe02df081809f5f4cb2ca33f45dc61e941192d15457be4e5b47635  $migration" | sha256sum -c -
          test "$(find supabase/migrations -maxdepth 1 -type f -name '*handunia_wasa_dynamique_social*.sql' | wc -l)" -eq 1

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: cd fitila_flutter && flutter pub get

      - name: Static analysis
        run: cd fitila_flutter && flutter analyze

      - name: Commit and push step 1 only after validation
        shell: bash
        run: |
          set -euo pipefail
          git add fitila_flutter/lib/main.dart \
                  fitila_flutter/lib/core/fitila_backend.dart \
                  supabase/migrations/20260916221308_handunia_wasa_monde_vivant.sql \
                  supabase/migrations/20260916222617_handunia_wasa_dynamique_social.sql
          git diff --cached --check
          git commit -m "feat(fitila): apply step1 design and Handunia social patches"
          git push origin HEAD:${GITHUB_REF_NAME}
