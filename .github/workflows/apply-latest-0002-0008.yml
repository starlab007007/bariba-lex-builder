# STEP 1 — exact four files uploaded on 2026-09-17
name: FITILA step 1 - apply exact 4 files

on:
  push:
    branches:
      - release/fitila-flutter-android-v1.8.1-build12-web-parity
    paths:
      - .github/workflows/apply-latest-0002-0008.yml

permissions:
  contents: write

jobs:
  apply-step1:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Verify and extract exact uploaded bundle
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import base64, gzip, hashlib

          prefix_expected = {
            1: 'da1c97b0d6e4c4130de81516cad78d1fdb88979e355b36cddd5167d077df6f49',
            2: '7cf2bfbd1cce97ae8924ce27531bc8c775623c51fdd9536c730c9f2756a6b6c7',
            3: '6dfa19e216ccf2de200f075025eac9ccfe7bec1e6b85a28c0a51133d397b1443',
            4: '7103da843675c1f434e6e195948cd9d19c401fc9175fb81d012e2dfb85cfb756',
            6: '1220f8b3f56bf686d27e00dbe0109afbe4d77184b1f3633376d29d3f34a03119',
            7: 'ca2af2540f5472eb6aee577cd288c6253706b3dc0e0504e62a115a6a8bcff8de',
            8: '0f11c4fa49c380a41a58553c4741ee164e33ce597d327739cbe3e7376d1a09d2',
          }
          half5_expected = {
            'a': 'b94d9a44f1384e4cd97154ea6146ef0aea14fadd188ea177ea1f3f601063f9e9',
            'b': 'eafa55a2f6af6ed046016d7be6dabf6e8d4ca8498d4e293abdc1c4a15760951d',
          }
          tail_expected = {
            3: (8000, '737f977dcc86f930a14b2d3087b4193de678899b73139316107a3da040971af2'),
            4: (8000, 'b8a96b6925c18d2b8eb97036b41ccafde5da66c926051f1eecb4f8f5ce83ed7e'),
            5: (8000, 'b7cb5d03e99da11eaccf4002729fa3da43c29fd17f44c2d4c8e019ce51332f05'),
            6: (6760, 'fcec53d5b593eacd5714b1813c8bd0be6028e425cdb0fd21ddbe6b71c13b70c8'),
          }
          expected_files = {
            '0002-design-premium-6-modules.patch': '7976eea171984ac5289905a485404990db0418e524ad03f5cbfbd17057a3d051',
            '0003-handunia-wasa-socle-technique.patch': 'be30d8fd605993973aee182139b08b75e7fc0cc849035a8b8fe43d17cb04056a',
            'handunia_wasa_dynamique_social_migration.sql': '6cc7575ee8fe02df081809f5f4cb2ca33f45dc61e941192d15457be4e5b47635',
            '0004-handunia-wasa-dynamique-social.patch': '63336234fdc3b7bca061acc375f23df74287b5d50aa834659ea2b02bf6d5c55b',
          }

          prefix = []
          for i in (1,2,3,4):
              p = Path(f'.patches/step1_fix_{i:02d}.b64')
              text = ''.join(p.read_text(encoding='utf-8').split())
              got = hashlib.sha256(text.encode()).hexdigest()
              print(f'FIX {i:02d}: len={len(text)} sha256={got}')
              if len(text) != 2000 or got != prefix_expected[i]:
                  raise SystemExit(f'Bad replacement block {i}: len={len(text)} sha={got}')
              prefix.append(text)

          block5 = []
          for suffix in ('a','b'):
              p = Path(f'.patches/step1_fix_05{suffix}.b64')
              text = ''.join(p.read_text(encoding='utf-8').split())
              got = hashlib.sha256(text.encode()).hexdigest()
              print(f'FIX 05{suffix}: len={len(text)} sha256={got}')
              if len(text) != 1000 or got != half5_expected[suffix]:
                  raise SystemExit(f'Bad replacement block 05{suffix}: len={len(text)} sha={got}')
              block5.append(text)
          joined5 = ''.join(block5)
          if len(joined5) != 2000 or hashlib.sha256(joined5.encode()).hexdigest() != 'f58488a36f32ab405bfae4fdf5db3dc3acbd661bb42c64caa675f763eb08d6e8':
              raise SystemExit('Reconstructed replacement block 05 mismatch')
          prefix.append(joined5)

          for i in (6,7,8):
              p = Path(f'.patches/step1_fix_{i:02d}.b64')
              text = ''.join(p.read_text(encoding='utf-8').split())
              got = hashlib.sha256(text.encode()).hexdigest()
              print(f'FIX {i:02d}: len={len(text)} sha256={got}')
              if len(text) != 2000 or got != prefix_expected[i]:
                  raise SystemExit(f'Bad replacement block {i}: len={len(text)} sha={got}')
              prefix.append(text)

          prefix_text = ''.join(prefix)
          if len(prefix_text) != 16000:
              raise SystemExit(f'Prefix length mismatch: {len(prefix_text)}')
          p1 = prefix_text[:8000]
          p2 = prefix_text[8000:16000]
          if hashlib.sha256(p1.encode()).hexdigest() != '4fd14aa80528599cc03e3665385c0a95aac7351bb8cd301dcc1780079fb57e82':
              raise SystemExit('Reconstructed original part 01 mismatch')
          if hashlib.sha256(p2.encode()).hexdigest() != '068949c60633ac7213a85c3d3bc4b2350bfbcd7f8793b7120dc4eb62550f0684':
              raise SystemExit('Reconstructed original part 02 mismatch')

          tail = []
          for i in range(3, 7):
              p = Path(f'.patches/step1_upload_{i:02d}.b64')
              text = ''.join(p.read_text(encoding='utf-8').split())
              want_len, want_sha = tail_expected[i]
              got = hashlib.sha256(text.encode()).hexdigest()
              print(f'TAIL {i:02d}: len={len(text)} sha256={got}')
              if len(text) != want_len or got != want_sha:
                  raise SystemExit(f'Bad verified tail part {i}: len={len(text)} sha={got}')
              tail.append(text)

          encoded = prefix_text + ''.join(tail)
          packed = base64.b64decode(encoded, validate=True)
          bundle_sha = hashlib.sha256(packed).hexdigest()
          want_bundle = 'b9edeff2d51255d2d509e0337baaa7113bf3e5a530a1914acfc287195eb2d3e9'
          print('bundle sha256:', bundle_sha)
          if bundle_sha != want_bundle:
              raise SystemExit(f'Bundle SHA mismatch: {bundle_sha} != {want_bundle}')
          raw = gzip.decompress(packed)

          out = Path('/tmp/fitila-step1')
          out.mkdir(parents=True, exist_ok=True)
          pos = 0
          found = {}
          while pos < len(raw):
              if not raw.startswith(b'###FILE ', pos):
                  raise SystemExit(f'Invalid bundle marker at byte {pos}')
              eol = raw.find(b'\n', pos)
              if eol < 0:
                  raise SystemExit('Truncated bundle header')
              header = raw[pos + 8:eol].decode('utf-8')
              name, size_s = header.rsplit(' ', 1)
              size = int(size_s)
              start = eol + 1
              end = start + size
              if end + 8 > len(raw) or raw[end:end+8] != b'\n###END\n':
                  raise SystemExit(f'Invalid payload framing for {name}')
              data = raw[start:end]
              if name in expected_files:
                  got = hashlib.sha256(data).hexdigest()
                  print(f'{name}: {got}')
                  if got != expected_files[name]:
                      raise SystemExit(f'SHA mismatch for {name}: {got} != {expected_files[name]}')
                  (out / name).write_bytes(data)
                  found[name] = got
              pos = end + 8
          if set(found) != set(expected_files):
              raise SystemExit(f'Missing expected files: {set(expected_files) - set(found)}')
          PY

      - name: Apply patches 0002 0003 0004 sequentially
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "OpenAI"
          git config user.email "noreply@openai.com"
          for name in \
            0002-design-premium-6-modules.patch \
            0003-handunia-wasa-socle-technique.patch \
            0004-handunia-wasa-dynamique-social.patch
          do
            patch="/tmp/fitila-step1/$name"
            echo "===== CHECK $name ====="
            git apply --check "$patch"
            echo "===== APPLY $name ====="
            git apply --whitespace=nowarn "$patch"
          done

      - name: Verify standalone SQL and canonical migration
        shell: bash
        run: |
          set -euo pipefail
          standalone="/tmp/fitila-step1/handunia_wasa_dynamique_social_migration.sql"
          migration="supabase/migrations/20260916222617_handunia_wasa_dynamique_social.sql"
          test -s "$standalone"
          test -s "$migration"
          cmp -s "$standalone" "$migration"
          echo "6cc7575ee8fe02df081809f5f4cb2ca33f45dc61e941192d15457be4e5b47635  $migration" | sha256sum -c -
          test "$(find supabase/migrations -maxdepth 1 -type f -name '*handunia_wasa_dynamique_social*.sql' | wc -l)" -eq 1

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: cd fitila_flutter && flutter pub get

      - name: Static analysis
        run: cd fitila_flutter && flutter analyze

      - name: Commit and push validated application changes
        shell: bash
        run: |
          set -euo pipefail
          git add \
            fitila_flutter/lib/main.dart \
            fitila_flutter/lib/core/fitila_backend.dart \
            supabase/migrations/20260916221308_handunia_wasa_monde_vivant.sql \
            supabase/migrations/20260916222617_handunia_wasa_dynamique_social.sql
          git diff --cached --check
          git diff --cached --quiet && { echo 'No application changes staged'; exit 1; }
          git commit -m "feat(fitila): apply step1 design and Handunia social patches"
          git push origin HEAD:${GITHUB_REF_NAME}
