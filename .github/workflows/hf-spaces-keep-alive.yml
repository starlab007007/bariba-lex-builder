# Keeps FITILA's Hugging Face Spaces (ByT5 translation, Baatɔnum voice, ASR) awake.
# The Supabase pg_cron job "hf-keep-alive" stopped running on 18/09/2026, so the
# voice Space was found asleep ("Service en veille") on 20/10/2026.
name: Keep FITILA Hugging Face Spaces awake

on:
  schedule:
    # Secours : pg_cron réveille les Spaces toutes les 10 min, mais ce job pg_cron
    # est tombé une fois (18/09/2026) sans que personne ne le remarque avant un
    # mois (Space vocal trouvé endormi le 20/10/2026) — 6h était bien trop
    # espacé pour servir de vrai filet de sécurité ; 15 min en fait un.
    - cron: '*/15 * * * *'
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/hf-spaces-keep-alive.yml

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping the Spaces through hf-keep-alive
        env:
          # Public anon key (already shipped in the web app); the function only pings.
          ANON: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImR2c3doamF3aW9vcHJnaHpleW9sIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk3NTgzMTcsImV4cCI6MjEwNTMzNDMxN30.HK488q3C1q5uMDgthIbiTlGw20WMfMlRvEOjnlxPEgc
        run: |
          curl -fsS --max-time 60 -X POST \
            -H "Authorization: Bearer $ANON" -H "apikey: $ANON" -H "Content-Type: application/json" \
            https://dvswhjawiooprghzeyol.supabase.co/functions/v1/hf-keep-alive -d '{}' | tee result.json
          echo
          # Fail the run (visible as a red check, not just a silent ping) when a Space
          # isn't actually awake — exactly the kind of outage that went unnoticed for a
          # month last time because nothing here ever reported failure.
          python3 - <<'PY'
          import json, sys
          d = json.load(open('result.json'))
          statuses = {k: v['status'] for k, v in d['spaces'].items()}
          print(statuses)
          down = {k: v for k, v in statuses.items() if v != 'awake'}
          if down:
              print(f"::error::Hugging Face Space(s) not awake: {down}")
              sys.exit(1)
          PY
