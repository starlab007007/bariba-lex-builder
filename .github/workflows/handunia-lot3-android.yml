name: Handunia Lot 3 AI Guide Android

on:
  push:
    branches:
      - feat/handunia-lot3-ai-guide
  pull_request:
    branches:
      - feat/handunia-lot2-unified-map
      - release/fitila-flutter-android-v1.8.1-build12-web-parity
    paths:
      - 'fitila_flutter/**'
      - '.github/workflows/handunia-lot3-android.yml'
  workflow_dispatch:

jobs:
  validate-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: fitila_flutter

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Flutter stable
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Resolve dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Lot 3 focused tests
        run: flutter test test/handunia_lot3_ai_guide_test.dart

      - name: Full Flutter tests
        run: flutter test

      - name: Build debug APK
        run: flutter build apk --debug

      - name: APK checksum
        run: |
          sha256sum build/app/outputs/flutter-apk/app-debug.apk | tee build/app/outputs/flutter-apk/app-debug.apk.sha256
          ls -lh build/app/outputs/flutter-apk/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FITILA-Handunia-Lot3-AI-Guide-debug
          path: |
            fitila_flutter/build/app/outputs/flutter-apk/app-debug.apk
            fitila_flutter/build/app/outputs/flutter-apk/app-debug.apk.sha256
          if-no-files-found: error
          retention-days: 14
