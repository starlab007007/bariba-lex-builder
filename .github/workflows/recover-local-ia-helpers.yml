name: FITILA recover local IA helpers
on:
  push:
    branches:
      - release/fitila-flutter-android-v1.8.1-build12-web-parity
    paths:
      - .github/workflows/recover-local-ia-helpers.yml
permissions:
  contents: read
jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Recover patchIA helpers
        shell: bash
        run: |
          set -euo pipefail
          ref=27d6b7d194e2ba21a34859e2c3030efdd1b0ec05
          {
            git show "$ref:.patches/pia_00"
            git show "$ref:.patches/pia_01"
          } | tr -d '\n\r ' | base64 -d | gzip -dc > /tmp/patchIA.diff
          sha256sum /tmp/patchIA.diff
          echo '=== PATCHIA LISTEN/COLLAPSIBLE ==='
          grep -n -B80 -A220 -E '_FitilaListenButton|_FitilaCollapsibleNote' /tmp/patchIA.diff || true
          {
            git show "$ref:.patches/p4_00"
            git show "$ref:.patches/p4_01"
            git show "$ref:.patches/p4_02"
            git show "$ref:.patches/p4_03"
          } | tr -d '\n\r ' | base64 -d | gzip -dc > /tmp/patch4.diff
          sha256sum /tmp/patch4.diff
          echo '=== PATCH4 LISTEN/COLLAPSIBLE ==='
          grep -n -B100 -A260 -E '_FitilaListenButton|_FitilaCollapsibleNote' /tmp/patch4.diff || true
