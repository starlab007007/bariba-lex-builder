name: Validate DUNYA public voice
on:
  pull_request:
    paths: ['src/components/dunya/**', 'src/lib/dunya/**', 'src/lib/audioToWav.ts', 'src/integrations/supabase/client.ts', 'supabase/functions/dunya-voice-turn/**', 'supabase/functions/_shared/dunya-voice-core.ts', 'tests/voice/**', '.github/workflows/validate-dunya-voice.yml']
  push:
    branches: [main]
    paths: ['src/components/dunya/**', 'src/lib/dunya/**', 'supabase/functions/dunya-voice-turn/**', 'tests/voice/**']
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: npm }
      - run: npm ci --legacy-peer-deps
      - run: npm run build
      - uses: denoland/setup-deno@v2
        with: { deno-version: v2.x }
      - run: deno check --node-modules-dir=none supabase/functions/dunya-voice-turn/index.ts
      - run: deno test --node-modules-dir=none --allow-env tests/voice/dunyaVoice.test.ts tests/voice/metaVoiceCore.test.ts
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test --config=playwright.dunya.config.ts
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: dunya-browser-failure
          path: test-results
