name: FITILA Flutter Android Release

on:
  push:
    branches:
      - release/fitila-flutter-android-v1.0.1
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    defaults:
      run:
        working-directory: fitila_flutter

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          channel: stable
          cache: true

      - name: Flutter environment
        run: flutter doctor -v

      - name: Resolve dependencies
        run: flutter pub get

      - name: Static analysis
        run: flutter analyze

      - name: Unit and widget tests
        run: flutter test --reporter compact

      - name: Build optimized installable APK
        run: flutter build apk --release --obfuscate --split-debug-info=build/symbols

      - name: Prepare named artifact
        run: |
          mkdir -p build/release-artifacts
          cp build/app/outputs/flutter-apk/app-release.apk build/release-artifacts/FITILA-Android-v1.0.1-build2-release.apk
          sha256sum build/release-artifacts/FITILA-Android-v1.0.1-build2-release.apk | tee build/release-artifacts/SHA256SUMS.txt

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: FITILA-Android-v1.0.1-build2
          path: |
            fitila_flutter/build/release-artifacts/FITILA-Android-v1.0.1-build2-release.apk
            fitila_flutter/build/release-artifacts/SHA256SUMS.txt
            fitila_flutter/build/symbols/
          if-no-files-found: error
          retention-days: 14
