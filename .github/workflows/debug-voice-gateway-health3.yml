name: DEBUG2 - vérifier si la nouvelle image a bien torch CPU

# Temporaire. Le déploiement du correctif torch CPU (#167) a quand même
# échoué le health-check (libcudart.so.13 toujours manquant d'après les
# logs du conteneur restauré par le rollback). Avant de conclure que le
# correctif n'a pas fonctionné, on teste directement l'image NEUVE
# (restée en <none>/dangling sur le VPS car le rollback a empêché
# `docker image prune`) pour voir si son torch est réellement la
# variante CPU. À supprimer une fois le diagnostic obtenu.

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
    steps:
      - name: Clé ssh
        env:
          SSH_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          install -m 600 /dev/null /tmp/vps_key
          printf '%s\n' "$SSH_KEY" > /tmp/vps_key

      - name: Images voice-gateway disponibles sur le VPS
        run: |
          ssh -i /tmp/vps_key -o StrictHostKeyChecking=no -o ConnectTimeout=10 "$VPS_USER@$VPS_HOST" \
            "docker images --format '{{.Repository}}:{{.Tag}} {{.ID}} {{.CreatedSince}}' | grep voice-gateway" \
            | while IFS= read -r l; do echo "::notice::IMG: $l"; done

      - name: Version torch dans l'image actuellement taguée :latest
        run: |
          ssh -i /tmp/vps_key -o StrictHostKeyChecking=no -o ConnectTimeout=10 "$VPS_USER@$VPS_HOST" \
            'docker run --rm --entrypoint python ghcr.io/starlab007007/bariba-lex-builder-voice-gateway:latest -c "import torch,sys; print(\"torch_version\",torch.__version__); print(\"cuda_available\",torch.cuda.is_available())" 2>&1' \
            | while IFS= read -r l; do echo "::notice::TORCHCHK: $l"; done

      - name: pip show torch (confirme l'index utilisé, CPU vs CUDA)
        run: |
          ssh -i /tmp/vps_key -o StrictHostKeyChecking=no -o ConnectTimeout=10 "$VPS_USER@$VPS_HOST" \
            'docker run --rm --entrypoint pip ghcr.io/starlab007007/bariba-lex-builder-voice-gateway:latest show torch 2>&1' \
            | while IFS= read -r l; do echo "::notice::PIPSHOW: $l"; done
