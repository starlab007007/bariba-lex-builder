name: FITILA Premium Android Release

on:
  push:
    branches:
      - feature/fitila-ui-html-premium-20260914
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-release:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fitila_flutter

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          channel: stable
          cache: true

      - name: Verify release metadata
        run: |
          flutter --version
          grep -q '^version: 1.8.1+10$' pubspec.yaml
          grep -q 'android.permission.INTERNET' android/app/src/main/AndroidManifest.xml

      - name: Resolve dependencies
        run: flutter pub get

      - name: Static analysis
        run: flutter analyze

      - name: Widget and UI tests
        run: flutter test --reporter compact

      - name: Build optimized release APK
        run: |
          flutter build apk --release \
            --obfuscate \
            --split-debug-info=build/symbols

      - name: Validate APK integrity
        run: |
          test -s build/app/outputs/flutter-apk/app-release.apk
          unzip -t build/app/outputs/flutter-apk/app-release.apk

      - name: Prepare release artifact
        run: |
          mkdir -p build/release-output
          cp build/app/outputs/flutter-apk/app-release.apk \
            build/release-output/FITILA-Android-v1.8.1-build10-premium-release.apk
          cp -R build/symbols build/release-output/symbols
          cd build/release-output
          sha256sum FITILA-Android-v1.8.1-build10-premium-release.apk | tee SHA256SUMS.txt
          ls -lh FITILA-Android-v1.8.1-build10-premium-release.apk

      - name: Upload optimized APK
        uses: actions/upload-artifact@v4
        with:
          name: FITILA-Android-v1.8.1-build10-premium-release
          path: fitila_flutter/build/release-output/
          if-no-files-found: error
          retention-days: 14
