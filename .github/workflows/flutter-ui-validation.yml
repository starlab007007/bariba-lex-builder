name: FITILA Flutter Premium UI Validation

on:
  push:
    branches:
      - feature/fitila-ui-html-premium-20260914
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-flutter-ui:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fitila_flutter
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          channel: stable
          cache: true

      - name: Flutter environment
        run: flutter --version

      - name: Resolve dependencies
        run: flutter pub get

      - name: Static analysis
        run: flutter analyze

      - name: Widget and UI tests
        run: flutter test --reporter compact test/widget_test.dart test/signature_ui_test.dart

      - name: Compile Android debug APK
        run: flutter build apk --debug
