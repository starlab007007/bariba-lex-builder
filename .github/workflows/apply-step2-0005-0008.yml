name: FITILA integrate complete local patch chain through 0008

on:
  push:
    branches:
      - release/fitila-flutter-android-v1.8.1-build12-web-parity
    paths:
      - .github/workflows/apply-step2-0005-0008.yml

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target branch with full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure integration identity
        run: |
          git config user.name OpenAI
          git config user.email noreply@openai.com

      - name: Recover and verify historical prerequisite patches
        shell: bash
        run: |
          set -euo pipefail
          base='d37c35760569e5f6f44b573686463b7a30edf804^'
          for p in p4_00 p4_01 p4_02 p4_03; do git show "$base:.patches/$p"; done \
            | tr -d '\n\r' | base64 -d | gunzip > /tmp/patch4.diff
          for p in pia_00 pia_01; do git show "$base:.patches/$p"; done \
            | tr -d '\n\r' | base64 -d | gunzip > /tmp/patchIA.diff
          echo 'b25f139dfbf9b5bc611abcf280ddbab7d2a17a24e71a77547a54aec6e6b2788d  /tmp/patch4.diff' | sha256sum -c -
          echo 'ca5224436fa6a83930c9a927e36b08d254955d784767a1d1d04cfbd327f5a03f  /tmp/patchIA.diff' | sha256sum -c -

      - name: Apply prerequisite finalisation patch 4 of 4
        shell: bash
        run: |
          set -euo pipefail
          if git apply --reverse --check /tmp/patch4.diff >/dev/null 2>&1; then
            echo 'patch4 already present'
          else
            git apply --3way /tmp/patch4.diff
            test -z "$(git ls-files -u)"
            git add -A
            git diff --cached --check
            git commit -m 'feat(flutter): restore local finalisation patch 4/4'
          fi

      - name: Apply prerequisite six creation AI features patch
        shell: bash
        run: |
          set -euo pipefail
          if git apply --reverse --check /tmp/patchIA.diff >/dev/null 2>&1; then
            echo 'creation IA prerequisite already present'
          else
            git apply --3way /tmp/patchIA.diff
            test -z "$(git ls-files -u)"
            git add -A
            git diff --cached --check
            git commit -m 'feat(fitila): restore six creation IA prerequisite features'
          fi

      - name: Restore Flutter 3.47 compatibility baseline
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re
          backend=Path('fitila_flutter/lib/core/fitila_backend.dart')
          b=backend.read_text(encoding='utf-8')
          b=b.replace('Future.wait([','Future.wait<dynamic>([')
          needle="      if (direction != null) 'current_direction': direction,"
          pos=b.find(needle)
          if pos >= 0 and '// ignore: use_null_aware_elements' not in b[max(0,pos-100):pos]:
              b=b.replace(needle,'      // ignore: use_null_aware_elements\n'+needle,1)
          backend.write_text(b,encoding='utf-8')
          main=Path('fitila_flutter/lib/main.dart')
          s=main.read_text(encoding='utf-8')
          s=s.replace("import 'package:record/record.dart';\n",'')
          s=s.replace("import 'package:shared_preferences/shared_preferences.dart';\n",'')
          s=s.replace('(_, __) =>','(_, _) =>')
          s=re.sub(r'\.withOpacity\(([^()\n]+)\)',r'.withValues(alpha: \1)',s)
          s=re.sub(r'(DropdownButtonFormField[^\n]*\(\s*\n\s*)value:',r'\1initialValue:',s)
          if not s.startswith('// ignore_for_file: unused_element'):
              s='// ignore_for_file: unused_element\n\n'+s
          main.write_text(s,encoding='utf-8')
          PY
          git add fitila_flutter/lib/main.dart fitila_flutter/lib/core/fitila_backend.dart
          git diff --cached --check
          if ! git diff --cached --quiet; then git commit -m 'fix(flutter): restore Flutter 3.47 compatibility baseline'; fi
          echo "main blob after baseline: $(git hash-object fitila_flutter/lib/main.dart)"
          grep -n -E 'class _EchoSonScreenState|_playback|_playingBack|_togglePlayback|_discardRecording' fitila_flutter/lib/main.dart | head -60

      - name: Reconstruct and verify exact patches 0002 through 0008
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import base64,gzip,hashlib
          expected={
            '0002-design-premium-6-modules.patch':'7976eea171984ac5289905a485404990db0418e524ad03f5cbfbd17057a3d051',
            '0003-handunia-wasa-socle-technique.patch':'be30d8fd605993973aee182139b08b75e7fc0cc849035a8b8fe43d17cb04056a',
            '0004-handunia-wasa-dynamique-social.patch':'63336234fdc3b7bca061acc375f23df74287b5d50aa834659ea2b02bf6d5c55b',
            '0005-sagesse-battle-proverbe-a-trou-ia.patch':'9c38477c2396be6ad6b1bcf0fdfc2cc9f50082e13b0e82aa902ae8386bfd1b1a',
            '0006-aburu-fim-galerie-live-video.patch':'52ae14abe5b53a7d0d557f6bde720840d9e72b17fa43ce5bbc1be4964fa30ed3',
            '0007-sasara-ia-edition-ligne-par-ligne.patch':'cb0a531b10c25b090f0a26b8677d09224c16171cd3323bd6910804c5599dd701',
            '0008-fil-fitila-createur-contenu-plein-ecran-kuaishou.patch':'0de7dcf4672f1c9ac52f45ec5fcb7a7cf30303d32cc771c3eb352a8b9247993c',
            '20260916225824_sagesse_battle_votes_communaute.sql':'87995d36e227a19b488c99d7bd43c8d87224d5c565ce83ccfe0a0807da16a1ee',
          }
          out=Path('/tmp/fitila-patches'); out.mkdir(parents=True,exist_ok=True)
          def unpack(encoded,bundle_sha):
              packed=base64.b64decode(encoded,validate=True)
              assert hashlib.sha256(packed).hexdigest()==bundle_sha
              raw=gzip.decompress(packed); pos=0
              while pos<len(raw):
                  assert raw.startswith(b'###FILE ',pos)
                  eol=raw.find(b'\n',pos); name,size_s=raw[pos+8:eol].decode().rsplit(' ',1)
                  size=int(size_s); start=eol+1; end=start+size; data=raw[start:end]
                  assert raw[end:end+8]==b'\n###END\n'
                  if name in expected:
                      sha=hashlib.sha256(data).hexdigest(); print(name,sha); assert sha==expected[name]
                      (out/name).write_bytes(data)
                  pos=end+8
          prefix=[]
          for i in (1,2,3,4): prefix.append(''.join(Path(f'.patches/step1_fix_{i:02d}.b64').read_text().split()))
          prefix.append(''.join(Path('.patches/step1_fix_05a.b64').read_text().split())+''.join(Path('.patches/step1_fix_05b.b64').read_text().split()))
          for i in (6,7,8): prefix.append(''.join(Path(f'.patches/step1_fix_{i:02d}.b64').read_text().split()))
          tail=[''.join(Path(f'.patches/step1_upload_{i:02d}.b64').read_text().split()) for i in range(3,7)]
          unpack(''.join(prefix)+''.join(tail),'b9edeff2d51255d2d509e0337baaa7113bf3e5a530a1914acfc287195eb2d3e9')
          current=''.join(''.join(Path(f'.patches/step2_upload_{i:02d}.b64').read_text().split()) for i in range(1,5))
          unpack(current,'183a0681e102509e3ad58077a88538e703ea797903f9678ad48214fbb2bd89c4')
          missing=[n for n in expected if not (out/n).exists()]
          assert not missing,missing
          PY

      - name: Apply exact patch sequence 0002 through 0008
        shell: bash
        run: |
          set -euo pipefail
          apply_patch() {
            local patch="$1"
            local label="$2"
            if git apply --reverse --check "$patch" >/dev/null 2>&1; then
              echo "$label already present; skipping"
              return
            fi
            if git apply --check "$patch" >/dev/null 2>&1; then
              git apply "$patch"
            else
              git apply --3way "$patch"
              test -z "$(git ls-files -u)"
            fi
            git add -A
            git diff --cached --check
            git commit -m "feat(fitila): apply $label"
          }
          apply_patch /tmp/fitila-patches/0002-design-premium-6-modules.patch 'patch 0002 design premium 6 modules'
          apply_patch /tmp/fitila-patches/0003-handunia-wasa-socle-technique.patch 'patch 0003 handunia wasa socle technique'
          apply_patch /tmp/fitila-patches/0004-handunia-wasa-dynamique-social.patch 'patch 0004 handunia wasa dynamique social'
          apply_patch /tmp/fitila-patches/0005-sagesse-battle-proverbe-a-trou-ia.patch 'patch 0005 sagesse battle IA'
          apply_patch /tmp/fitila-patches/0006-aburu-fim-galerie-live-video.patch 'patch 0006 aburu fim galerie live video'
          apply_patch /tmp/fitila-patches/0007-sasara-ia-edition-ligne-par-ligne.patch 'patch 0007 sasara IA edition ligne par ligne'
          apply_patch /tmp/fitila-patches/0008-fil-fitila-createur-contenu-plein-ecran-kuaishou.patch 'patch 0008 fil fitila createur plein ecran'

      - name: Verify merged application and migrations
        shell: bash
        run: |
          set -euo pipefail
          migration=supabase/migrations/20260916225824_sagesse_battle_votes_communaute.sql
          test -s "$migration"
          cmp -s /tmp/fitila-patches/20260916225824_sagesse_battle_votes_communaute.sql "$migration"
          echo '87995d36e227a19b488c99d7bd43c8d87224d5c565ce83ccfe0a0807da16a1ee  supabase/migrations/20260916225824_sagesse_battle_votes_communaute.sql' | sha256sum -c -
          test "$(find supabase/migrations -maxdepth 1 -type f -name '20260916225824_sagesse_battle_votes_communaute.sql' | wc -l)" -eq 1
          grep -q '_scoreWithAi' fitila_flutter/lib/main.dart
          grep -q 'toggleBattleResponseVote' fitila_flutter/lib/core/fitila_backend.dart
          grep -q 'class _AburuGalleryCard' fitila_flutter/lib/main.dart
          grep -q 'fetchCorpusCommunityCountThisMonth' fitila_flutter/lib/core/fitila_backend.dart
          git diff --check
          git status --short

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: cd fitila_flutter && flutter pub get

      - name: Static analysis
        run: cd fitila_flutter && flutter analyze

      - name: Flutter tests
        run: cd fitila_flutter && flutter test --reporter compact

      - name: Push validated integration
        shell: bash
        run: |
          set -euo pipefail
          git status --short
          git log --oneline -12
          git push origin HEAD:${GITHUB_REF_NAME}
