name: FITILA step 2 - integrate exact patches 0002 through 0008

on:
  push:
    branches:
      - release/fitila-flutter-android-v1.8.1-build12-web-parity
    paths:
      - .github/workflows/apply-step2-0005-0008.yml

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Reconstruct and verify all exact uploaded patches
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import base64, gzip, hashlib

          expected = {
            '0002-design-premium-6-modules.patch':'7976eea171984ac5289905a485404990db0418e524ad03f5cbfbd17057a3d051',
            '0003-handunia-wasa-socle-technique.patch':'be30d8fd605993973aee182139b08b75e7fc0cc849035a8b8fe43d17cb04056a',
            '0004-handunia-wasa-dynamique-social.patch':'63336234fdc3b7bca061acc375f23df74287b5d50aa834659ea2b02bf6d5c55b',
            '0005-sagesse-battle-proverbe-a-trou-ia.patch':'9c38477c2396be6ad6b1bcf0fdfc2cc9f50082e13b0e82aa902ae8386bfd1b1a',
            '0006-aburu-fim-galerie-live-video.patch':'52ae14abe5b53a7d0d557f6bde720840d9e72b17fa43ce5bbc1be4964fa30ed3',
            '0007-sasara-ia-edition-ligne-par-ligne.patch':'cb0a531b10c25b090f0a26b8677d09224c16171cd3323bd6910804c5599dd701',
            '0008-fil-fitila-createur-contenu-plein-ecran-kuaishou.patch':'0de7dcf4672f1c9ac52f45ec5fcb7a7cf30303d32cc771c3eb352a8b9247993c',
            '20260916225824_sagesse_battle_votes_communaute.sql':'87995d36e227a19b488c99d7bd43c8d87224d5c565ce83ccfe0a0807da16a1ee',
          }
          out=Path('/tmp/fitila-patches'); out.mkdir(parents=True,exist_ok=True)

          def unpack(encoded, bundle_sha):
              packed=base64.b64decode(encoded,validate=True)
              got=hashlib.sha256(packed).hexdigest()
              print('bundle',got)
              assert got==bundle_sha, (got,bundle_sha)
              raw=gzip.decompress(packed); pos=0
              while pos<len(raw):
                  assert raw.startswith(b'###FILE ',pos)
                  eol=raw.find(b'\n',pos)
                  name,size_s=raw[pos+8:eol].decode().rsplit(' ',1)
                  size=int(size_s); start=eol+1; end=start+size
                  assert raw[end:end+8]==b'\n###END\n'
                  data=raw[start:end]
                  if name in expected:
                      got=hashlib.sha256(data).hexdigest()
                      print(name,got)
                      assert got==expected[name], (name,got,expected[name])
                      (out/name).write_bytes(data)
                  pos=end+8

          prefix=[]
          for i in (1,2,3,4): prefix.append(''.join(Path(f'.patches/step1_fix_{i:02d}.b64').read_text().split()))
          prefix.append(''.join(Path('.patches/step1_fix_05a.b64').read_text().split()) + ''.join(Path('.patches/step1_fix_05b.b64').read_text().split()))
          for i in (6,7,8): prefix.append(''.join(Path(f'.patches/step1_fix_{i:02d}.b64').read_text().split()))
          tail=[''.join(Path(f'.patches/step1_upload_{i:02d}.b64').read_text().split()) for i in range(3,7)]
          unpack(''.join(prefix)+''.join(tail),'b9edeff2d51255d2d509e0337baaa7113bf3e5a530a1914acfc287195eb2d3e9')

          current=''.join(''.join(Path(f'.patches/step2_upload_{i:02d}.b64').read_text().split()) for i in range(1,5))
          unpack(current,'183a0681e102509e3ad58077a88538e703ea797903f9678ad48214fbb2bd89c4')

          missing=[n for n in expected if not (out/n).exists()]
          assert not missing, missing
          PY

      - name: Apply exact patch chain with semantic conflict resolution
        shell: bash
        run: |
          set -euo pipefail

          resolve_markers() {
            python - fitila_flutter/lib/main.dart fitila_flutter/lib/core/fitila_backend.dart <<'PY'
          from pathlib import Path
          import sys
          for arg in sys.argv[1:]:
              p=Path(arg)
              if not p.exists(): continue
              lines=p.read_text(encoding='utf-8').splitlines(keepends=True)
              if not any(x.startswith('<<<<<<<') for x in lines): continue
              out=[]; i=0; count=0
              while i<len(lines):
                  if not lines[i].startswith('<<<<<<<'):
                      out.append(lines[i]); i+=1; continue
                  count+=1; i+=1
                  while i<len(lines) and not lines[i].startswith('======='): i+=1
                  if i>=len(lines): raise SystemExit(f'Bad conflict separator in {p}')
                  i+=1
                  while i<len(lines) and not lines[i].startswith('>>>>>>>'):
                      out.append(lines[i]); i+=1
                  if i>=len(lines): raise SystemExit(f'Bad conflict end in {p}')
                  i+=1
              p.write_text(''.join(out),encoding='utf-8')
              print(f'resolved {count} overlap(s) in {p} with latest patch side')
          PY
          }

          repair_0002_rejects() {
            python - <<'PY'
          from pathlib import Path
          p=Path('fitila_flutter/lib/main.dart')
          text=p.read_text(encoding='utf-8')

          def scope_replace(text, start_marker, end_marker, old, new, label):
              s=text.find(start_marker)
              if s<0: raise SystemExit(f'{label}: scope start not found')
              e=text.find(end_marker,s) if end_marker else len(text)
              if e<0: e=len(text)
              seg=text[s:e]
              if new in seg:
                  print(label,'already present'); return text
              count=seg.count(old)
              if count!=1: raise SystemExit(f'{label}: expected one semantic anchor, got {count}')
              seg=seg.replace(old,new,1)
              print(label,'repaired from rejected hunk')
              return text[:s]+seg+text[e:]

          text=scope_replace(
              text,
              'class _EchoSonScreenState extends State<EchoSonScreen> {',
              '// ─────────────────────────────────────────────────────────────────\n// 2.',
              '    setState(() => _publishing = true);',
              '    setState(() {\n      _publishing = true;\n      _publishDoneCount = 1;\n      _step = 3;\n    });',
              'EchoSon publish state')

          old_chat="""                      ? Center(\n                          child: Text(\n                            _isHost ? 'Vous êtes en direct. Le chat apparaîtra ici.' : 'Connecté au direct. Le chat apparaîtra ici.',\n                            style: const TextStyle(color: Colors.white38, fontSize: 12.5),\n                            textAlign: TextAlign.center,\n                          ),\n                        )"""
          new_chat="""                      ? Center(\n                          child: Column(\n                            mainAxisSize: MainAxisSize.min,\n                            children: [\n                              _FitilaOrbMic(\n                                icon: _isHost ? (_muted ? Icons.mic_off_rounded : Icons.mic_rounded) : Icons.hearing_rounded,\n                                size: 74,\n                                active: !_muted,\n                              ),\n                              const SizedBox(height: 18),\n                              _FitilaWaveformBars(active: !_muted, height: 30, barCount: 16),\n                              const SizedBox(height: 18),\n                              Text(\n                                _isHost ? 'Vous êtes en direct. Le chat apparaîtra ici.' : 'Connecté au direct. Le chat apparaîtra ici.',\n                                style: const TextStyle(color: Colors.white38, fontSize: 12.5),\n                                textAlign: TextAlign.center,\n                              ),\n                            ],\n                          ),\n                        )"""
          text=scope_replace(
              text,
              'class _LiveRoomScreenState extends State<LiveRoomScreen> {',
              '// ─────────────────────────────────────────────────────────────────\n// 3. Sagesse Battle',
              old_chat,new_chat,'LiveRoom empty state')
          p.write_text(text,encoding='utf-8')
          rej=Path('fitila_flutter/lib/main.dart.rej')
          if rej.exists(): rej.unlink()
          PY
          }

          for name in \
            0002-design-premium-6-modules.patch \
            0003-handunia-wasa-socle-technique.patch \
            0004-handunia-wasa-dynamique-social.patch \
            0005-sagesse-battle-proverbe-a-trou-ia.patch \
            0006-aburu-fim-galerie-live-video.patch \
            0007-sasara-ia-edition-ligne-par-ligne.patch \
            0008-fil-fitila-createur-contenu-plein-ecran-kuaishou.patch
          do
            echo "===== APPLY $name ====="
            set +e
            patch -p1 --forward --batch --merge=diff3 --fuzz=3 < "/tmp/fitila-patches/$name"
            rc=$?
            set -e
            echo "patch rc=$rc"
            resolve_markers
            if [ "$name" = "0002-design-premium-6-modules.patch" ] && [ -f fitila_flutter/lib/main.dart.rej ]; then
              repair_0002_rejects
            fi
            rejects="$(find fitila_flutter supabase -type f -name '*.rej' -print 2>/dev/null || true)"
            if [ -n "$rejects" ]; then
              echo "Unmerged rejects after $name: $rejects"
              while IFS= read -r f; do [ -z "$f" ] || { echo "--- $f"; cat "$f"; }; done <<< "$rejects"
              exit 1
            fi
            if grep -R -n '^<<<<<<<\|^=======\|^>>>>>>>' fitila_flutter/lib/main.dart fitila_flutter/lib/core/fitila_backend.dart; then
              echo 'Conflict markers remain'; exit 1
            fi
            find fitila_flutter supabase -type f -name '*.orig' -delete 2>/dev/null || true
          done

          migration=supabase/migrations/20260916225824_sagesse_battle_votes_communaute.sql
          test -s "$migration"
          cmp -s /tmp/fitila-patches/20260916225824_sagesse_battle_votes_communaute.sql "$migration"
          echo '87995d36e227a19b488c99d7bd43c8d87224d5c565ce83ccfe0a0807da16a1ee  supabase/migrations/20260916225824_sagesse_battle_votes_communaute.sql' | sha256sum -c -
          test "$(find supabase/migrations -maxdepth 1 -type f -name '20260916225824_sagesse_battle_votes_communaute.sql' | wc -l)" -eq 1
          git diff --check
          git status --short

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          channel: stable
          cache: true

      - name: Resolve Flutter dependencies
        run: cd fitila_flutter && flutter pub get

      - name: Analyze merged Flutter application
        run: cd fitila_flutter && flutter analyze

      - name: Commit and push application integration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name OpenAI
          git config user.email noreply@openai.com
          git add \
            fitila_flutter/lib/main.dart \
            fitila_flutter/lib/core/fitila_backend.dart \
            supabase/migrations/20260916221308_handunia_wasa_monde_vivant.sql \
            supabase/migrations/20260916222617_handunia_wasa_dynamique_social.sql \
            supabase/migrations/20260916225824_sagesse_battle_votes_communaute.sql
          git diff --cached --check
          git diff --cached --quiet && { echo 'No application changes to commit'; exit 1; }
          git commit -m 'feat(fitila): integrate creation IA patch chain 0002-0008'
          git push origin HEAD:${GITHUB_REF_NAME}
