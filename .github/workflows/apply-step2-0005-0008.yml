name: FITILA step 2 - integrate exact patches 0002 through 0008

on:
  push:
    branches:
      - release/fitila-flutter-android-v1.8.1-build12-web-parity
    paths:
      - .github/workflows/apply-step2-0005-0008.yml

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target branch with history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct and verify exact patches 0002-0004
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import base64, gzip, hashlib

          prefix_expected = {
            1: 'da1c97b0d6e4c4130de81516cad78d1fdb88979e355b36cddd5167d077df6f49',
            2: '7cf2bfbd1cce97ae8924ce27531bc8c775623c51fdd9536c730c9f2756a6b6c7',
            3: '6dfa19e216ccf2de200f075025eac9ccfe7bec1e6b85a28c0a51133d397b1443',
            4: '7103da843675c1f434e6e195948cd9d19c401fc9175fb81d012e2dfb85cfb756',
            6: '1220f8b3f56bf686d27e00dbe0109afbe4d77184b1f3633376d29d3f34a03119',
            7: 'ca2af2540f5472eb6aee577cd288c6253706b3dc0e0504e62a115a6a8bcff8de',
            8: '0f11c4fa49c380a41a58553c4741ee164e33ce597d327739cbe3e7376d1a09d2',
          }
          half5_expected = {
            'a': 'b94d9a44f1384e4cd97154ea6146ef0aea14fadd188ea177ea1f3f601063f9e9',
            'b': 'eafa55a2f6af6ed046016d7be6dabf6e8d4ca8498d4e293abdc1c4a15760951d',
          }
          tail_expected = {
            3: (8000, '737f977dcc86f930a14b2d3087b4193de678899b73139316107a3da040971af2'),
            4: (8000, 'b8a96b6925c18d2b8eb97036b41ccafde5da66c926051f1eecb4f8f5ce83ed7e'),
            5: (8000, 'b7cb5d03e99da11eaccf4002729fa3da43c29fd17f44c2d4c8e019ce51332f05'),
            6: (6760, 'fcec53d5b593eacd5714b1813c8bd0be6028e425cdb0fd21ddbe6b71c13b70c8'),
          }
          expected = {
            '0002-design-premium-6-modules.patch': '7976eea171984ac5289905a485404990db0418e524ad03f5cbfbd17057a3d051',
            '0003-handunia-wasa-socle-technique.patch': 'be30d8fd605993973aee182139b08b75e7fc0cc849035a8b8fe43d17cb04056a',
            '0004-handunia-wasa-dynamique-social.patch': '63336234fdc3b7bca061acc375f23df74287b5d50aa834659ea2b02bf6d5c55b',
          }

          prefix = []
          for i in (1,2,3,4):
              text = ''.join(Path(f'.patches/step1_fix_{i:02d}.b64').read_text().split())
              assert len(text) == 2000 and hashlib.sha256(text.encode()).hexdigest() == prefix_expected[i]
              prefix.append(text)
          halves = []
          for suffix in ('a','b'):
              text = ''.join(Path(f'.patches/step1_fix_05{suffix}.b64').read_text().split())
              assert len(text) == 1000 and hashlib.sha256(text.encode()).hexdigest() == half5_expected[suffix]
              halves.append(text)
          prefix.append(''.join(halves))
          for i in (6,7,8):
              text = ''.join(Path(f'.patches/step1_fix_{i:02d}.b64').read_text().split())
              assert len(text) == 2000 and hashlib.sha256(text.encode()).hexdigest() == prefix_expected[i]
              prefix.append(text)
          prefix_text = ''.join(prefix)
          assert len(prefix_text) == 16000

          tail = []
          for i in range(3,7):
              text = ''.join(Path(f'.patches/step1_upload_{i:02d}.b64').read_text().split())
              want_len, want_sha = tail_expected[i]
              assert len(text) == want_len and hashlib.sha256(text.encode()).hexdigest() == want_sha
              tail.append(text)

          packed = base64.b64decode(prefix_text + ''.join(tail), validate=True)
          assert hashlib.sha256(packed).hexdigest() == 'b9edeff2d51255d2d509e0337baaa7113bf3e5a530a1914acfc287195eb2d3e9'
          raw = gzip.decompress(packed)
          out = Path('/tmp/fitila-patches')
          out.mkdir(parents=True, exist_ok=True)
          pos = 0
          found = set()
          while pos < len(raw):
              assert raw.startswith(b'###FILE ', pos)
              eol = raw.find(b'\n', pos)
              name, size_s = raw[pos+8:eol].decode().rsplit(' ', 1)
              size = int(size_s)
              start, end = eol+1, eol+1+size
              assert raw[end:end+8] == b'\n###END\n'
              data = raw[start:end]
              if name in expected:
                  got = hashlib.sha256(data).hexdigest()
                  print(name, got)
                  assert got == expected[name]
                  (out/name).write_bytes(data)
                  found.add(name)
              pos = end + 8
          assert found == set(expected)
          PY

      - name: Reconstruct and verify exact current uploads 0005-0008 and SQL
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import base64, gzip, hashlib

          part_expected = {
            1: (10000, 'b189b47906dde62fa9663ce272a5dba340cffebc2b5ab79d1fc759b2dbdb0dc2'),
            2: (10000, 'cac21a6f51b760f713a1e51ff11c96f5a6012c8d81dabdde27f25d570ff06400'),
            3: (10000, '47cb39009b8af7c50c10f2b334c11fa2081187f0fd04790d44648f37b3ef54c8'),
            4: (8936,  '31623db2ad232fea1d0c6334be9ff6c7adee9f4c96c5ac01a8b5d12a043f33c6'),
          }
          expected = {
            '0005-sagesse-battle-proverbe-a-trou-ia.patch': '9c38477c2396be6ad6b1bcf0fdfc2cc9f50082e13b0e82aa902ae8386bfd1b1a',
            '0006-aburu-fim-galerie-live-video.patch': '52ae14abe5b53a7d0d557f6bde720840d9e72b17fa43ce5bbc1be4964fa30ed3',
            '0007-sasara-ia-edition-ligne-par-ligne.patch': 'cb0a531b10c25b090f0a26b8677d09224c16171cd3323bd6910804c5599dd701',
            '0008-fil-fitila-createur-contenu-plein-ecran-kuaishou.patch': '0de7dcf4672f1c9ac52f45ec5fcb7a7cf30303d32cc771c3eb352a8b9247993c',
            '20260916225824_sagesse_battle_votes_communaute.sql': '87995d36e227a19b488c99d7bd43c8d87224d5c565ce83ccfe0a0807da16a1ee',
          }
          chunks = []
          for i in range(1,5):
              text = ''.join(Path(f'.patches/step2_upload_{i:02d}.b64').read_text().split())
              want_len, want_sha = part_expected[i]
              got = hashlib.sha256(text.encode()).hexdigest()
              print(f'part {i}: len={len(text)} sha={got}')
              assert len(text) == want_len and got == want_sha
              chunks.append(text)
          packed = base64.b64decode(''.join(chunks), validate=True)
          got_bundle = hashlib.sha256(packed).hexdigest()
          print('step2 bundle:', got_bundle)
          assert got_bundle == '183a0681e102509e3ad58077a88538e703ea797903f9678ad48214fbb2bd89c4'
          raw = gzip.decompress(packed)
          out = Path('/tmp/fitila-patches')
          pos = 0
          found = set()
          while pos < len(raw):
              assert raw.startswith(b'###FILE ', pos)
              eol = raw.find(b'\n', pos)
              name, size_s = raw[pos+8:eol].decode().rsplit(' ', 1)
              size = int(size_s)
              start, end = eol+1, eol+1+size
              assert raw[end:end+8] == b'\n###END\n'
              data = raw[start:end]
              if name in expected:
                  got = hashlib.sha256(data).hexdigest()
                  print(name, got)
                  assert got == expected[name]
                  (out/name).write_bytes(data)
                  found.add(name)
              pos = end + 8
          assert found == set(expected)
          PY

      - name: Rebuild exact intended final state from patch bases
        shell: bash
        run: |
          set -euo pipefail
          git cat-file -e 260af91^{blob}
          git cat-file -e 65b45cc^{blob}
          rm -rf /tmp/intended
          mkdir -p /tmp/intended/fitila_flutter/lib/core /tmp/intended/supabase/migrations
          git cat-file blob 260af91 > /tmp/intended/fitila_flutter/lib/main.dart
          git cat-file blob 65b45cc > /tmp/intended/fitila_flutter/lib/core/fitila_backend.dart
          cp /tmp/intended/fitila_flutter/lib/main.dart /tmp/base_main.dart
          cp /tmp/intended/fitila_flutter/lib/core/fitila_backend.dart /tmp/base_backend.dart
          cd /tmp/intended
          git init -q
          git config user.name OpenAI
          git config user.email noreply@openai.com
          git add . && git commit -qm base
          for p in \
            0002-design-premium-6-modules.patch \
            0003-handunia-wasa-socle-technique.patch \
            0004-handunia-wasa-dynamique-social.patch \
            0005-sagesse-battle-proverbe-a-trou-ia.patch \
            0006-aburu-fim-galerie-live-video.patch \
            0007-sasara-ia-edition-ligne-par-ligne.patch \
            0008-fil-fitila-createur-contenu-plein-ecran-kuaishou.patch
          do
            echo "Applying exact $p"
            git apply --check "/tmp/fitila-patches/$p"
            git apply --whitespace=nowarn "/tmp/fitila-patches/$p"
          done
          test "$(git hash-object fitila_flutter/lib/main.dart | cut -c1-7)" = "ab705fb"
          test "$(git hash-object fitila_flutter/lib/core/fitila_backend.dart | cut -c1-7)" = "f6bec81"
          cmp -s \
            /tmp/fitila-patches/20260916225824_sagesse_battle_votes_communaute.sql \
            supabase/migrations/20260916225824_sagesse_battle_votes_communaute.sql

      - name: Merge intended final state with current online branch
        shell: bash
        run: |
          set -euo pipefail
          cp fitila_flutter/lib/main.dart /tmp/current_main.dart
          cp fitila_flutter/lib/core/fitila_backend.dart /tmp/current_backend.dart
          cp /tmp/current_main.dart /tmp/merged_main.dart
          cp /tmp/current_backend.dart /tmp/merged_backend.dart

          set +e
          git merge-file -p --diff3 /tmp/current_main.dart /tmp/base_main.dart /tmp/intended/fitila_flutter/lib/main.dart > /tmp/main_preview.dart
          main_conflicts=$?
          git merge-file -p --diff3 /tmp/current_backend.dart /tmp/base_backend.dart /tmp/intended/fitila_flutter/lib/core/fitila_backend.dart > /tmp/backend_preview.dart
          backend_conflicts=$?
          set -e
          echo "main merge conflict count/status: $main_conflicts"
          echo "backend merge conflict count/status: $backend_conflicts"
          grep -c '^<<<<<<<' /tmp/main_preview.dart || true
          grep -c '^<<<<<<<' /tmp/backend_preview.dart || true

          # Latest uploaded patch chain wins only overlapping regions;
          # all non-conflicting changes from the online branch are preserved.
          git merge-file --theirs /tmp/merged_main.dart /tmp/base_main.dart /tmp/intended/fitila_flutter/lib/main.dart || true
          git merge-file --theirs /tmp/merged_backend.dart /tmp/base_backend.dart /tmp/intended/fitila_flutter/lib/core/fitila_backend.dart || true
          ! grep -q '^<<<<<<<\|^=======\|^>>>>>>>' /tmp/merged_main.dart
          ! grep -q '^<<<<<<<\|^=======\|^>>>>>>>' /tmp/merged_backend.dart
          cp /tmp/merged_main.dart fitila_flutter/lib/main.dart
          cp /tmp/merged_backend.dart fitila_flutter/lib/core/fitila_backend.dart
          cp /tmp/intended/supabase/migrations/20260916221308_handunia_wasa_monde_vivant.sql supabase/migrations/
          cp /tmp/intended/supabase/migrations/20260916222617_handunia_wasa_dynamique_social.sql supabase/migrations/
          cp /tmp/intended/supabase/migrations/20260916225824_sagesse_battle_votes_communaute.sql supabase/migrations/

          echo "87995d36e227a19b488c99d7bd43c8d87224d5c565ce83ccfe0a0807da16a1ee  supabase/migrations/20260916225824_sagesse_battle_votes_communaute.sql" | sha256sum -c -
          test "$(find supabase/migrations -maxdepth 1 -type f -name '20260916225824_sagesse_battle_votes_communaute.sql' | wc -l)" -eq 1
          git diff --check

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          channel: stable
          cache: true

      - name: Resolve Flutter dependencies
        run: cd fitila_flutter && flutter pub get

      - name: Analyze merged Flutter application
        run: cd fitila_flutter && flutter analyze

      - name: Commit and push application integration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "OpenAI"
          git config user.email "noreply@openai.com"
          git add \
            fitila_flutter/lib/main.dart \
            fitila_flutter/lib/core/fitila_backend.dart \
            supabase/migrations/20260916221308_handunia_wasa_monde_vivant.sql \
            supabase/migrations/20260916222617_handunia_wasa_dynamique_social.sql \
            supabase/migrations/20260916225824_sagesse_battle_votes_communaute.sql
          git diff --cached --check
          git diff --cached --quiet && { echo 'No application changes to commit'; exit 1; }
          git commit -m "feat(fitila): integrate creation IA patches 0002-0008"
          git push origin HEAD:${GITHUB_REF_NAME}
